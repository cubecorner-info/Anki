  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<body class="h-screen w-screen flex flex-col relative text-slate-100 select-none">

  <!-- Header -->
  <header class="px-8 py-5 bg-slate-950/90 border-b border-white/10 flex items-center justify-between flex-shrink-0 z-20">
    <div class="flex items-center space-x-3">
      <span class="text-3xl animate-bounce">⚡</span>
      <h1 class="text-2xl graffiti-title tracking-tight">AnkiFlow</h1>
      <span class="text-[10px] font-mono tracking-widest bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/40 px-2.5 py-1 rounded-full font-bold uppercase">Pro Tablet</span>
    </div>
    <div class="flex gap-3">
      <button id="nav-decks" onclick="switchView('decks')" class="px-6 py-3 rounded-2xl text-sm font-black font-display tracking-wider bg-sky-500 text-slate-950 shadow-[0_0_20px_rgba(56,189,248,0.4)] active:scale-95 transition">DECKS</button>
      <button id="nav-browser" onclick="switchView('browser')" class="px-6 py-3 rounded-2xl text-sm font-black font-display tracking-wider bg-white/5 text-slate-300 hover:bg-white/10 active:scale-95 transition">BROWSER</button>
    </div>
  </header>

  <main id="app-root" class="flex-1 overflow-y-auto relative">
    <!-- Views Render Here -->
  </main>

  <script>
    const DB_NAME = "AnkiFlowNativeDB";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("decks")) db.createObjectStore("decks", { keyPath: "id" });
          if (!db.objectStoreNames.contains("cards")) {
            const cardStore = db.createObjectStore("cards", { keyPath: "id" });
            cardStore.createIndex("did", "did", { unique: false });
          }
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "name" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutBatch(storeName, items) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetMediaMap() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("media", "readonly");
        const store = tx.objectStore("media");
        const req = store.getAll();
        req.onsuccess = () => {
          const map = {};
          (req.result || []).forEach(item => {
            const blob = new Blob([item.data]);
            map[item.name.toLowerCase()] = URL.createObjectURL(blob);
          });
          resolve(map);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function dbUpdateCard(card) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        store.put(card);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbUpdateCardsBatch(cards) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        cards.forEach(c => store.put(c));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    let state = {
      view: 'decks',
      decks: [],
      cards: [],
      mediaMap: {},
      studyTarget: null,
      studyCards: [],
      studyIndex: 0,
      showAnswer: false,
      showExtraInfo: false,
      searchQuery: '',
      selectedTagPrefix: '',
      expandedTags: new Set(),
      selectedCardIds: new Set(),
      sidebarWidth: 320,
      isResizing: false
    };

    async function refreshData() {
      state.decks = await dbGetAll("decks");
      state.cards = await dbGetAll("cards");
      state.mediaMap = await dbGetMediaMap();
      render();
    }

    function switchView(viewName) {
      state.view = viewName;
      document.getElementById('nav-decks').className = viewName === 'decks' 
        ? "px-6 py-3 rounded-2xl text-sm font-black font-display tracking-wider bg-sky-500 text-slate-950 shadow-[0_0_20px_rgba(56,189,248,0.4)] active:scale-95 transition" 
        : "px-6 py-3 rounded-2xl text-sm font-black font-display tracking-wider bg-white/5 text-slate-300 hover:bg-white/10 active:scale-95 transition";
      document.getElementById('nav-browser').className = viewName === 'browser' 
        ? "px-6 py-3 rounded-2xl text-sm font-black font-display tracking-wider bg-sky-500 text-slate-950 shadow-[0_0_20px_rgba(56,189,248,0.4)] active:scale-95 transition" 
        : "px-6 py-3 rounded-2xl text-sm font-black font-display tracking-wider bg-white/5 text-slate-300 hover:bg-white/10 active:scale-95 transition";
      render();
    }

    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full p-8 space-y-6">
          <div class="w-16 h-16 rounded-full border-4 border-fuchsia-500 border-t-amber-400 animate-spin"></div>
          <p class="text-xl font-bold font-display text-sky-400">UNPACKING ANKI DECK PACKAGE...</p>
        </div>`;

      try {
        const zip = await JSZip.loadAsync(file);
        
        // Universal APKG Database Finder (supports V1, V2, V3/V18)
        let dbFile = zip.file("collection.anki21b") || zip.file("collection.anki21") || zip.file("collection.anki2");
        if (!dbFile) {
          const files = Object.keys(zip.files);
          const sqliteCandidate = files.find(f => f.includes("collection.anki"));
          if (sqliteCandidate) dbFile = zip.file(sqliteCandidate);
        }
        
        if (!dbFile) throw new Error("Could not locate Anki collection database in file.");

        const dbBuffer = await dbFile.async("uint8array");
        const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
        const db = new SQL.Database(dbBuffer);

        let mediaNameMap = {};
        const mediaJsonFile = zip.file("media");
        if (mediaJsonFile) {
          const mediaJsonStr = await mediaJsonFile.async("text");
          try { mediaNameMap = JSON.parse(mediaJsonStr); } catch (e) {}
        }

        const mediaItems = [];
        for (const [zipKey, realName] of Object.entries(mediaNameMap)) {
          const imgFile = zip.file(zipKey);
          if (imgFile) {
            const data = await imgFile.async("uint8array");
            mediaItems.push({ name: realName.toLowerCase(), data });
          }
        }
        if (mediaItems.length > 0) await dbPutBatch("media", mediaItems);

        // Safe table schema inspector to bypass version lock
        const tablesRes = db.exec("SELECT name FROM sqlite_master WHERE type='table'");
        const existingTables = new Set(tablesRes[0]?.values.map(v => v[0]) || []);

        let decks = [];
        if (existingTables.has("col")) {
          const colInfo = db.exec("PRAGMA table_info(col)")[0].values.map(v => v[1]);
          let decksJsonRaw = null;

          if (colInfo.includes("decks")) {
            const res = db.exec("SELECT decks FROM col");
            decksJsonRaw = res[0]?.values[0]?.[0];
          }

          if (decksJsonRaw) {
            try {
              const decksObj = JSON.parse(decksJsonRaw);
              for (const [id, d] of Object.entries(decksObj)) {
                if (d.name && d.name !== "Default") {
                  decks.push({ id: String(d.id), name: d.name.replace(/[\x1f\u001f]/g, "::").trim() });
                }
              }
            } catch (e) {}
          }
        }

        if (decks.length === 0 && existingTables.has("decks")) {
          const res = db.exec("SELECT id, name FROM decks");
          if (res.length > 0) {
            res[0].values.forEach(row => {
              decks.push({ id: String(row[0]), name: String(row[1]).replace(/[\x1f\u001f]/g, "::").trim() });
            });
          }
        }

        // Direct Notes & Cards Extraction
        const notesMap = new Map();
        if (existingTables.has("notes")) {
          const notesRes = db.exec("SELECT id, mid, flds, tags FROM notes");
          if (notesRes.length > 0) {
            notesRes[0].values.forEach(row => {
              const [id, mid, flds, tags] = row;
              const fields = (flds || "").split("\x1f");
              const tagList = tags ? tags.trim().split(/\s+/).filter(Boolean) : [];
              notesMap.set(String(id), { id: String(id), fields, tags: tagList });
            });
          }
        }

        const cards = [];
        if (existingTables.has("cards")) {
          const cardsRes = db.exec("SELECT id, nid, did, ord, queue, factor, reps, ivl, due FROM cards");
          if (cardsRes.length > 0) {
            cardsRes[0].values.forEach(row => {
              const [id, nid, did, ord, queue, factor, reps, ivl, due] = row;
              const note = notesMap.get(String(nid));
              if (note) {
                cards.push({
                  id: String(id),
                  nid: String(nid),
                  did: String(did),
                  ord: ord || 0,
                  fields: note.fields,
                  tags: note.tags,
                  suspended: queue === -1,
                  interval: ivl || 0,
                  easeFactor: (factor || 2500) / 1000,
                  reps: reps || 0,
                  dueDate: due || Date.now()
                });
              }
            });
          }
        }

        db.close();

        if (decks.length === 0) {
          decks.push({ id: "1", name: file.name.replace(".apkg", "") });
          cards.forEach(c => c.did = "1");
        }

        await dbPutBatch("decks", decks);
        await dbPutBatch("cards", cards);
        await refreshData();
      } catch (err) {
        alert("Import failed: " + err.message);
        render();
      }
    }

    // Comprehensive Cloze Parsing Engine
    function renderCardField(html, isFront = true, cardOrd = 0) {
      if (!html) return "";
      let processed = html;

      processed = processed.replace(/src=["']([^"']+)["']/gi, (match, src) => {
        const cleanName = src.split('/').pop().toLowerCase();
        if (state.mediaMap[cleanName]) {
          return `src="${state.mediaMap[cleanName]}"`;
        }
        return match;
      });

      const clozeRegex = /\{\{c(\d+)::(.*?)\}\}/gi;
      const targetOrd = cardOrd + 1;

      processed = processed.replace(clozeRegex, (match, numStr, body) => {
        const num = parseInt(numStr);
        if (num !== targetOrd) {
          // Non-active cloze deletions show pure answer text
          return body.split("::")[0];
        }

        const parts = body.split("::");
        const answerText = parts[0];
        const hintText = parts[1] || "...";

        if (isFront) {
          return `<span class="cloze-bracket">[ ${hintText} ]</span>`;
        } else {
          return `<span class="cloze-reveal">${answerText}</span>`;
        }
      });

      return processed;
    }

    function calculateNextIntervals(interval, easeFactor) {
      const again = 0;
      const hard = interval === 0 ? 1 : Math.max(1, Math.round(interval * 1.2));
      const good = interval === 0 ? 1 : Math.max(1, Math.round(interval * easeFactor));
      const easy = interval === 0 ? 4 : Math.max(1, Math.round(interval * easeFactor * 1.3));

      const formatIvl = (d) => d === 0 ? "<1d" : `${d}d`;
      return {
        again: { days: again, label: "<1d" },
        hard: { days: hard, label: formatIvl(hard) },
        good: { days: good, label: formatIvl(good) },
        easy: { days: easy, label: formatIvl(easy) }
      };
    }

    function buildTagTree() {
      const root = { children: {} };

      state.cards.forEach(card => {
        if (!card.tags || !Array.isArray(card.tags)) return;
        card.tags.forEach(fullTag => {
          const parts = fullTag.split("::").map(p => p.trim()).filter(Boolean);
          let current = root;
          let currentPath = "";

          parts.forEach((part) => {
            currentPath = currentPath ? `${currentPath}::${part}` : part;
            if (!current.children[part]) {
              current.children[part] = {
                name: part,
                fullPath: currentPath,
                children: {},
                count: 0
              };
            }
            current.children[part].count++;
            current = current.children[part];
          });
        });
      });

      return root.children;
    }

    function toggleTagExpand(fullPath) {
      if (state.expandedTags.has(fullPath)) {
        state.expandedTags.delete(fullPath);
      } else {
        state.expandedTags.add(fullPath);
      }
      render();
    }

    function selectTagFilter(fullPath) {
      state.selectedTagPrefix = (state.selectedTagPrefix === fullPath) ? '' : fullPath;
      render();
    }

    async function toggleSuspendByTag(fullPath, suspendState) {
      const targetCards = state.cards.filter(c => 
        c.tags && c.tags.some(t => t === fullPath || t.startsWith(fullPath + '::'))
      );
      if (targetCards.length === 0) return;

      targetCards.forEach(c => { c.suspended = suspendState; });
      await dbUpdateCardsBatch(targetCards);
      await refreshData();
    }

    async function toggleSelectedCardsSuspension(suspendState) {
      if (state.selectedCardIds.size === 0) return;
      const targetCards = state.cards.filter(c => state.selectedCardIds.has(c.id));
      targetCards.forEach(c => { c.suspended = suspendState; });
      await dbUpdateCardsBatch(targetCards);
      state.selectedCardIds.clear();
      await refreshData();
    }

    async function toggleSingleCardSuspend(cardId) {
      const card = state.cards.find(c => c.id === cardId);
      if (!card) return;
      card.suspended = !card.suspended;
      await dbUpdateCard(card);
      await refreshData();
    }

    function renderTagTreeNode(node) {
      const hasChildren = Object.keys(node.children).length > 0;
      const isExpanded = state.expandedTags.has(node.fullPath);
      const isSelected = state.selectedTagPrefix === node.fullPath;

      const tagCards = state.cards.filter(c => c.tags && c.tags.some(t => t === node.fullPath || t.startsWith(node.fullPath + '::')));
      const suspendedCount = tagCards.filter(c => c.suspended).length;
      const allSuspended = tagCards.length > 0 && suspendedCount === tagCards.length;

      const childNodesHtml = hasChildren && isExpanded ? `
        <div class="pl-3 border-l-2 border-slate-700/60 ml-2 space-y-1 mt-1">
          ${Object.values(node.children).map(child => renderTagTreeNode(child)).join('')}
        </div>
      ` : '';

      return `
        <div class="text-sm my-0.5">
          <div class="flex items-center justify-between py-2 px-3 rounded-xl hover:bg-white/5 transition ${isSelected ? 'bg-sky-500/20 border-2 border-sky-400 text-sky-200 font-bold' : 'text-slate-300'}">
            <div class="flex items-center space-x-2 flex-1 min-w-0 pr-2">
              ${hasChildren ? `
                <button onclick="event.stopPropagation(); toggleTagExpand('${node.fullPath}')" class="w-5 h-5 text-slate-400 hover:text-white flex items-center justify-center font-mono text-[10px] bg-slate-800 rounded">
                  ${isExpanded ? '▼' : '►'}
                </button>
              ` : '<span class="w-5"></span>'}
              <span onclick="selectTagFilter('${node.fullPath}')" class="truncate cursor-pointer text-base font-semibold hover:underline">
                🏷️ ${node.name}
              </span>
            </div>
            
            <div class="flex items-center space-x-2 flex-shrink-0">
              <button onclick="event.stopPropagation(); toggleSuspendByTag('${node.fullPath}', ${!allSuspended})" 
                      title="${allSuspended ? 'Unsuspend Tag Cards' : 'Suspend Tag Cards'}"
                      class="px-2 py-1 text-[11px] font-mono font-bold rounded-lg transition ${allSuspended ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/40' : 'bg-slate-800 text-slate-400 hover:text-rose-400 hover:bg-slate-700'}">
                ${allSuspended ? '⚡ UNSUSPEND' : '⏸️ SUSPEND'}
              </button>

              <span onclick="selectTagFilter('${node.fullPath}')" class="font-mono text-xs font-black text-slate-400 bg-slate-900 px-2 py-1 rounded-lg border border-white/5 cursor-pointer">
                ${node.count}
              </span>
            </div>
          </div>
          ${childNodesHtml}
        </div>
      `;
    }

    function buildCleanDeckTree() {
      const root = { children: {} };
      state.decks.forEach(d => {
        const parts = d.name.split("::").map(p => p.trim()).filter(Boolean);
        let current = root;
        parts.forEach((part, idx) => {
          if (!current.children[part]) {
            current.children[part] = {
              displayName: part,
              fullName: parts.slice(0, idx + 1).join("::"),
              deckId: idx === parts.length - 1 ? d.id : null,
              children: {},
              allDeckIds: new Set()
            };
          }
          if (idx === parts.length - 1) current.children[part].deckId = d.id;
          current = current.children[part];
        });
      });

      function populateStats(node) {
        const childNodes = Object.values(node.children);
        let directCards = [];
        let descendantDeckIds = new Set();

        if (node.deckId) {
          descendantDeckIds.add(node.deckId);
          directCards = state.cards.filter(c => c.did === node.deckId);
        }

        let allNodeCards = [...directCards];
        childNodes.forEach(child => {
          populateStats(child);
          child.allDeckIds.forEach(id => descendantDeckIds.add(id));
          allNodeCards = allNodeCards.concat(state.cards.filter(c => child.allDeckIds.has(c.did)));
        });

        const uniqueCardsMap = new Map();
        allNodeCards.forEach(c => uniqueCardsMap.set(c.id, c));
        const uniqueCards = Array.from(uniqueCardsMap.values());

        node.newCount = uniqueCards.filter(c => !c.suspended && c.reps === 0).length;
        node.learningCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval < 1).length;
        node.reviewCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval >= 1).length;
        node.suspendedTotal = uniqueCards.filter(c => c.suspended).length;
        node.allDeckIds = descendantDeckIds;
      }

      Object.values(root.children).forEach(populateStats);
      return root.children;
    }

    function renderDecksView() {
      const tree = buildCleanDeckTree();
      const nodes = Object.values(tree);

      let decksHtml = nodes.map(node => `
        <div onclick="startStudy('${node.displayName}', '${Array.from(node.allDeckIds).join(',')}')" class="flex items-center justify-between p-6 my-3 panel-card hover:border-sky-400/50 rounded-3xl cursor-pointer transition-all active:scale-[0.99] group">
          <div class="flex items-center space-x-4">
            <div class="w-12 h-12 rounded-2xl bg-sky-500/10 border border-sky-400/30 flex items-center justify-center text-xl group-hover:scale-110 transition">📦</div>
            <div>
              <span class="font-extrabold text-slate-100 text-xl tracking-tight block">${node.displayName}</span>
              <span class="text-xs font-mono text-slate-400">${node.suspendedTotal > 0 ? `⏸️ ${node.suspendedTotal} suspended cards` : 'Ready to grind'}</span>
            </div>
          </div>

          <div class="flex items-center space-x-3 font-mono font-bold">
            <span class="text-sky-400 bg-sky-950/80 border-2 border-sky-500/40 px-4 py-2 rounded-2xl text-sm pop-badge">${node.newCount} NEW</span>
            <span class="text-rose-400 bg-rose-950/80 border-2 border-rose-500/40 px-4 py-2 rounded-2xl text-sm pop-badge">${node.learningCount} LEARN</span>
            <span class="text-lime-400 bg-lime-950/80 border-2 border-lime-500/40 px-4 py-2 rounded-2xl text-sm pop-badge">${node.reviewCount} REV</span>
          </div>
        </div>
      `).join('');

      return `
        <div class="max-w-5xl mx-auto p-6 md:p-10 space-y-8">
          <div class="border-2 border-dashed border-fuchsia-500/40 bg-fuchsia-950/10 hover:border-fuchsia-400 rounded-3xl p-10 text-center cursor-pointer transition shadow-2xl">
            <input type="file" accept=".apkg" onchange="handleFileUpload(event)" id="file-input" class="hidden" />
            <label for="file-input" class="cursor-pointer block space-y-3">
              <span class="text-5xl block animate-pulse">✨</span>
              <p class="font-black text-2xl font-display text-slate-100 tracking-wide">DROP YOUR ANKI DECK (.apkg)</p>
              <p class="text-sm font-semibold text-slate-400">Tap here to select deck files from your device</p>
            </label>
          </div>
          <div class="space-y-3">${decksHtml || `<div class="text-center py-16 text-slate-500 font-extrabold text-xl font-display">NO DECKS FOUND. IMPORT ONE ABOVE!</div>`}</div>
        </div>
      `;
    }

    function startStudy(title, deckIdsStr) {
      const deckIds = new Set(deckIdsStr.split(','));
      state.studyTarget = title;
      state.studyCards = state.cards.filter(c => deckIds.has(c.did) && !c.suspended);
      state.studyIndex = 0;
      state.showAnswer = false;
      state.showExtraInfo = false;
      state.view = 'study';
      render();
    }

    async function processRating(rating) {
      const currentCard = state.studyCards[state.studyIndex];
      const ivls = calculateNextIntervals(currentCard.interval || 0, currentCard.easeFactor || 2.5);

      let newInterval = currentCard.interval || 0;
      let newEase = currentCard.easeFactor || 2.5;

      if (rating === 1) { newInterval = ivls.again.days; newEase = Math.max(1.3, newEase - 0.2); }
      else if (rating === 2) { newInterval = ivls.hard.days; }
      else if (rating === 3) { newInterval = ivls.good.days; }
      else if (rating === 4) { newInterval = ivls.easy.days; newEase += 0.15; }

      await dbUpdateCard({
        ...currentCard,
        reps: (currentCard.reps || 0) + 1,
        interval: newInterval,
        easeFactor: newEase,
        dueDate: Date.now() + newInterval * 86400000
      });

      state.showAnswer = false;
      state.showExtraInfo = false;
      if (state.studyIndex < state.studyCards.length - 1) {
        state.studyIndex++;
        render();
      } else {
        await refreshData();
        switchView('decks');
      }
    }

    function renderStudyView() {
      const currentCard = state.studyCards[state.studyIndex];

      if (!currentCard) {
        return `
          <div class="flex flex-col items-center justify-center h-full p-8 text-center space-y-6">
            <span class="text-7xl animate-bounce">🔥</span>
            <h2 class="text-4xl font-black font-display text-sky-400">DECK CLEARED! YOU'RE UNSTOPPABLE</h2>
            <button onclick="switchView('decks')" class="px-8 py-4 bg-sky-500 text-slate-950 rounded-2xl text-xl font-black font-display shadow-2xl active:scale-95 transition">
              BACK TO DECKS
            </button>
          </div>
        `;
      }

      const ivls = calculateNextIntervals(currentCard.interval || 0, currentCard.easeFactor || 2.5);
      const extraFields = (currentCard.fields || []).slice(2).filter(f => f && f.trim() !== "");

      return `
        <div class="max-w-5xl mx-auto h-full flex flex-col p-6 md:p-8 justify-between">
          <div class="flex items-center justify-between text-base font-extrabold text-slate-400 mb-4 font-mono">
            <button onclick="switchView('decks')" class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-xl text-sm font-black text-slate-200">← EXIT</button>
            <span class="text-sky-400 bg-sky-950/60 border border-sky-500/30 px-4 py-1.5 rounded-full">${state.studyTarget} (${state.studyIndex + 1} / ${state.studyCards.length})</span>
          </div>

          <div onclick="if (!state.showAnswer) { state.showAnswer = true; render(); }" class="flex-1 panel-card rounded-3xl p-8 md:p-12 flex flex-col justify-between overflow-y-auto mb-6 shadow-2xl border-2 border-white/10 cursor-pointer">
            <div class="space-y-8">
              <!-- Front Field -->
              <div class="card-content text-slate-100 text-2xl md:text-3xl leading-relaxed font-bold text-center">
                ${renderCardField(currentCard.fields?.[0], true, currentCard.ord)}
              </div>

              <!-- Answer Field -->
              ${state.showAnswer ? `
                <hr class="w-full border-white/15 my-6" />
                <div class="card-content text-slate-200 text-xl md:text-2xl leading-relaxed font-semibold text-center">
                  ${renderCardField(currentCard.fields?.[1] || currentCard.fields?.[0], false, currentCard.ord)}
                </div>
              ` : ''}

              <!-- Additional Info Panel -->
              ${state.showAnswer && extraFields.length > 0 ? `
                <div class="mt-8 pt-6 border-t border-white/10">
                  <button onclick="event.stopPropagation(); state.showExtraInfo = !state.showExtraInfo; render();" class="w-full py-3 px-5 bg-white/5 hover:bg-white/10 text-sky-400 rounded-2xl text-sm font-extrabold flex items-center justify-between transition border border-white/10">
                    <span class="font-display tracking-wider">💡 EXTRA INSIGHTS (${extraFields.length})</span>
                    <span>${state.showExtraInfo ? '▲ HIDE' : '▼ VIEW'}</span>
                  </button>
                  ${state.showExtraInfo ? `
                    <div class="mt-4 p-6 bg-slate-950/90 rounded-2xl border border-white/10 space-y-6 text-base text-slate-300 card-content">
                      ${extraFields.map((fieldHtml, idx) => `
                        <div>
                          <span class="text-xs font-mono uppercase tracking-widest text-fuchsia-400 block mb-2 font-bold">FIELD ${idx + 1}</span>${renderCardField(fieldHtml, false, currentCard.ord)}
                        </div>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              ` : ''}
            </div>

            <!-- Tags Section -->
            <div class="mt-8 pt-4 border-t border-white/10 flex flex-wrap gap-2 justify-center items-center">
              ${(currentCard.tags && currentCard.tags.length > 0) ? 
                currentCard.tags.map(tag => {
                  const leafName = tag.split("::").pop();
                  return `<span title="${tag}" class="text-xs font-mono bg-sky-950/90 border border-sky-400/40 text-sky-300 px-3.5 py-1.5 rounded-xl font-bold">#${leafName}</span>`;
                }).join('') : '<span class="text-xs text-slate-500 font-mono">No tags</span>'}
            </div>
          </div>

          <div class="pb-2">
            ${!state.showAnswer ? `
              <button onclick="state.showAnswer = true; render();" class="w-full py-6 bg-sky-500 hover:bg-sky-400 active:scale-[0.98] text-slate-950 font-black font-display text-2xl rounded-3xl shadow-[0_0_30px_rgba(56,189,248,0.4)] transition">
                SHOW ANSWER
              </button>
            ` : `
              <div class="grid grid-cols-4 gap-4">
                <button onclick="processRating(1)" class="py-5 bg-rose-950/90 hover:bg-rose-900 border-2 border-rose-500/60 text-rose-200 rounded-3xl flex flex-col items-center justify-center active:scale-95 transition pop-badge">
                  <span class="text-xs opacity-75 font-mono font-bold">${ivls.again.label}</span>
                  <span class="text-xl font-black font-display">AGAIN</span>
                </button>
                <button onclick="processRating(2)" class="py-5 bg-amber-950/90 hover:bg-amber-900 border-2 border-amber-500/60 text-amber-200 rounded-3xl flex flex-col items-center justify-center active:scale-95 transition pop-badge">
                  <span class="text-xs opacity-75 font-mono font-bold">${ivls.hard.label}</span>
                  <span class="text-xl font-black font-display">HARD</span>
                </button>
                <button onclick="processRating(3)" class="py-5 bg-lime-950/90 hover:bg-lime-900 border-2 border-lime-500/60 text-lime-200 rounded-3xl flex flex-col items-center justify-center active:scale-95 transition pop-badge">
                  <span class="text-xs opacity-75 font-mono font-bold">${ivls.good.label}</span>
                  <span class="text-xl font-black font-display">GOOD</span>
                </button>
                <button onclick="processRating(4)" class="py-5 bg-sky-950/90 hover:bg-sky-900 border-2 border-sky-500/60 text-sky-200 rounded-3xl flex flex-col items-center justify-center active:scale-95 transition pop-badge">
                  <span class="text-xs opacity-75 font-mono font-bold">${ivls.easy.label}</span>
                  <span class="text-xl font-black font-display">EASY</span>
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function toggleSelectAllCards(filteredCards, checked) {
      if (checked) {
        filteredCards.forEach(c => state.selectedCardIds.add(c.id));
      } else {
        state.selectedCardIds.clear();
      }
      render();
    }

    function toggleSelectCard(cardId) {
      if (state.selectedCardIds.has(cardId)) {
        state.selectedCardIds.delete(cardId);
      } else {
        state.selectedCardIds.add(cardId);
      }
      render();
    }

    function startResizing(e) {
      state.isResizing = true;
      document.body.style.cursor = 'col-resize';
      document.addEventListener('mousemove', handleResizing);
      document.addEventListener('mouseup', stopResizing);
      document.addEventListener('touchmove', handleResizingTouch);
      document.addEventListener('touchend', stopResizing);
    }

    function handleResizing(e) {
      if (!state.isResizing) return;
      const newWidth = Math.max(180, Math.min(600, e.clientX - 24));
      state.sidebarWidth = newWidth;
      const sidebar = document.getElementById('tag-sidebar');
      if (sidebar) sidebar.style.width = `${newWidth}px`;
    }

    function handleResizingTouch(e) {
      if (!state.isResizing || !e.touches[0]) return;
      const newWidth = Math.max(180, Math.min(600, e.touches[0].clientX - 24));
      state.sidebarWidth = newWidth;
      const sidebar = document.getElementById('tag-sidebar');
      if (sidebar) sidebar.style.width = `${newWidth}px`;
    }

    function stopResizing() {
      state.isResizing = false;
      document.body.style.cursor = 'default';
      document.removeEventListener('mousemove', handleResizing);
      document.removeEventListener('mouseup', stopResizing);
      document.removeEventListener('touchmove', handleResizingTouch);
      document.removeEventListener('touchend', stopResizing);
    }

    function renderBrowserView() {
      const q = state.searchQuery.toLowerCase().trim();
      const tagTree = buildTagTree();

      const filtered = state.cards.filter(c => {
        const matchesQuery = !q || (c.fields?.[0] || "").toLowerCase().includes(q) || (c.fields?.[1] || "").toLowerCase().includes(q);
        const matchesTag = !state.selectedTagPrefix || (c.tags && c.tags.some(t => t === state.selectedTagPrefix || t.startsWith(state.selectedTagPrefix + '::')));
        return matchesQuery && matchesTag;
      });

      const allSelected = filtered.length > 0 && filtered.every(c => state.selectedCardIds.has(c.id));

      return `
        <div class="flex h-full max-w-7xl mx-auto p-6 gap-0 overflow-hidden relative">
          <!-- Draggable Tag Hierarchy Sidebar -->
          <div id="tag-sidebar" style="width: ${state.sidebarWidth}px;" class="bg-slate-900/90 border-2 border-white/10 rounded-3xl p-4 flex flex-col h-full flex-shrink-0 shadow-2xl z-10">
            <div class="flex items-center justify-between pb-3 mb-3 border-b-2 border-white/10">
              <span class="text-xs font-black uppercase tracking-widest text-fuchsia-400 font-mono">🏷️ TAG HIERARCHY</span>
              ${state.selectedTagPrefix ? `
                <button onclick="state.selectedTagPrefix = ''; render();" class="text-xs text-rose-400 font-bold hover:underline">RESET</button>
              ` : ''}
            </div>
            
            <div class="flex-1 overflow-y-auto space-y-1 pr-1">
              ${Object.keys(tagTree).length > 0 ? 
                Object.values(tagTree).map(node => renderTagTreeNode(node)).join('') : 
                '<div class="text-sm text-slate-500 p-4 font-bold">No tags indexed</div>'}
            </div>
          </div>

          <!-- Resizer Handle -->
          <div onmousedown="startResizing(event)" ontouchstart="startResizing(event)" class="resizer-handle h-full flex items-center justify-center mx-1 rounded-full">
            <div class="w-1 h-8 bg-white/30 rounded-full"></div>
          </div>

          <!-- Main Table Area -->
          <div class="flex-1 flex flex-col h-full gap-4 min-w-0">
            <div class="bg-slate-900/90 p-4 rounded-3xl border-2 border-white/10 flex flex-wrap items-center justify-between gap-4 shadow-2xl">
              <input type="text" value="${state.searchQuery}" oninput="state.searchQuery = this.value; render();" placeholder="Search cards..." class="flex-1 min-w-[200px] bg-slate-950 border-2 border-white/15 rounded-2xl px-5 py-3 text-base text-slate-100 font-semibold placeholder-slate-500 focus:outline-none focus:border-sky-400" />
              
              ${state.selectedCardIds.size > 0 ? `
                <div class="flex items-center space-x-2">
                  <span class="text-xs font-mono font-bold text-sky-400 bg-sky-950 px-3 py-2 rounded-xl border border-sky-500/30">${state.selectedCardIds.size} SELECTED</span>
                  <button onclick="toggleSelectedCardsSuspension(true)" class="px-3 py-2 bg-amber-500/20 text-amber-300 border border-amber-500/40 hover:bg-amber-500/40 rounded-xl text-xs font-black font-display">SUSPEND</button>
                  <button onclick="toggleSelectedCardsSuspension(false)" class="px-3 py-2 bg-lime-500/20 text-lime-300 border border-lime-500/40 hover:bg-lime-500/40 rounded-xl text-xs font-black font-display">UNSUSPEND</button>
                </div>
              ` : ''}

              ${state.selectedTagPrefix ? `
                <div class="text-xs font-mono bg-sky-950 border border-sky-400 text-sky-300 px-3 py-2 rounded-xl flex items-center gap-2">
                  <span>#${state.selectedTagPrefix}</span>
                  <button onclick="state.selectedTagPrefix = ''; render();" class="hover:text-white font-bold">✕</button>
                </div>
              ` : ''}
            </div>

            <div class="bg-slate-900/90 border-2 border-white/10 rounded-3xl overflow-y-auto flex-1 shadow-2xl">
              <table class="w-full text-left text-base border-collapse">
                <thead class="bg-slate-950 text-slate-400 sticky top-0 border-b-2 border-white/10 font-mono text-xs uppercase font-extrabold z-10">
                  <tr>
                    <th class="p-4 w-12 text-center">
                      <input type="checkbox" ${allSelected ? 'checked' : ''} onchange="toggleSelectAllCards(filtered, this.checked)" class="w-5 h-5 rounded border-white/20 bg-slate-800 text-sky-500 focus:ring-0 cursor-pointer" />
                    </th>
                    <th class="p-4">Status</th>
                    <th class="p-4">Front</th>
                    <th class="p-4">Back</th>
                    <th class="p-4">Tags</th>
                    <th class="p-4">Interval</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-white/5 font-medium">
                  ${filtered.slice(0, 100).map(c => {
                    const isSelected = state.selectedCardIds.has(c.id);
                    return `
                      <tr class="hover:bg-white/[0.04] transition ${c.suspended ? 'bg-amber-950/20 text-amber-200/70' : ''} ${isSelected ? 'bg-sky-950/40' : ''}">
                        <td class="p-4 text-center">
                          <input type="checkbox" ${isSelected ? 'checked' : ''} onchange="toggleSelectCard('${c.id}')" class="w-5 h-5 rounded border-white/20 bg-slate-800 text-sky-500 focus:ring-0 cursor-pointer" />
                        </td>
                        <td class="p-4">
                          <button onclick="toggleSingleCardSuspend('${c.id}')" class="px-2.5 py-1 text-xs font-mono font-bold rounded-lg ${c.suspended ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40' : 'bg-lime-500/20 text-lime-300 border border-lime-500/40'}">
                            ${c.suspended ? '⏸️ SUSPENDED' : '✅ ACTIVE'}
                          </button>
                        </td>
                        <td class="p-4 max-w-[220px] truncate font-bold text-slate-100">${c.fields?.[0] || ""}</td>
                        <td class="p-4 max-w-[220px] truncate text-slate-300">${c.fields?.[1] || ""}</td>
                        <td class="p-4 max-w-[180px] truncate">
                          ${(c.tags && c.tags.length > 0) ? c.tags.map(t => {
                            const leaf = t.split("::").pop();
                            return `<span title="${t}" class="inline-block text-[11px] font-mono bg-sky-950 border border-sky-400/30 text-sky-300 px-2 py-0.5 rounded-lg mr-1 font-bold">#${leaf}</span>`;
                          }).join('') : '<span class="text-slate-600">-</span>'}
                        </td>
                        <td class="p-4 font-mono text-xs font-bold">${c.interval || 0}d</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app-root');
      if (state.view === 'decks') root.innerHTML = renderDecksView();
      else if (state.view === 'study') root.innerHTML = renderStudyView();
      else if (state.view === 'browser') root.innerHTML = renderBrowserView();
    }

    refreshData();
  </script>
</body>
</html>
