<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {

            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: "Plus Jakarta Sans", -apple-system, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
    }
    .glass-card {
      background: rgba(17, 24, 39, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .cloze-bracket {
      color: #38bdf8;
      font-weight: 800;
      background: rgba(56, 189, 248, 0.15);
      border: 1px dashed rgba(56, 189, 248, 0.4);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .cloze-reveal {
      color: #34d399;
      font-weight: 800;
      background: rgba(52, 211, 153, 0.18);
      border: 1px solid rgba(52, 211, 153, 0.45);
      padding: 2px 8px;
      border-radius: 6px;
      display: inline-block;
    }
    .card-content img {
      max-width: 100%;
      max-height: 46vh;
      object-fit: contain;
      border-radius: 1rem;
      margin: 1.25rem auto;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .card-content audio {
      margin: 1.25rem auto;
      width: 100%;
      max-width: 380px;
    }
    .safe-bottom-margin {
      margin-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }

</head>
<body class="h-screen w-screen flex flex-col relative selection:bg-pink-500 selection:text-white">
  <div id="root" class="h-full w-full flex flex-col relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DB_NAME = "AnkiLiteDB";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("decks")) db.createObjectStore("decks", { keyPath: "id" });
          if (!db.objectStoreNames.contains("cards")) {
            const cardStore = db.createObjectStore("cards", { keyPath: "id" });
            cardStore.createIndex("did", "did", { unique: false });
          }
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "name" });
          if (!db.objectStoreNames.contains("userComments")) db.createObjectStore("userComments", { keyPath: "cardId" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutBatch(storeName, items) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetMedia(name) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("media", "readonly");
        const store = tx.objectStore("media");
        const req = store.get(name);
        req.onsuccess = () => resolve(req.result?.blob || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbUpdateCard(card) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        store.put(card);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbBatchUpdateCards(cardsToUpdate) {
      if (!cardsToUpdate || cardsToUpdate.length === 0) return;
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        cardsToUpdate.forEach(card => store.put(card));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteDeck(deckId, deckName, allDecks) {
      const prefix = deckName + "::";
      const matchingDeckIds = allDecks
        .filter(d => d.id === deckId || d.name === deckName || d.name.startsWith(prefix))
        .map(d => d.id);

      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["decks", "cards"], "readwrite");
        const deckStore = tx.objectStore("decks");
        const cardStore = tx.objectStore("cards");

        matchingDeckIds.forEach(id => deckStore.delete(id));
        const req = cardStore.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (matchingDeckIds.includes(cursor.value.did)) cursor.delete();
            cursor.continue();
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // --- Parser ---
    async function parseApkg(file) {
      const zip = await JSZip.loadAsync(file);
      let dbFile = zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbFile) throw new Error("Missing SQLite deck file in .apkg archive.");

      const dbBuffer = await dbFile.async("uint8array");
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const db = new SQL.Database(dbBuffer);

      const mediaJsonFile = zip.file("media");
      const mediaMap = mediaJsonFile ? JSON.parse(await mediaJsonFile.async("text")) : {};
      const mediaItems = [];
      for (const [key, filename] of Object.entries(mediaMap)) {
        const mFile = zip.file(key);
        if (mFile) {
          const blob = await mFile.async("blob");
          mediaItems.push({ name: filename.toLowerCase(), blob });
        }
      }
      if (mediaItems.length > 0) await dbPutBatch("media", mediaItems);

      const colRes = db.exec("SELECT decks, models FROM col");
      const decksJson = JSON.parse(colRes[0].values[0][0]);
      const modelsJson = JSON.parse(colRes[0].values[0][1]);
      
      const modelFieldNames = new Map();
      for (const [mid, model] of Object.entries(modelsJson)) {
        modelFieldNames.set(mid, (model.flds || []).map(f => f.name));
      }

      const decks = [];
      for (const [id, d] of Object.entries(decksJson)) {
        if (d.name && d.name !== "Default") {
          const normalizedName = d.name.replace(/[\x1f\u001f]/g, "::").trim();
          decks.push({ id: String(d.id), name: normalizedName });
        }
      }

      const notesRes = db.exec("SELECT id, mid, flds, tags FROM notes");
      const notesMap = new Map();
      if (notesRes.length > 0) {
        notesRes[0].values.forEach(row => {
          const [id, mid, flds, tags] = row;
          const fields = flds.split("\x1f");
          const tagList = tags ? tags.trim().split(/\s+/).filter(Boolean) : [];
          const fieldNames = modelFieldNames.get(String(mid)) || [];
          notesMap.set(id, { id, fields, tags: tagList, fieldNames });
        });
      }

      const cardsRes = db.exec("SELECT id, nid, did, ord, type, queue, factor, reps, ivl, due FROM cards");
      const cards = [];
      if (cardsRes.length > 0) {
        cardsRes[0].values.forEach(row => {
          const [id, nid, did, ord, type, queue, factor, reps, ivl, due] = row;
          const note = notesMap.get(nid);
          if (note) {
            cards.push({
              id: String(id),
              nid: String(nid),
              did: String(did),
              ord,
              fields: note.fields,
              fieldNames: note.fieldNames,
              tags: note.tags,
              suspended: queue === -1,
              interval: ivl || 0,
              easeFactor: (factor || 2500) / 1000,
              reps: reps || 0,
              dueDate: due || Date.now()
            });
          }
        });
      }

      db.close();
      if (decks.length === 0) decks.push({ id: "1", name: file.name.replace(".apkg", "") });
      await dbPutBatch("decks", decks);
      await dbPutBatch("cards", cards);
    }

    // Fixed Cloze Deletion Engine: handles hints, answers, and inactive clozes
    function renderCardField(html, isFront = true, clozeOrd = 0) {
      if (!html) return "";
      let processed = html;
      const clozeRegex = /\{\{c(\d+)::([^:}]+)(?:::([^}]+))?\}\}/g;
      processed = processed.replace(clozeRegex, (match, num, text, hint) => {
        const isCurrentCloze = parseInt(num) === (clozeOrd + 1);
        if (isFront) {
          if (isCurrentCloze) {
            return `<span class="cloze-bracket">[${hint || "..."}]</span>`;
          }
          return text;
        } else {
          if (isCurrentCloze) {
            return `<span class="cloze-reveal">${text}</span>`;
          }
          return text;
        }
      });
      return processed;
    }

    function buildCleanDeckTree(decks, cards) {
      const root = { children: {} };
      decks.forEach(d => {
        const parts = d.name.split("::").map(p => p.trim()).filter(Boolean);
        let current = root;
        parts.forEach((part, idx) => {
          if (!current.children[part]) {
            current.children[part] = {
              displayName: part,
              fullName: parts.slice(0, idx + 1).join("::"),
              deckId: idx === parts.length - 1 ? d.id : null,
              children: {},
              allDeckIds: new Set()
            };
          }
          if (idx === parts.length - 1) current.children[part].deckId = d.id;
          current = current.children[part];
        });
      });

      function populateStats(node) {
        const childNodes = Object.values(node.children);
        let directActive = 0;
        let directTotal = 0;
        let descendantDeckIds = new Set();

        if (node.deckId) {
          descendantDeckIds.add(node.deckId);
          const directCards = cards.filter(c => c.did === node.deckId);
          directTotal = directCards.length;
          directActive = directCards.filter(c => !c.suspended).length;
        }

        let totalActive = directActive;
        let totalCards = directTotal;

        childNodes.forEach(child => {
          populateStats(child);
          totalActive += child.totalActive;
          totalCards += child.totalCards;
          child.allDeckIds.forEach(id => descendantDeckIds.add(id));
        });

        node.directActive = directActive;
        node.totalActive = totalActive;
        node.totalCards = totalCards;
        node.allDeckIds = descendantDeckIds;
      }

      Object.values(root.children).forEach(populateStats);
      return root.children;
    }

    function buildTagTree(allCards) {
      const root = { children: {} };
      allCards.forEach(card => {
        card.tags.forEach(rawTag => {
          const parts = rawTag.split("::").map(p => p.trim()).filter(Boolean);
          let current = root;
          parts.forEach((part, idx) => {
            if (!current.children[part]) {
              current.children[part] = {
                name: part,
                fullTag: parts.slice(0, idx + 1).join("::"),
                children: {},
                cardIds: new Set()
              };
            }
            current = current.children[part];
            current.cardIds.add(card.id);
          });
        });
      });

      function populateTagStats(node) {
        const childNodes = Object.values(node.children);
        const allCardIds = new Set(node.cardIds);
        childNodes.forEach(child => {
          populateTagStats(child);
          child.allCardIds.forEach(id => allCardIds.add(id));
        });
        node.allCardIds = allCardIds;
        const matchingCards = allCards.filter(c => allCardIds.has(c.id));
        node.total = matchingCards.length;
        node.active = matchingCards.filter(c => !c.suspended).length;
        node.suspended = node.total - node.active;
      }

      Object.values(root.children).forEach(populateTagStats);
      return root.children;
    }

    function App() {
      const [view, setView] = useState("decks");
      const [decks, setDecks] = useState([]);
      const [cards, setCards] = useState([]);
      const [studyTarget, setStudyTarget] = useState(null);
      const [loading, setLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");

      const loadData = async () => {
        const d = await dbGetAll("decks");
        const c = await dbGetAll("cards");
        setDecks(d);
        setCards(c);
      };

      useEffect(() => { loadData(); }, []);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setStatusMsg("Unzipping & Parsing SQLite...");
        try {
          await parseApkg(file);
          await loadData();
          setStatusMsg("");
        } catch (err) {
          alert("Import error: " + err.message);
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      const startDeckStudy = (node) => {
        const deckIds = Array.from(node.allDeckIds);
        setStudyTarget({
          type: "deck",
          title: node.displayName,
          filterFn: (c) => deckIds.includes(c.did) && !c.suspended
        });
        setView("study");
      };

      const startTagStudy = (tag, activeCount) => {
        setStudyTarget({
          type: "tag",
          title: `#${tag.split("::").pop()}`,
          filterFn: (c) => c.tags.some(t => t === tag || t.startsWith(tag + "::")) && !c.suspended
        });
        setView("study");
      };

      return (
        <div className="flex flex-col h-full w-full relative">
          <header className="px-6 py-3.5 bg-gray-950/80 backdrop-blur-xl border-b border-white/[0.08] flex items-center justify-between flex-shrink-0 z-20">
            <div className="flex items-center space-x-3">
              <span className="text-2xl">⚡</span>
              <div>
                <h1 className="text-base font-black tracking-tight text-white">AnkiFlow</h1>
                <p className="text-[10px] font-mono uppercase text-violet-400 font-semibold tracking-wider">
                  {view === "decks" ? "Decks" : view === "browse" ? "Card Browser" : "Review Session"}
                </p>
              </div>
            </div>

            {view === "study" && (
              <button 
                onClick={() => { setView("decks"); loadData(); }} 
                className="px-3.5 py-1.5 bg-white/[0.06] hover:bg-white/[0.1] active:scale-95 border border-white/[0.1] rounded-xl text-xs font-bold text-slate-200"
              >
                ← Exit Study
              </button>
            )}
          </header>

          <main className="flex-1 overflow-y-auto">
            {loading && (
              <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-4">
                <div className="w-10 h-10 rounded-full border-4 border-violet-500/20 border-t-violet-500 animate-spin"></div>
                <p className="text-slate-300 font-bold text-xs font-mono">{statusMsg}</p>
              </div>
            )}

            {!loading && view === "decks" && (
              <DecksScreen 
                decks={decks} 
                cards={cards} 
                onSelectDeck={startDeckStudy}
                onUpload={handleFileUpload}
                onDeleteDeck={async (node) => {
                  if (confirm(`Delete "${node.displayName}" and all its subdecks?`)) {
                    await dbDeleteDeck(node.deckId, node.fullName, decks);
                    loadData();
                  }
                }}
              />
            )}

            {!loading && view === "browse" && (
              <BrowseScreen 
                allCards={cards}
                allDecks={decks}
                onUpdate={loadData}
                onStartTagStudy={startTagStudy}
              />
            )}

            {!loading && view === "study" && studyTarget && (
              <StudyScreen 
                studyTarget={studyTarget}
                allCards={cards}
                onCardUpdate={loadData}
                onBack={() => { setView("decks"); loadData(); }}
              />
            )}
          </main>

          {(view === "decks" || view === "browse") && (
            <div className="fixed bottom-4 left-0 right-0 flex justify-center z-20 pointer-events-none safe-bottom-margin">
              <nav className="pointer-events-auto bg-gray-950/90 backdrop-blur-2xl border border-white/10 p-1 rounded-full flex items-center shadow-2xl space-x-1">
                <button 
                  onClick={() => setView("decks")}
                  className={`flex items-center space-x-2 py-2 px-5 rounded-full text-xs font-bold transition ${
                    view === "decks" ? "bg-violet-600 text-white" : "text-slate-400 hover:text-white"
                  }`}
                >
                  <span>🗂️</span>
                  <span>Decks</span>
                </button>

                <button 
                  onClick={() => setView("browse")}
                  className={`flex items-center space-x-2 py-2 px-5 rounded-full text-xs font-bold transition ${
                    view === "browse" ? "bg-violet-600 text-white" : "text-slate-400 hover:text-white"
                  }`}
                >
                  <span>🔍</span>
                  <span>Browse & Tags</span>
                </button>
              </nav>
            </div>
          )}
        </div>
      );
    }

    function DeckTreeNode({ node, onSelectDeck, onDeleteDeck, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(true);
      const childNodes = Object.values(node.children);
      const hasChildren = childNodes.length > 0;

      return (
        <div className="flex flex-col select-none">
          <div 
            onClick={() => onSelectDeck(node)}
            className="group flex items-center justify-between p-4 my-1 glass-card hover:border-violet-500/40 rounded-2xl cursor-pointer transition active:scale-[0.99]"
            style={{ marginLeft: `${depth * 20}px` }}
          >
            <div className="flex items-center space-x-3 flex-1 min-w-0 pr-3">
              {hasChildren ? (
                <button 
                  onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }}
                  className="w-7 h-7 flex items-center justify-center rounded-lg bg-white/[0.04] text-violet-400 text-xs font-bold"
                >
                  {isOpen ? "▼" : "▶"}
                </button>
              ) : (
                <span className="w-7 h-7 flex items-center justify-center text-slate-600 text-sm">🗎</span>
              )}

              <span className="font-bold text-slate-100 text-sm truncate group-hover:text-violet-300 transition">
                {node.displayName}
              </span>
            </div>

            <div className="flex items-center space-x-3 flex-shrink-0">
              <span className="text-emerald-400 font-mono font-bold text-xs bg-emerald-950/40 border border-emerald-500/20 px-2.5 py-1 rounded-lg">
                {node.totalActive}
              </span>
              <button 
                onClick={(e) => { e.stopPropagation(); onDeleteDeck(node); }}
                className="p-1.5 text-slate-600 hover:text-red-400 rounded-lg text-xs"
              >
                ✕
              </button>
            </div>
          </div>

          {hasChildren && isOpen && (
            <div className="flex flex-col border-l border-white/[0.08] ml-4 pl-1">
              {childNodes.map(child => (
                <DeckTreeNode 
                  key={child.fullName} 
                  node={child} 
                  onSelectDeck={onSelectDeck} 
                  onDeleteDeck={onDeleteDeck} 
                  depth={depth + 1}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function DecksScreen({ decks, cards, onSelectDeck, onUpload, onDeleteDeck }) {
      const deckTree = useMemo(() => buildCleanDeckTree(decks, cards), [decks, cards]);
      const rootNodes = Object.values(deckTree);

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-8 space-y-6 pb-28">
          <div className="border border-dashed border-white/[0.15] bg-white/[0.02] hover:border-violet-500/50 rounded-2xl p-6 text-center cursor-pointer">
            <input type="file" accept=".apkg" onChange={onUpload} id="apkg-input" className="hidden" />
            <label htmlFor="apkg-input" className="cursor-pointer space-y-1 block">
              <span className="text-2xl block">📥</span>
              <p className="font-bold text-xs text-white">Import Anki Package (.apkg)</p>
              <p className="text-[11px] text-slate-500">Decks and tags parse automatically</p>
            </label>
          </div>

          <div className="space-y-2">
            <h2 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-400 px-1">Study by Deck</h2>
            {rootNodes.length === 0 ? (
              <p className="text-xs text-slate-600 italic px-1">No decks loaded yet.</p>
            ) : (
              rootNodes.map(node => (
                <DeckTreeNode 
                  key={node.fullName} 
                  node={node} 
                  onSelectDeck={onSelectDeck} 
                  onDeleteDeck={onDeleteDeck} 
                  depth={0}
                />
              ))
            )}
          </div>
        </div>
      );
    }

    function TagBrowseTreeNode({ node, onSelectTag, activeTag, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(depth === 0);
      const childNodes = Object.values(node.children);
      const hasChildren = childNodes.length > 0;
      const isCurrent = activeTag === node.fullTag;

      return (
        <div className="flex flex-col select-none">
          <div 
            onClick={() => onSelectTag(node.fullTag)}
            className={`flex items-center justify-between p-2.5 my-0.5 rounded-xl cursor-pointer text-xs transition ${
              isCurrent ? "bg-violet-600 text-white font-bold" : "hover:bg-white/[0.04] text-slate-300"
            }`}
            style={{ marginLeft: `${depth * 14}px` }}
          >
            <div className="flex items-center space-x-2 truncate pr-2">
              {hasChildren ? (
                <button 
                  onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }}
                  className="w-5 h-5 flex items-center justify-center rounded text-[10px] text-slate-400 hover:text-white"
                >
                  {isOpen ? "▼" : "▶"}
                </button>
              ) : (
                <span className="w-5 h-5 flex items-center justify-center text-[10px] text-slate-600">#</span>
              )}
              <span className="truncate">{node.name}</span>
            </div>

            <span className="text-[10px] font-mono opacity-60 flex-shrink-0">
              {node.active} / {node.total}
            </span>
          </div>

          {hasChildren && isOpen && (
            <div className="flex flex-col border-l border-white/[0.08] ml-3 pl-1">
              {childNodes.map(child => (
                <TagBrowseTreeNode 
                  key={child.fullTag} 
                  node={child} 
                  onSelectTag={onSelectTag}
                  activeTag={activeTag}
                  depth={depth + 1}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function BrowseScreen({ allCards, allDecks, onUpdate, onStartTagStudy }) {
      const [selectedTag, setSelectedTag] = useState(null);
      const [tagFilter, setTagFilter] = useState("");
      const [actionMsg, setActionMsg] = useState("");

      const tagTree = useMemo(() => buildTagTree(allCards), [allCards]);
      const rootTagNodes = Object.values(tagTree);

      const filteredTagNodes = useMemo(() => {
        if (!tagFilter.trim()) return rootTagNodes;
        return rootTagNodes.filter(n => n.fullTag.toLowerCase().includes(tagFilter.toLowerCase()));
      }, [rootTagNodes, tagFilter]);

      const matchedCards = useMemo(() => {
        if (!selectedTag) return [];
        return allCards.filter(c => c.tags.some(t => t === selectedTag || t.startsWith(selectedTag + "::")));
      }, [allCards, selectedTag]);

      const activeMatchCount = matchedCards.filter(c => !c.suspended).length;

      const handleBatchToggleSuspend = async (suspendState) => {
        if (matchedCards.length === 0) return;
        setActionMsg(suspendState ? "Suspending cards..." : "Unsuspending cards...");
        const updated = matchedCards.map(c => ({ ...c, suspended: suspendState }));
        await dbBatchUpdateCards(updated);
        await onUpdate();
        setActionMsg(`Updated ${updated.length} cards!`);
        setTimeout(() => setActionMsg(""), 2000);
      };

      const handleSingleToggle = async (card) => {
        await dbUpdateCard({ ...card, suspended: !card.suspended });
        await onUpdate();
      };

      return (
        <div className="max-w-6xl mx-auto h-full flex flex-col md:flex-row pb-24 p-4 sm:p-6 gap-4 select-none">
          <div className="w-full md:w-80 glass-card rounded-2xl p-4 flex flex-col flex-shrink-0 max-h-72 md:max-h-full overflow-hidden">
            <div className="pb-3 border-b border-white/[0.08] space-y-2">
              <div className="flex justify-between items-center">
                <h3 className="text-xs font-mono font-bold uppercase tracking-wider text-slate-400">Tag Tree</h3>
                {actionMsg && <span className="text-[10px] font-mono text-cyan-400">{actionMsg}</span>}
              </div>
              <input 
                type="text"
                placeholder="Search tags..."
                value={tagFilter}
                onChange={(e) => setTagFilter(e.target.value)}
                className="w-full bg-black/40 border border-white/10 rounded-xl px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500"
              />
            </div>

            <div className="flex-1 overflow-y-auto mt-2">
              {filteredTagNodes.length === 0 ? (
                <p className="text-xs text-slate-500 italic p-2">No tags found.</p>
              ) : (
                filteredTagNodes.map(node => (
                  <TagBrowseTreeNode 
                    key={node.fullTag} 
                    node={node} 
                    onSelectTag={setSelectedTag} 
                    activeTag={selectedTag} 
                    depth={0}
                  />
                ))
              )}
            </div>
          </div>

          <div className="flex-1 glass-card rounded-2xl p-4 flex flex-col overflow-hidden">
            {selectedTag ? (
              <>
                <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-3 border-b border-white/[0.08] gap-3">
                  <div>
                    <h3 className="text-xs font-mono font-bold text-violet-400 break-all">#{selectedTag}</h3>
                    <p className="text-[11px] text-slate-400 mt-0.5">
                      {activeMatchCount} active • {matchedCards.filter(c => c.suspended).length} suspended
                    </p>
                  </div>

                  <div className="flex flex-wrap items-center gap-2">
                    {activeMatchCount > 0 && (
                      <button 
                        onClick={() => onStartTagStudy(selectedTag, activeMatchCount)}
                        className="px-4 py-1.5 bg-gradient-to-r from-violet-600 to-pink-600 hover:opacity-90 text-white font-bold rounded-xl text-xs shadow-md active:scale-95 transition"
                      >
                        ⚡ Study This Tag ({activeMatchCount})
                      </button>
                    )}
                    <button 
                      onClick={() => handleBatchToggleSuspend(true)}
                      className="px-3 py-1.5 bg-amber-950/50 hover:bg-amber-900 border border-amber-500/30 text-amber-300 font-bold rounded-xl text-xs transition"
                    >
                      Suspend All
                    </button>
                    <button 
                      onClick={() => handleBatchToggleSuspend(false)}
                      className="px-3 py-1.5 bg-emerald-950/50 hover:bg-emerald-900 border border-emerald-500/30 text-emerald-300 font-bold rounded-xl text-xs transition"
                    >
                      Unsuspend All
                    </button>
                  </div>
                </div>

                <div className="flex-1 overflow-y-auto mt-3 space-y-1.5">
                  {matchedCards.map((card, idx) => (
                    <div 
                      key={card.id}
                      onClick={() => handleSingleToggle(card)}
                      className={`p-3 rounded-xl border flex items-center justify-between text-xs cursor-pointer transition ${
                        card.suspended 
                          ? "bg-amber-950/10 border-amber-500/20 text-slate-400" 
                          : "bg-white/[0.02] border-white/[0.06] text-slate-200"
                      }`}
                    >
                      <div className="truncate pr-3">
                        <span className="font-mono text-[10px] text-slate-500 mr-2">#{idx + 1}</span>
                        <span className="line-clamp-1" dangerouslySetInnerHTML={{ __html: card.fields[0] || "No Front Text" }} />
                      </div>

                      <span className={`text-[10px] font-mono px-2 py-0.5 rounded ${
                        card.suspended ? "bg-amber-950/40 text-amber-400 font-bold" : "bg-emerald-950/40 text-emerald-400 font-bold"
                      }`}>
                        {card.suspended ? "SUSPENDED" : "ACTIVE"}
                      </span>
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div className="flex-1 flex flex-col items-center justify-center text-center p-8 text-slate-500 text-xs">
                <span className="text-3xl mb-2">👈</span>
                <p>Pick a tag on the left to review its cards, suspend/unsuspend them, or launch a tag-specific study sprint.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Study Screen Component (Fixed Cloze Reveal Engine) ---
    function StudyScreen({ studyTarget, allCards, onCardUpdate, onBack }) {
      const activeCards = useMemo(() => {
        return allCards.filter(studyTarget.filterFn);
      }, [allCards, studyTarget]);

      const [index, setIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [history, setHistory] = useState([]);
      const [renderedHtml, setRenderedHtml] = useState({ front: "", back: "" });
      const currentCard = activeCards[index];

      useEffect(() => {
        if (!currentCard) return;
        let isCancelled = false;
        const createdUrls = [];

        async function resolveMedia() {
          const frontRaw = currentCard.fields[0] || "";
          const backRaw = currentCard.fields[1] || "";
          const isCloze = /\{\{c\d+::/i.test(frontRaw);

          async function replaceUrls(html) {
            let res = html;
            const imgRegex = /<img[^>]+src=["']([^"']+)["'][^>]*>/gi;
            const matches = [...res.matchAll(imgRegex)];
            for (const m of matches) {
              const filename = decodeURIComponent(m[1]).toLowerCase();
              const blob = await dbGetMedia(filename);
              if (blob) {
                const url = URL.createObjectURL(blob);
                createdUrls.push(url);
                res = res.replace(m[0], `<img src="${url}" class="max-h-[46vh] object-contain rounded-xl" />`);
              }
            }
            return res;
          }

          let finalFront = "";
          let finalBack = "";

          if (isCloze) {
            // FRONT: Render Field 0 with masked cloze bracket [...]
            const maskedFront = renderCardField(frontRaw, true, currentCard.ord);
            finalFront = await replaceUrls(maskedFront);

            // BACK: Render Field 0 with target cloze filled in and highlighted, followed by Extra field (Field 1)
            const revealedFront = renderCardField(frontRaw, false, currentCard.ord);
            let backCombined = `<div class="mb-4">${revealedFront}</div>`;
            if (backRaw.trim().length > 0) {
              backCombined += `<div class="pt-4 border-t border-white/[0.08] text-slate-300 text-sm leading-relaxed">${backRaw}</div>`;
            }
            finalBack = await replaceUrls(backCombined);
          } else {
            // Standard Basic Card
            finalFront = await replaceUrls(renderCardField(frontRaw, true, currentCard.ord));
            finalBack = await replaceUrls(renderCardField(backRaw, false, currentCard.ord));
          }

          if (!isCancelled) setRenderedHtml({ front: finalFront, back: finalBack });
        }

        resolveMedia();
        return () => {
          isCancelled = true;
          createdUrls.forEach(url => URL.revokeObjectURL(url));
        };
      }, [currentCard]);

      const handleGrade = async (rating) => {
        if (!currentCard) return;
        setHistory(prev => [...prev, { ...currentCard }]);

        let { interval, easeFactor, reps } = currentCard;
        if (rating === 1) {
          reps = 0;
          interval = 1;
        } else if (rating === 2) {
          interval = Math.max(1, Math.floor(interval * 1.2));
          easeFactor = Math.max(1.3, easeFactor - 0.15);
        } else if (rating === 3) {
          reps += 1;
          interval = reps === 1 ? 1 : reps === 2 ? 3 : Math.floor(interval * easeFactor);
        } else if (rating === 4) {
          reps += 1;
          interval = reps === 1 ? 4 : Math.floor(interval * easeFactor * 1.3);
          easeFactor += 0.15;
        }

        await dbUpdateCard({
          ...currentCard,
          interval,
          easeFactor,
          reps,
          dueDate: Date.now() + interval * 86400000
        });

        setIsFlipped(false);
        setIndex(prev => prev + 1);
        onCardUpdate();
      };

      const handleUndo = async () => {
        if (history.length === 0) return;
        const last = history[history.length - 1];
        await dbUpdateCard(last);
        setHistory(prev => prev.slice(0, -1));
        setIndex(prev => Math.max(0, prev - 1));
        setIsFlipped(false);
        onCardUpdate();
      };

      if (!currentCard || index >= activeCards.length) {
        return (
          <div className="flex flex-col items-center justify-center h-full p-8 text-center max-w-md mx-auto space-y-4">
            <span className="text-5xl">🎉</span>
            <h2 className="text-xl font-bold text-white">Session Completed</h2>
            <p className="text-xs text-slate-400">All unsuspended cards in {studyTarget.title} have been reviewed.</p>
            <button onClick={onBack} className="px-5 py-2.5 bg-violet-600 font-bold text-white rounded-xl text-xs">
              Back to Overview
            </button>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto h-full flex flex-col justify-between p-4 sm:p-6 select-none">
          <div className="flex items-center justify-between text-xs font-mono text-slate-400 pb-2">
            <span className="font-bold text-violet-400 truncate max-w-[60%]">{studyTarget.title}</span>
            <div className="flex items-center space-x-2">
              <span>{index + 1} / {activeCards.length}</span>
              {history.length > 0 && (
                <button onClick={handleUndo} className="px-2 py-0.5 bg-white/[0.06] rounded text-[11px]">↩ Undo</button>
              )}
            </div>
          </div>

          <div 
            onClick={() => !isFlipped && setIsFlipped(true)}
            className="flex-1 glass-card rounded-3xl p-6 sm:p-10 flex flex-col justify-center items-center text-center overflow-y-auto my-2 cursor-pointer relative"
          >
            <div className="card-content w-full max-w-2xl text-slate-100 text-lg leading-relaxed">
              {!isFlipped ? (
                <div dangerouslySetInnerHTML={{ __html: renderedHtml.front }} />
              ) : (
                <div className="animate-in fade-in duration-150 text-left sm:text-center">
                  <div dangerouslySetInnerHTML={{ __html: renderedHtml.back }} />
                </div>
              )}
            </div>
            {!isFlipped && <p className="text-[10px] font-mono text-slate-500 mt-8">[ Tap to reveal answer ]</p>}
          </div>

          <div className="flex-shrink-0 pt-2 safe-bottom-margin max-w-xl mx-auto w-full">
            {!isFlipped ? (
              <button 
                onClick={() => setIsFlipped(true)}
                className="w-full py-4 bg-violet-600 font-bold text-white rounded-2xl shadow-lg"
              >
                Show Answer
              </button>
            ) : (
              <div className="grid grid-cols-4 gap-2">
                <button onClick={() => handleGrade(1)} className="py-3 bg-red-950/40 border border-red-500/30 text-red-300 font-bold rounded-xl text-xs">Again</button>
                <button onClick={() => handleGrade(2)} className="py-3 bg-amber-950/40 border border-amber-500/30 text-amber-300 font-bold rounded-xl text-xs">Hard</button>
                <button onClick={() => handleGrade(3)} className="py-3 bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 font-bold rounded-xl text-xs">Good</button>
                <button onClick={() => handleGrade(4)} className="py-3 bg-cyan-950/40 border border-cyan-500/30 text-cyan-300 font-bold rounded-xl text-xs">Easy</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
