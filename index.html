<body class="h-screen w-screen flex flex-col relative selection:bg-pink-500 selection:text-white">
  <div class="ambient-glow"></div>
  <div id="root" class="h-full w-full flex flex-col relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DB_NAME = "AnkiLiteDB";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("decks")) db.createObjectStore("decks", { keyPath: "id" });
          if (!db.objectStoreNames.contains("cards")) {
            const cardStore = db.createObjectStore("cards", { keyPath: "id" });
            cardStore.createIndex("did", "did", { unique: false });
          }
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "name" });
          if (!db.objectStoreNames.contains("userComments")) db.createObjectStore("userComments", { keyPath: "cardId" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutBatch(storeName, items) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetMedia(name) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("media", "readonly");
        const store = tx.objectStore("media");
        const req = store.get(name);
        req.onsuccess = () => resolve(req.result?.blob || null);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbUpdateCard(card) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        store.put(card);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbBatchUpdateCards(cardsToUpdate) {
      if (!cardsToUpdate || cardsToUpdate.length === 0) return;
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        cardsToUpdate.forEach(card => store.put(card));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbSaveComment(cardId, comment) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("userComments", "readwrite");
        tx.objectStore("userComments").put({ cardId, comment, updatedAt: Date.now() });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetComment(cardId) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("userComments", "readonly");
        const req = tx.objectStore("userComments").get(cardId);
        req.onsuccess = () => resolve(req.result?.comment || "");
        req.onerror = () => reject(req.error);
      });
    }

    async function dbDeleteDeck(deckId, deckName, allDecks) {
      const prefix = deckName + "::";
      const matchingDeckIds = allDecks
        .filter(d => d.id === deckId || d.name === deckName || d.name.startsWith(prefix))
        .map(d => d.id);

      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["decks", "cards"], "readwrite");
        const deckStore = tx.objectStore("decks");
        const cardStore = tx.objectStore("cards");

        matchingDeckIds.forEach(id => deckStore.delete(id));
        const req = cardStore.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (matchingDeckIds.includes(cursor.value.did)) {
              cursor.delete();
            }
            cursor.continue();
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // --- Parser ---
    async function parseApkg(file) {
      const zip = await JSZip.loadAsync(file);
      let dbFile = zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbFile) throw new Error("Missing SQLite deck file in .apkg archive.");

      const dbBuffer = await dbFile.async("uint8array");
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const db = new SQL.Database(dbBuffer);

      const mediaJsonFile = zip.file("media");
      const mediaMap = mediaJsonFile ? JSON.parse(await mediaJsonFile.async("text")) : {};
      const mediaItems = [];
      for (const [key, filename] of Object.entries(mediaMap)) {
        const mFile = zip.file(key);
        if (mFile) {
          const blob = await mFile.async("blob");
          mediaItems.push({ name: filename.toLowerCase(), blob });
        }
      }
      if (mediaItems.length > 0) await dbPutBatch("media", mediaItems);

      const colRes = db.exec("SELECT decks, models FROM col");
      const decksJson = JSON.parse(colRes[0].values[0][0]);
      const modelsJson = JSON.parse(colRes[0].values[0][1]);
      
      const modelFieldNames = new Map();
      for (const [mid, model] of Object.entries(modelsJson)) {
        modelFieldNames.set(mid, (model.flds || []).map(f => f.name));
      }

      const decks = [];
      for (const [id, d] of Object.entries(decksJson)) {
        if (d.name && d.name !== "Default") {
          const normalizedName = d.name.replace(/[\x1f\u001f]/g, "::").trim();
          decks.push({ id: String(d.id), name: normalizedName });
        }
      }

      const notesRes = db.exec("SELECT id, mid, flds, tags FROM notes");
      const notesMap = new Map();
      if (notesRes.length > 0) {
        notesRes[0].values.forEach(row => {
          const [id, mid, flds, tags] = row;
          const fields = flds.split("\x1f");
          const tagList = tags ? tags.trim().split(/\s+/).filter(Boolean) : [];
          const fieldNames = modelFieldNames.get(String(mid)) || [];
          notesMap.set(id, { id, fields, tags: tagList, fieldNames });
        });
      }

      const cardsRes = db.exec("SELECT id, nid, did, ord, type, queue, factor, reps, ivl, due FROM cards");
      const cards = [];
      if (cardsRes.length > 0) {
        cardsRes[0].values.forEach(row => {
          const [id, nid, did, ord, type, queue, factor, reps, ivl, due] = row;
          const note = notesMap.get(nid);
          if (note) {
            cards.push({
              id: String(id),
              nid: String(nid),
              did: String(did),
              ord,
              fields: note.fields,
              fieldNames: note.fieldNames,
              tags: note.tags,
              suspended: queue === -1,
              interval: ivl || 0,
              easeFactor: (factor || 2500) / 1000,
              reps: reps || 0,
              dueDate: due || Date.now()
            });
          }
        });
      }

      db.close();
      if (decks.length === 0) decks.push({ id: "1", name: file.name.replace(".apkg", "") });
      await dbPutBatch("decks", decks);
      await dbPutBatch("cards", cards);
    }

    function renderCardField(html, isFront = true, clozeOrd = 0) {
      if (!html) return "";
      let processed = html;
      const clozeRegex = /\{\{c(\d+)::([^:}]+)(?:::([^}]+))?\}\}/g;
      processed = processed.replace(clozeRegex, (match, num, text, hint) => {
        const isCurrentCloze = parseInt(num) === (clozeOrd + 1);
        if (isFront) {
          return isCurrentCloze ? `<span class="cloze-bracket">${hint || "..."}</span>` : text;
        } else {
          return isCurrentCloze ? `<span class="cloze-reveal">${text}</span>` : text;
        }
      });
      return processed;
    }

    function buildCleanDeckTree(decks, cards) {
      const root = { children: {} };
      decks.forEach(d => {
        const parts = d.name.split("::").map(p => p.trim()).filter(Boolean);
        let current = root;

        parts.forEach((part, idx) => {
          if (!current.children[part]) {
            current.children[part] = {
              displayName: part,
              fullName: parts.slice(0, idx + 1).join("::"),
              deckId: idx === parts.length - 1 ? d.id : null,
              children: {},
              allDeckIds: new Set()
            };
          }
          if (idx === parts.length - 1) {
            current.children[part].deckId = d.id;
          }
          current = current.children[part];
        });
      });

      function populateStats(node) {
        const childNodes = Object.values(node.children);
        let directActive = 0;
        let directSuspended = 0;
        let directTotal = 0;
        let descendantDeckIds = new Set();

        if (node.deckId) {
          descendantDeckIds.add(node.deckId);
          const directCards = cards.filter(c => c.did === node.deckId);
          directTotal = directCards.length;
          directActive = directCards.filter(c => !c.suspended).length;
          directSuspended = directTotal - directActive;
        }

        let totalActive = directActive;
        let totalSuspended = directSuspended;
        let totalCards = directTotal;

        childNodes.forEach(child => {
          populateStats(child);
          totalActive += child.totalActive;
          totalSuspended += child.totalSuspended;
          totalCards += child.totalCards;
          child.allDeckIds.forEach(id => descendantDeckIds.add(id));
        });

        node.directActive = directActive;
        node.directSuspended = directSuspended;
        node.directTotal = directTotal;
        node.totalActive = totalActive;
        node.totalSuspended = totalSuspended;
        node.totalCards = totalCards;
        node.allDeckIds = descendantDeckIds;
      }

      Object.values(root.children).forEach(populateStats);
      return root.children;
    }

    function buildTagTree(deckCards) {
      const root = { children: {} };
      deckCards.forEach(card => {
        card.tags.forEach(rawTag => {
          const parts = rawTag.split("::").map(p => p.trim()).filter(Boolean);
          let current = root;
          parts.forEach((part, idx) => {
            if (!current.children[part]) {
              current.children[part] = {
                name: part,
                fullTag: parts.slice(0, idx + 1).join("::"),
                children: {},
                cardIds: new Set()
              };
            }
            current = current.children[part];
            current.cardIds.add(card.id);
          });
        });
      });

      function populateTagStats(node) {
        const childNodes = Object.values(node.children);
        const allCardIds = new Set(node.cardIds);
        childNodes.forEach(child => {
          populateTagStats(child);
          child.allCardIds.forEach(id => allCardIds.add(id));
        });
        node.allCardIds = allCardIds;
        const matchingCards = deckCards.filter(c => allCardIds.has(c.id));
        node.total = matchingCards.length;
        node.active = matchingCards.filter(c => !c.suspended).length;
        node.suspended = node.total - node.active;
      }

      Object.values(root.children).forEach(populateTagStats);
      return root.children;
    }

    // --- Main App Component ---
    function App() {
      const [view, setView] = useState("deckList");
      const [decks, setDecks] = useState([]);
      const [cards, setCards] = useState([]);
      const [selectedDeckNode, setSelectedDeckNode] = useState(null);
      const [customStudyTags, setCustomStudyTags] = useState([]);
      const [includeSuspendedInCustom, setIncludeSuspendedInCustom] = useState(false);
      const [loading, setLoading] = useState(false);
      const [statusMsg, setStatusMsg] = useState("");

      const loadData = async () => {
        const d = await dbGetAll("decks");
        const c = await dbGetAll("cards");
        setDecks(d);
        setCards(c);
      };

      useEffect(() => { loadData(); }, []);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setLoading(true);
        setStatusMsg("Unzipping & Crunching SQLite...");
        try {
          await parseApkg(file);
          await loadData();
          setStatusMsg("");
        } catch (err) {
          alert("Import failed: " + err.message);
          console.error(err);
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="flex flex-col h-full w-full relative">
          {/* Top Bar */}
          <header className="px-6 py-4 bg-gray-950/60 backdrop-blur-2xl border-b border-white/[0.06] flex items-center justify-between flex-shrink-0 z-20">
            <div className="flex items-center space-x-3">
              <div className="w-9 h-9 rounded-2xl bg-gradient-to-tr from-violet-600 via-pink-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-violet-500/25">
                <span className="text-white text-base font-black">⚡</span>
              </div>
              <div>
                <h1 className="text-lg font-black tracking-tighter bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                  AnkiFlow
                </h1>
                <p className="text-[10px] font-mono tracking-widest uppercase text-violet-400 font-semibold">Study OS • 2.0</p>
              </div>
            </div>

            {(view === "study" || view === "manager") && (
              <button 
                onClick={() => { setView("deckList"); loadData(); }} 
                className="px-4 py-2 bg-white/[0.06] hover:bg-white/[0.1] active:scale-95 border border-white/[0.08] rounded-2xl text-xs font-bold transition flex items-center space-x-2 text-slate-200 shadow-sm"
              >
                <span>←</span>
                <span>Decks</span>
              </button>
            )}
          </header>

          {/* Core Content */}
          <main className="flex-1 overflow-y-auto">
            {loading && (
              <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-4">
                <div className="w-12 h-12 rounded-full border-4 border-violet-500/20 border-t-violet-500 animate-spin"></div>
                <p className="text-slate-300 font-bold tracking-tight text-sm">{statusMsg}</p>
              </div>
            )}

            {!loading && view === "deckList" && (
              <DeckListView 
                decks={decks} 
                cards={cards} 
                onSelectDeck={(node) => { 
                  setSelectedDeckNode(node); 
                  setCustomStudyTags([]); 
                  setView("study"); 
                }}
                onOpenManager={(node) => { 
                  setSelectedDeckNode(node); 
                  setView("manager"); 
                }}
                onUpload={handleFileUpload}
                onDeleteDeck={async (node) => { 
                  if (confirm(`Nuke "${node.displayName}" and all subdecks?`)) { 
                    await dbDeleteDeck(node.deckId, node.fullName, decks); 
                    loadData(); 
                  } 
                }}
              />
            )}

            {!loading && view === "tagExplorer" && (
              <GlobalTagExplorerView 
                allCards={cards}
                allDecks={decks}
                onStartStudy={(tags) => {
                  setSelectedDeckNode({
                    displayName: tags[0].split("::").pop(),
                    fullName: tags[0],
                    allDeckIds: new Set(decks.map(d => d.id))
                  });
                  setCustomStudyTags(tags);
                  setIncludeSuspendedInCustom(false);
                  setView("study");
                }}
              />
            )}

            {!loading && view === "study" && selectedDeckNode && (
              <StudyView 
                deckNode={selectedDeckNode} 
                allCards={cards} 
                allDecks={decks}
                customTags={customStudyTags}
                includeSuspended={includeSuspendedInCustom}
                onCardUpdate={loadData}
                onBack={() => { setView("deckList"); loadData(); }}
              />
            )}

            {!loading && view === "manager" && selectedDeckNode && (
              <ManagerView 
                deckNode={selectedDeckNode} 
                allCards={cards} 
                onUpdate={loadData}
                onStartCustomStudy={(tags, incSuspended) => {
                  setCustomStudyTags(tags);
                  setIncludeSuspendedInCustom(incSuspended);
                  setView("study");
                }}
              />
            )}
          </main>

          {/* Floating Dock Bottom Navigation */}
          {(view === "deckList" || view === "tagExplorer") && (
            <div className="fixed bottom-4 left-0 right-0 flex justify-center z-20 pointer-events-none safe-bottom-margin">
              <nav className="pointer-events-auto bg-gray-950/80 backdrop-blur-2xl border border-white/10 p-1.5 rounded-full flex items-center shadow-2xl shadow-black/80 space-x-1">
                <button 
                  onClick={() => setView("deckList")}
                  className={`flex items-center space-x-2 py-2 px-5 rounded-full text-xs font-bold transition duration-200 active:scale-95 ${
                    view === "deckList" 
                      ? "bg-gradient-to-r from-violet-600 to-pink-600 text-white shadow-lg shadow-violet-500/25" 
                      : "text-slate-400 hover:text-white"
                  }`}
                >
                  <span className="text-sm">🗂️</span>
                  <span>Decks</span>
                </button>

                <button 
                  onClick={() => setView("tagExplorer")}
                  className={`flex items-center space-x-2 py-2 px-5 rounded-full text-xs font-bold transition duration-200 active:scale-95 ${
                    view === "tagExplorer" 
                      ? "bg-gradient-to-r from-violet-600 to-pink-600 text-white shadow-lg shadow-violet-500/25" 
                      : "text-slate-400 hover:text-white"
                  }`}
                >
                  <span className="text-sm">🏷️</span>
                  <span>All Tags</span>
                </button>
              </nav>
            </div>
          )}
        </div>
      );
    }

    // --- Deck Tree Component ---
    function DeckTreeNode({ node, onSelectDeck, onOpenManager, onDeleteDeck, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(true);
      const childNodes = Object.values(node.children);
      const hasChildren = childNodes.length > 0;

      return (
        <div className="flex flex-col select-none">
          <div 
            className="group flex items-center justify-between p-4 my-1.5 glass-card hover:border-violet-500/30 rounded-3xl transition-all duration-200 active:scale-[0.99]"
            style={{ marginLeft: `${depth * 22}px` }}
          >
            <div className="flex items-center space-x-3.5 flex-1 min-w-0 pr-3">
              {hasChildren ? (
                <button 
                  onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }}
                  className="w-8 h-8 flex items-center justify-center rounded-xl bg-white/[0.04] text-violet-400 hover:bg-violet-500/20 text-xs font-bold transition flex-shrink-0"
                >
                  {isOpen ? "▼" : "▶"}
                </button>
              ) : (
                <span className="w-8 h-8 flex items-center justify-center text-slate-500 text-sm flex-shrink-0">🗎</span>
              )}

              <div className="flex-1 min-w-0 cursor-pointer" onClick={() => onSelectDeck(node)}>
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-slate-100 text-sm sm:text-base truncate group-hover:text-violet-300 transition">
                    {node.displayName}
                  </span>
                  {hasChildren && (
                    <span className="text-[10px] font-mono text-cyan-400 bg-cyan-950/40 border border-cyan-500/20 px-2 py-0.5 rounded-full">

              <div className="mt-4 pt-3 border-t border-white/[0.06] flex items-center justify-between text-[10px] font-mono text-cyan-400">
                <span>● LOCAL STORAGE READY</span>
                <span>PWA</span>
              </div>

          </div>

          {/* Decks Header & Search */}
          <div className="space-y-4">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <h2 className="text-xs font-mono font-bold tracking-widest uppercase text-slate-400">Deck Tree Branch</h2>
              {rootNodes.length > 0 && (
                <div className="relative w-full sm:w-80">
                  <input 
                    type="text"
                    placeholder="Search decks..." 
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-white/[0.04] border border-white/[0.08] focus:border-violet-500 rounded-2xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none transition shadow-inner font-mono"
                  />

    // --- Study Screen Component ---
    function StudyView({ deckNode, allCards, allDecks, customTags, includeSuspended, onCardUpdate, onBack }) {
      const eligibleDeckIds = useMemo(() => Array.from(deckNode.allDeckIds), [deckNode]);

      const deckCards = useMemo(() => {
        return allCards.filter(c => {
          const matchDeck = eligibleDeckIds.includes(c.did);
          if (!matchDeck) return false;
          if (customTags.length > 0) {
            const hasTag = c.tags.some(t => customTags.some(selected => t === selected || t.startsWith(selected + "::")));
            if (!hasTag) return false;
            return includeSuspended ? true : !c.suspended;
          }
          return !c.suspended;
        });
      }, [allCards, eligibleDeckIds, customTags, includeSuspended]);

      const [index, setIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [history, setHistory] = useState([]);
      const [renderedMediaHtml, setRenderedMediaHtml] = useState({ front: "", back: "" });
      const [renderedExtraFields, setRenderedExtraFields] = useState([]);
      const [activeExtraField, setActiveExtraField] = useState(null);
      const [showSidePanel, setShowSidePanel] = useState(false);
      const [userComment, setUserComment] = useState("");
      const [showCommentBox, setShowCommentBox] = useState(false);

      const currentCard = deckCards[index];

      const tagCountMap = useMemo(() => {
        const counts = new Map();
        allCards.forEach(c => {
          c.tags.forEach(t => counts.set(t, (counts.get(t) || 0) + 1));
        });
        return counts;
      }, [allCards]);

      useEffect(() => {
        if (!currentCard) return;
        dbGetComment(currentCard.id).then(c => setUserComment(c));
      }, [currentCard]);

      useEffect(() => {
        if (!currentCard) return;
        let isCancelled = false;
        const createdUrls = [];

        async function replaceUrls(html, isFront = false) {
          let res = renderCardField(html, isFront, currentCard.ord);
          
          const imgRegex = /<img[^>]+src=["']([^"']+)["'][^>]*>/gi;
          const matches = [...res.matchAll(imgRegex)];
          for (const m of matches) {
            const filename = decodeURIComponent(m[1]).toLowerCase();
            const blob = await dbGetMedia(filename);
            if (blob) {
              const url = URL.createObjectURL(blob);
              createdUrls.push(url);
              res = res.replace(m[0], `<img src="${url}" class="max-h-[44vh] object-contain rounded-2xl" />`);
            }
          }

          const audioRegex = /\[sound:([^\]]+)\]/gi;
          const audioMatches = [...res.matchAll(audioRegex)];
          for (const m of audioMatches) {
            const filename = decodeURIComponent(m[1]).toLowerCase();
            const blob = await dbGetMedia(filename);
            if (blob) {
              const url = URL.createObjectURL(blob);
              createdUrls.push(url);
              res = res.replace(m[0], `<audio controls class="my-3"><source src="${url}"></audio>`);
            }
          }
          return res;
        }

        async function resolveAllMedia() {
          const frontRaw = currentCard.fields[0] || "";
          const backRaw = currentCard.fields[1] || "";

          const front = await replaceUrls(frontRaw, true);
          const back = await replaceUrls(backRaw, false);

          const extras = [];
          for (let i = 2; i < currentCard.fields.length; i++) {
            const rawVal = currentCard.fields[i];
            if (rawVal && rawVal.trim().length > 0) {
              const label = currentCard.fieldNames?.[i] || `Extra Note ${i - 1}`;
              const htmlVal = await replaceUrls(rawVal, false);
              extras.push({ label, html: htmlVal });
            }
          }

          if (!isCancelled) {
            setRenderedMediaHtml({ front, back });
            setRenderedExtraFields(extras);
            setActiveExtraField(null);
          }
        }

        resolveAllMedia();

        return () => {
          isCancelled = true;
          createdUrls.forEach(url => URL.revokeObjectURL(url));
        };
      }, [currentCard]);

      const handleGrade = async (rating) => {
        if (!currentCard) return;
        const prevCardState = { ...currentCard };
        setHistory(prev => [...prev, prevCardState]);

        let { interval, easeFactor, reps } = currentCard;
        if (rating === 1) {
          reps = 0;
          interval = 1;
        } else if (rating === 2) {
          interval = Math.max(1, Math.floor(interval * 1.2));
          easeFactor = Math.max(1.3, easeFactor - 0.15);
        } else if (rating === 3) {
          reps += 1;
          interval = reps === 1 ? 1 : reps === 2 ? 3 : Math.floor(interval * easeFactor);
        } else if (rating === 4) {
          reps += 1;
          interval = reps === 1 ? 4 : Math.floor(interval * easeFactor * 1.3);
          easeFactor += 0.15;
        }

        const updatedCard = {
          ...currentCard,
          interval,
          easeFactor,
          reps,
          dueDate: Date.now() + interval * 86400000
        };

        await dbUpdateCard(updatedCard);
        setIsFlipped(false);
        setIndex(prev => prev + 1);
        onCardUpdate();
      };

      const handleUndo = async () => {
        if (history.length === 0) return;
        const lastCard = history[history.length - 1];
        await dbUpdateCard(lastCard);
        setHistory(prev => prev.slice(0, -1));
        setIndex(prev => Math.max(0, prev - 1));
        setIsFlipped(false);
        onCardUpdate();
      };

      const handleToggleSuspend = async () => {
        if (!currentCard) return;
        const updated = { ...currentCard, suspended: !currentCard.suspended };
        await dbUpdateCard(updated);
        onCardUpdate();
      };

      const handleSaveUserComment = async (val) => {
        setUserComment(val);
        await dbSaveComment(currentCard.id, val);
      };

      if (!currentCard || index >= deckCards.length) {
        return (
          <div className="flex flex-col items-center justify-center h-full p-8 text-center max-w-md mx-auto space-y-6">
            <div className="w-20 h-20 rounded-full bg-gradient-to-tr from-emerald-500 to-cyan-500 flex items-center justify-center shadow-xl shadow-emerald-500/25">
              <span className="text-3xl">🚀</span>
            </div>
            <h2 className="text-2xl font-black text-white tracking-tight">Zero Cards Due</h2>
            <p className="text-slate-400 text-sm font-medium leading-relaxed">
              You cleared <span className="text-violet-400 font-bold font-mono">{deckNode.displayName}</span>. Time to rest or run custom tag sprints.
            </p>
            <button 
              onClick={onBack} 
              className="px-6 py-3.5 bg-gradient-to-r from-violet-600 to-pink-600 hover:opacity-95 font-black text-white rounded-2xl shadow-xl shadow-violet-600/30 transition active:scale-95"
            >
              Back to Command
            </button>
          </div>
        );
      }

      const cardDeckObj = allDecks.find(d => d.id === currentCard.did);

      return (
        <div className="max-w-5xl mx-auto h-full flex flex-col justify-between p-3 sm:p-6 select-text">
          {/* Top Bar Indicators */}
          <div className="flex items-center justify-between text-xs font-mono text-slate-400 pb-2 flex-shrink-0 select-none">
            <div className="flex items-center space-x-2 truncate max-w-[50%]">
              <span className="text-violet-400 font-bold truncate font-sans">{cardDeckObj ? cardDeckObj.name.split("::").pop() : deckNode.displayName}</span>
              <span className="text-slate-600">•</span>
              <span className="bg-white/[0.05] px-2 py-0.5 rounded-md text-white font-bold">{index + 1} / {deckCards.length}</span>
            </div>

            <div className="flex items-center space-x-2">
              <button 
                onClick={() => setShowSidePanel(!showSidePanel)} 
                className={`px-3 py-1.5 rounded-xl border text-xs font-bold transition ${
                  showSidePanel ? "bg-cyan-500/20 text-cyan-300 border-cyan-500/40" : "bg-white/[0.04] border-white/[0.08] text-slate-300"
                }`}
              >
                Inspect
              </button>
              <button 
                onClick={handleToggleSuspend} 
                className={`px-3 py-1.5 rounded-xl border text-xs font-bold transition ${
                  currentCard.suspended 
                    ? "bg-amber-500/20 border-amber-500/40 text-amber-300" 
                    : "bg-white/[0.04] border-white/[0.08] text-slate-300"
                }`}
              >
                {currentCard.suspended ? "⚠️ Suspended" : "Suspend"}
              </button>
              {history.length > 0 && (
                <button 
                  onClick={handleUndo} 
                  className="px-3 py-1.5 bg-white/[0.04] hover:bg-white/[0.08] active:scale-95 border border-white/[0.08] rounded-xl text-slate-300 transition font-bold"
                >
                  ↩
                </button>
              )}
            </div>
          </div>

          {/* Flashcard Body */}
          <div className="flex-1 flex gap-4 my-2 min-h-0 relative">
            <div 
              key={currentCard.id} 
              className="flex-1 glass-card rounded-3xl p-6 sm:p-10 flex flex-col justify-start items-center text-center overflow-y-auto relative transition-all duration-150"
            >
              {/* Tag Pills */}
              {currentCard.tags.length > 0 && (
                <div className="w-full flex flex-wrap gap-1.5 justify-center mb-6">
                  {currentCard.tags.map(t => (
                    <span key={t} className="text-[10px] font-mono uppercase font-bold tracking-wider px-3 py-1 bg-white/[0.04] text-slate-300 rounded-full border border-white/[0.08] flex items-center space-x-1.5">
                      <span className="text-violet-400">#</span>
                      <span>{t.split("::").pop()}</span>
                      <span className="bg-white/[0.08] text-cyan-400 px-1.5 py-0.2 rounded-full">
                        {tagCountMap.get(t) || 1}
                      </span>
                    </span>
                  ))}
                </div>
              )}

              {/* Front Text */}
              <div 
                onClick={() => !isFlipped && setIsFlipped(true)}
                className="card-content w-full max-w-2xl text-slate-100 text-lg sm:text-xl font-medium leading-relaxed cursor-pointer"
              >
                <div dangerouslySetInnerHTML={{ __html: renderedMediaHtml.front }} />
              </div>

              {/* Back Answer */}
              {isFlipped && (
                <div className="mt-8 pt-8 border-t border-white/[0.08] w-full max-w-2xl text-left animate-in fade-in duration-150 space-y-6">
                  <div className="card-content text-slate-100 text-base sm:text-lg leading-relaxed text-center" dangerouslySetInnerHTML={{ __html: renderedMediaHtml.back }} />

                  {/* Extra Fields Collapsible */}
                  {renderedExtraFields.length > 0 && (
                    <div className="pt-4 border-t border-white/[0.06] space-y-2">
                      <div className="flex flex-wrap gap-2 justify-center">
                        {renderedExtraFields.map((f, idx) => (
                          <button 
                            key={idx} 
                            onClick={() => setActiveExtraField(activeExtraField === idx ? null : idx)}
                            className={`px-3.5 py-1.5 rounded-xl text-xs font-bold border transition ${
                              activeExtraField === idx 
                                ? 'bg-cyan-500/20 border-cyan-400/40 text-cyan-300' 
                                : 'bg-white/[0.04] hover:bg-white/[0.08] border-white/[0.08] text-slate-300'
                            }`}
                          >
                            📖 {f.label} {activeExtraField === idx ? '▲' : '▼'}
                          </button>
                        ))}
                      </div>

                      {activeExtraField !== null && renderedExtraFields[activeExtraField] && (
                        <div className="p-4 bg-black/40 border border-white/10 rounded-2xl mt-3 card-content text-sm text-slate-300 animate-in fade-in duration-150">
                          <h4 className="text-xs font-mono font-bold uppercase tracking-wider text-cyan-400 mb-2">
                            {renderedExtraFields[activeExtraField].label}
                          </h4>
                          <div dangerouslySetInnerHTML={{ __html: renderedExtraFields[activeExtraField].html }} />
                        </div>
                      )}
                    </div>
                  )}

                  {/* Personal Comment Field */}
                  <div className="pt-3 border-t border-white/[0.06]">
                    <button 
                      onClick={() => setShowCommentBox(!showCommentBox)} 
                      className="text-xs font-bold text-slate-400 hover:text-white flex items-center space-x-1.5"
                    >
                      <span>💬 Personal Mnemonics & Pearls</span>
                      <span className="text-[10px]">{showCommentBox ? '▲' : '▼'}</span>
                    </button>

                    {showCommentBox && (
                      <textarea 
                        rows="3"
                        value={userComment}
                        onChange={(e) => handleSaveUserComment(e.target.value)}
                        placeholder="Write personal insights here (persists offline)..."
                        className="w-full mt-2.5 bg-black/50 border border-white/10 rounded-2xl p-3.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-violet-500 font-mono"
                      />
                    )}
                  </div>
                </div>
              )}

              {!isFlipped && (
                <p 
                  onClick={() => setIsFlipped(true)}
                  className="text-[11px] font-mono text-slate-500 mt-10 tracking-widest uppercase font-bold cursor-pointer"
                >
                  [ Tap to reveal answer ]
                </p>
              )}
            </div>

            {/* Side Card Info Drawer */}
            {showSidePanel && (
              <div className="w-72 glass-card rounded-3xl p-6 flex flex-col justify-between text-xs overflow-y-auto animate-in slide-in-from-right duration-200">
                <div className="space-y-4">
                  <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
                    <h3 className="font-mono font-bold text-slate-200 uppercase tracking-widest text-[10px]">Telemetry</h3>
                    <button onClick={() => setShowSidePanel(false)} className="text-slate-500 hover:text-white">✕</button>
                  </div>

                  <div className="space-y-3 font-mono">
                    <div>
                      <p className="text-slate-500 text-[10px] uppercase font-bold">Subdeck</p>
                      <p className="font-sans font-semibold text-slate-200 truncate mt-0.5">{cardDeckObj ? cardDeckObj.name : deckNode.fullName}</p>
                    </div>
                    <div>
                      <p className="text-slate-500 text-[10px] uppercase font-bold">Card ID</p>
                      <p className="text-slate-300 text-xs mt-0.5">{currentCard.id}</p>
                    </div>
                    <div>
                      <p className="text-slate-500 text-[10px] uppercase font-bold">Memory Ease</p>
                      <p className="font-bold text-emerald-400 text-xs mt-0.5">{(currentCard.easeFactor * 100).toFixed(0)}% ({currentCard.reps} reps)</p>
                    </div>
                    <div>
                      <p className="text-slate-500 text-[10px] uppercase font-bold">Interval</p>
                      <p className="font-bold text-slate-200 text-xs mt-0.5">{currentCard.interval} days</p>
                    </div>
                  </div>

                  {currentCard.tags.length > 0 && (
                    <div className="pt-3 border-t border-white/[0.08]">
                      <p className="text-slate-500 text-[10px] uppercase font-mono font-bold mb-2">Branch Tags</p>
                      <div className="space-y-1.5">
                        {currentCard.tags.map(t => (
                          <div key={t} className="flex justify-between items-center text-xs bg-white/[0.03] p-2 rounded-xl border border-white/[0.05]">
                            <span className="truncate pr-1 text-slate-300 font-medium">#{t.split("::").pop()}</span>
                            <span className="text-violet-400 font-bold font-mono">{tagCountMap.get(t) || 1}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <p className="text-[10px] font-mono text-slate-500 text-center mt-4">Select text to highlight</p>
              </div>
            )}
          </div>

          {/* Rating Action Dock */}
          <div className="flex-shrink-0 pt-2 safe-bottom-margin max-w-2xl mx-auto w-full select-none">
            {!isFlipped ? (
              <button 
                onClick={() => setIsFlipped(true)} 
                className="w-full py-4 bg-gradient-to-r from-violet-600 via-pink-600 to-cyan-500 font-black text-white text-sm rounded-2xl shadow-xl shadow-violet-600/25 active:scale-[0.98] transition tracking-wide"

                SHOW ANSWER
              </button>
            ) : (
              <div className="grid grid-cols-4 gap-2.5 sm:gap-3.5">
                <button 
                  onClick={() => handleGrade(1)} 
                  className="py-3 bg-red-950/40 hover:bg-red-900/60 border border-red-500/30 text-red-300 font-extrabold rounded-2xl text-xs flex flex-col items-center active:scale-95 transition"
                >
                  <span>Again</span>

                  onClick={() => handleGrade(2)}

                >
                  <span>Hard</span>
                  <span className="text-[10px] font-mono opacity-60 mt-0.5">{Math.max(1, Math.floor(currentCard.interval * 1.2))}d</span>
                </button>
                <button 
                  onClick={() => handleGrade(3)} 
                  className="py-3 bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-500/30 text-emerald-300 font-extrabold rounded-2xl text-xs flex flex-col items-center active:scale-95 transition"
                >
                  <span>Good</span>
                  <span className="text-[10px] font-mono opacity-60 mt-0.5">{Math.max(1, Math.floor(currentCard.interval * currentCard.easeFactor))}d</span>
                </button>
                <button 
                  onClick={() => handleGrade(4)} 
                  className="py-3 bg-cyan-950/40 hover:bg-cyan-900/60 border border-cyan-500/30 text-cyan-300 font-extrabold rounded-2xl text-xs flex flex-col items-center active:scale-95 transition"
                >
                  <span>Easy</span>
                  <span className="text-[10px] font-mono opacity-60 mt-0.5">{Math.max(4, Math.floor(currentCard.interval * currentCard.easeFactor * 1.3))}d</span>
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- Global Tag Explorer View ---
    function GlobalTagExplorerView({ allCards, allDecks, onStartStudy }) {
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedTag, setSelectedTag] = useState(null);

      const globalTagMap = useMemo(() => {
        const map = new Map();
        allCards.forEach(card => {
          card.tags.forEach(tag => {
            if (!map.has(tag)) {
              map.set(tag, {
                tag,
                displayName: tag.split("::").pop(),
                cards: [],
                activeCount: 0,
                suspendedCount: 0
              });
            }
            const entry = map.get(tag);
            entry.cards.push(card);
            if (card.suspended) entry.suspendedCount++;
            else entry.activeCount++;
          });
        });
        return Array.from(map.values()).sort((a, b) => b.cards.length - a.cards.length);
      }, [allCards]);

      const filteredTags = useMemo(() => {
        if (!searchQuery.trim()) return globalTagMap;
        const q = searchQuery.toLowerCase();
        return globalTagMap.filter(item => item.tag.toLowerCase().includes(q));
      }, [globalTagMap, searchQuery]);

      if (selectedTag) {
        const tagData = globalTagMap.find(t => t.tag === selectedTag);
        return (
          <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-4 pb-28">
            <div className="flex items-center justify-between pb-3 border-b border-white/[0.08]">
              <button 
                onClick={() => setSelectedTag(null)}
                className="px-4 py-2 bg-white/[0.05] hover:bg-white/[0.1] text-slate-300 rounded-2xl text-xs font-bold font-mono"
              >
                ← All Tags
              </button>
              <button 
                onClick={() => onStartStudy([selectedTag])}
                className="px-5 py-2 bg-gradient-to-r from-violet-600 to-pink-600 hover:opacity-95 text-white font-extrabold rounded-2xl text-xs shadow-lg shadow-violet-600/30"
              >
                Study #{tagData?.displayName} ({tagData?.activeCount}) →
              </button>
            </div>

            <div>
              <h2 className="text-lg font-black text-white break-all">#{selectedTag}</h2>
              <p className="text-xs font-mono text-slate-400 mt-1">{tagData?.cards.length} cards in this tag cluster</p>
            </div>

            <div className="space-y-2">
              {tagData?.cards.map((card, i) => (
                <div key={card.id} className="p-4 glass-card rounded-2xl text-xs space-y-2">
                  <div className="flex justify-between items-center text-slate-400 font-mono">
                    <span className="text-[10px]">#{i + 1} • Card {card.id}</span>
                    <span className={card.suspended ? "text-amber-400 font-bold" : "text-emerald-400 font-bold"}>
                      {card.suspended ? "Suspended" : "Active"}
                    </span>
                  </div>
                  <div 
                    className="text-slate-200 line-clamp-2 leading-relaxed"
                    dangerouslySetInnerHTML={{ __html: card.fields[0] || "Empty Prompt" }} 
                  />
                </div>
              ))}
            </div>
          </div>
        );
      }

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-4 pb-28">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div>
              <h2 className="text-xs font-mono font-bold tracking-widest uppercase text-slate-400">All Tags Cluster</h2>
              <p className="text-xs text-slate-400 mt-0.5">Filter across the entire collection</p>
            </div>
            <input 
              type="text"
              placeholder="Filter tags..."
              value={searchQuery}
              onChange={(e) => setSearchQuery(e.target.value)}
              className="bg-white/[0.04] border border-white/[0.08] focus:border-violet-500 rounded-2xl px-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none w-full sm:w-72 font-mono"
            />
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            {filteredTags.map(item => (
              <div 
                key={item.tag} 
                onClick={() => setSelectedTag(item.tag)}
                className="p-4 glass-card hover:border-violet-500/40 rounded-3xl cursor-pointer flex items-center justify-between transition-all duration-200 active:scale-[0.99]"
              >
                <div className="min-w-0 pr-3">
                  <p className="font-extrabold text-white text-sm truncate">#{item.displayName}</p>
                  <p className="text-[11px] font-mono text-slate-400 truncate max-w-xs mt-0.5">{item.tag}</p>
                </div>
                <div className="text-right flex-shrink-0 font-mono">
                  <span className="text-sm font-black text-cyan-400">{item.cards.length}</span>
                  <p className="text-[10px] text-slate-500 uppercase">cards</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- Tag Manager View ---
    function TagTreeNode({ node, onBatchSuspend, selectedTags, onToggleSelect, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(depth === 0);
      const childNodes = Object.values(node.children);
      const hasChildren = childNodes.length > 0;
      const isSelected = selectedTags.includes(node.fullTag);

      return (
        <div className="flex flex-col select-none">
          <div 
            className={`flex items-center justify-between p-3.5 my-1 rounded-2xl border transition-all ${
              isSelected ? 'bg-violet-950/40 border-violet-500/60 shadow-lg shadow-violet-500/10' : 'glass-card hover:border-white/20'
            }`}
            style={{ marginLeft: `${depth * 20}px` }}
          >
            <div className="flex items-center space-x-3 flex-1 min-w-0 pr-2">
              {hasChildren ? (
                <button 
                  onClick={() => setIsOpen(!isOpen)}
                  className="w-7 h-7 flex items-center justify-center rounded-xl bg-white/[0.04] text-violet-400 hover:bg-violet-950 text-xs font-bold transition flex-shrink-0"
                >
                  {isOpen ? "▼" : "▶"}
                </button>
              ) : (
                <span className="w-7 h-7 flex items-center justify-center text-slate-600 text-xs flex-shrink-0">🏷️</span>
              )}

              <input 
                type="checkbox" 
                checked={isSelected} 
                onChange={() => onToggleSelect(node.fullTag)}
                className="rounded-lg text-violet-600 focus:ring-0 cursor-pointer flex-shrink-0 w-4 h-4 bg-transparent border-white/20" 
              />

              <div className="flex-1 min-w-0 cursor-pointer" onClick={() => onToggleSelect(node.fullTag)}>
                <div className="flex items-center space-x-2">
                  <span className="font-bold text-slate-100 text-sm truncate">{node.name}</span>
                  {hasChildren && (
                    <span className="text-[10px] font-mono text-cyan-400 bg-cyan-950/40 px-2 py-0.5 rounded-full">
                      +{childNodes.length}
                    </span>
                  )}
                </div>
                <p className="text-[11px] font-mono text-slate-400 mt-0.5">
                  <span className="text-emerald-400 font-bold">{node.active} active</span> • <span className="text-amber-400 font-bold">{node.suspended} susp</span> ({node.total} total)
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-1.5 flex-shrink-0">
              <button 
                onClick={() => onBatchSuspend(node.fullTag, true)}
                className="px-3 py-1.5 bg-white/[0.04] hover:bg-amber-950/60 hover:text-amber-300 text-slate-400 rounded-xl text-xs font-bold border border-white/[0.06] transition"
              >
                Suspend
              </button>
              <button 
                onClick={() => onBatchSuspend(node.fullTag, false)}
                className="px-3 py-1.5 bg-white/[0.04] hover:bg-emerald-950/60 hover:text-emerald-300 text-slate-400 rounded-xl text-xs font-bold border border-white/[0.06] transition"
              >
                Unsuspend
              </button>
            </div>
          </div>

          {hasChildren && isOpen && (
            <div className="flex flex-col border-l-2 border-violet-500/20 ml-4 pl-1">
              {childNodes.map(child => (
                <TagTreeNode 
                  key={child.fullTag} 
                  node={child} 
                  onBatchSuspend={onBatchSuspend}
                  selectedTags={selectedTags}
                  onToggleSelect={onToggleSelect}
                  depth={depth + 1}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    function ManagerView({ deckNode, allCards, onUpdate, onStartCustomStudy }) {
      const eligibleDeckIds = useMemo(() => Array.from(deckNode.allDeckIds), [deckNode]);
      const deckCards = useMemo(() => allCards.filter(c => eligibleDeckIds.includes(c.did)), [allCards, eligibleDeckIds]);
      
      const tagTree = useMemo(() => buildTagTree(deckCards), [deckCards]);
      const rootTagNodes = Object.values(tagTree);

      const [selectedTags, setSelectedTags] = useState([]);
      const [customIncludeSuspended, setCustomIncludeSuspended] = useState(true);
      const [searchTag, setSearchTag] = useState("");
      const [actionStatus, setActionStatus] = useState("");

      const handleBatchSuspend = async (fullTag, suspendState) => {
        setActionStatus(`Updating #${fullTag}...`);
        const cardsToUpdate = [];
        deckCards.forEach(c => {
          if (c.tags.some(t => t === fullTag || t.startsWith(fullTag + "::"))) {
            cardsToUpdate.push({ ...c, suspended: suspendState });
          }
        });

        await dbBatchUpdateCards(cardsToUpdate);
        await onUpdate();
        setActionStatus(`Done: ${cardsToUpdate.length} cards`);
        setTimeout(() => setActionStatus(""), 2000);
      };

      const handleBatchSuspendAll = async (suspendState) => {
        setActionStatus(suspendState ? "Suspending branch..." : "Unsuspending branch...");
        const cardsToUpdate = deckCards.map(c => ({ ...c, suspended: suspendState }));
        await dbBatchUpdateCards(cardsToUpdate);
        await onUpdate();
        setActionStatus(`Done: all ${cardsToUpdate.length} cards`);
        setTimeout(() => setActionStatus(""), 2000);
      };

      const handleToggleSelectTag = (fullTag) => {
        setSelectedTags(prev => 
          prev.includes(fullTag) ? prev.filter(t => t !== fullTag) : [...prev, fullTag]
        );
      };

      const filteredRootTags = useMemo(() => {
        if (!searchTag.trim()) return rootTagNodes;
        const q = searchTag.toLowerCase();
        return rootTagNodes.filter(node => node.fullTag.toLowerCase().includes(q));
      }, [rootTagNodes, searchTag]);

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-8 space-y-6 pb-28">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
              <h2 className="text-xl font-black text-white">{deckNode.displayName}</h2>
              <p className="text-xs font-mono text-slate-400 mt-1">Tag Cluster Control & Card Suspension</p>
              {actionStatus && (
                <p className="text-xs font-mono font-bold text-cyan-400 mt-1.5 animate-pulse">{actionStatus}</p>
              )}
            </div>
            
            <div className="flex space-x-2 font-mono">
              <button 
                onClick={() => handleBatchSuspendAll(true)} 
                className="px-4 py-2 bg-amber-950/40 hover:bg-amber-900/60 border border-amber-500/30 text-amber-300 rounded-2xl text-xs font-bold transition active:scale-95"
              >
                Suspend Branch ({deckCards.length})
              </button>
              <button 
                onClick={() => handleBatchSuspendAll(false)} 
                className="px-4 py-2 bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-500/30 text-emerald-300 rounded-2xl text-xs font-bold transition active:scale-95"
              >
                Unsuspend All
              </button>
            </div>
          </div>

          {selectedTags.length > 0 && (
            <div className="p-5 bg-gradient-to-r from-violet-950/60 to-pink-950/40 border border-violet-500/40 rounded-3xl space-y-3 shadow-xl">
              <div className="flex items-center justify-between">
                <p className="text-xs font-mono font-bold text-violet-300 uppercase tracking-widest">
                  Active Tag Drill ({selectedTags.length} clusters)
                </p>
                <button onClick={() => setSelectedTags([])} className="text-xs text-pink-400 font-mono underline">
                  Clear
                </button>
              </div>

              <div className="flex items-center space-x-2 text-sm">
                <input 
                  type="checkbox" 
                  id="include-susp" 
                  checked={customIncludeSuspended} 
                  onChange={(e) => setCustomIncludeSuspended(e.target.checked)}
                  className="rounded text-violet-600 focus:ring-0"
                />
                <label htmlFor="include-susp" className="text-slate-300 text-xs font-medium cursor-pointer">
                  Include suspended cards during sprint
                </label>
              </div>

              <button 
                onClick={() => onStartCustomStudy(selectedTags, customIncludeSuspended)}
                className="w-full py-3.5 bg-gradient-to-r from-violet-600 to-pink-600 hover:opacity-95 text-white font-extrabold rounded-2xl text-xs shadow-lg shadow-violet-600/30 transition active:scale-[0.99]"
              >
                START TAG SPRINT →
              </button>
            </div>
          )}

          <div className="space-y-3">
            <div className="flex items-center justify-between">
              <h3 className="text-xs font-mono font-bold tracking-widest uppercase text-slate-400">Tag Hierarchy</h3>
              <input 
                type="text" 
                placeholder="Search tags..." 
                value={searchTag}
                onChange={(e) => setSearchTag(e.target.value)}
                className="bg-white/[0.04] border border-white/[0.08] focus:border-violet-500 rounded-2xl px-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none w-56 font-mono"
              />
            </div>

            {filteredRootTags.length === 0 ? (
              <div className="glass-card rounded-3xl p-8 text-center">
                <p className="text-xs font-mono text-slate-500">No tags found in this deck branch.</p>
              </div>
            ) : (
              <div className="space-y-1">
                {filteredRootTags.map(node => (
                  <TagTreeNode 
                    key={node.fullTag} 
                    node={node} 
                    onBatchSuspend={handleBatchSuspend}
                    selectedTags={selectedTags}
                    onToggleSelect={handleToggleSelectTag}
                    depth={0}
                  />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
