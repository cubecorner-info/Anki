<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#090d16" />
  <title>AnkiFlow Tablet Edition</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          }
        }
      }
    }
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <style>
    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      -webkit-tap-highlight-color: transparent;
      overflow: hidden;
      touch-action: manipulation;
    }
    .panel-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .cloze-bracket {
      color: #38bdf8;
      font-weight: 700;
      background: rgba(56, 189, 248, 0.18);
      border: 1px dashed rgba(56, 189, 248, 0.5);
      padding: 4px 12px;
      border-radius: 8px;
    }
    .cloze-reveal {
      color: #34d399;
      font-weight: 700;
      background: rgba(52, 211, 153, 0.2);
      border: 1px solid rgba(52, 211, 153, 0.5);
      padding: 4px 12px;
      border-radius: 8px;
      display: inline-block;
    }
    .card-content img {
      max-width: 100%;
      max-height: 50vh;
      object-fit: contain;
      border-radius: 0.85rem;
      margin: 1.25rem auto;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: block;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col relative text-base select-none">

  <header class="px-6 py-4 bg-slate-950/90 border-b border-white/10 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center space-x-3">
      <span class="text-2xl">⚡</span>
      <h1 class="text-lg font-bold text-slate-100">AnkiFlow</h1>
    </div>
    <div class="flex gap-2">
      <button id="nav-decks" onclick="switchView('decks')" class="px-5 py-2.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-lg active:scale-95 transition">Decks</button>
      <button id="nav-browser" onclick="switchView('browser')" class="px-5 py-2.5 rounded-xl text-xs font-bold bg-white/5 text-slate-300 hover:bg-white/10 active:scale-95 transition">Browser</button>
    </div>
  </header>

  <main id="app-root" class="flex-1 overflow-y-auto relative">
    <!-- Dynamic Views Mount Here -->
  </main>

  <script>
    // Database Storage Utilities (IndexedDB)
    const DB_NAME = "AnkiFlowNativeDB";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("decks")) db.createObjectStore("decks", { keyPath: "id" });
          if (!db.objectStoreNames.contains("cards")) {
            const cardStore = db.createObjectStore("cards", { keyPath: "id" });
            cardStore.createIndex("did", "did", { unique: false });
          }
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "name" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutBatch(storeName, items) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbGetMediaMap() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("media", "readonly");
        const store = tx.objectStore("media");
        const req = store.getAll();
        req.onsuccess = () => {
          const map = {};
          (req.result || []).forEach(item => {
            const blob = new Blob([item.data]);
            map[item.name.toLowerCase()] = URL.createObjectURL(blob);
          });
          resolve(map);
        };
        req.onerror = () => reject(req.error);
      });
    }

    async function dbUpdateCard(card) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        store.put(card);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // App State Management
    let state = {
      view: 'decks',
      decks: [],
      cards: [],
      mediaMap: {},
      studyTarget: null,
      studyCards: [],
      studyIndex: 0,
      showAnswer: false,
      searchQuery: '',
      selectedCardIds: new Set()
    };

    async function refreshData() {
      state.decks = await dbGetAll("decks");
      state.cards = await dbGetAll("cards");
      state.mediaMap = await dbGetMediaMap();
      render();
    }

    function switchView(viewName) {
      state.view = viewName;
      document.getElementById('nav-decks').className = viewName === 'decks' ? "px-5 py-2.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-lg active:scale-95 transition" : "px-5 py-2.5 rounded-xl text-xs font-bold bg-white/5 text-slate-300 hover:bg-white/10 active:scale-95 transition";
      document.getElementById('nav-browser').className = viewName === 'browser' ? "px-5 py-2.5 rounded-xl text-xs font-bold bg-sky-600 text-white shadow-lg active:scale-95 transition" : "px-5 py-2.5 rounded-xl text-xs font-bold bg-white/5 text-slate-300 hover:bg-white/10 active:scale-95 transition";
      render();
    }

    // .apkg Importer
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const root = document.getElementById('app-root');
      root.innerHTML = `
        <div class="flex flex-col items-center justify-center h-full p-8 space-y-4">
          <div class="w-12 h-12 rounded-full border-4 border-slate-700 border-t-sky-400 animate-spin"></div>
          <p class="text-slate-300 font-mono text-sm">Parsing package & extracting media...</p>
        </div>`;

      try {
        const zip = await JSZip.loadAsync(file);
        let dbFile = zip.file("collection.anki21") || zip.file("collection.anki2");
        if (!dbFile) throw new Error("Missing SQLite deck database in package.");

        const dbBuffer = await dbFile.async("uint8array");
        const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
        const db = new SQL.Database(dbBuffer);

        let mediaNameMap = {};
        const mediaJsonFile = zip.file("media");
        if (mediaJsonFile) {
          const mediaJsonStr = await mediaJsonFile.async("text");
          try { mediaNameMap = JSON.parse(mediaJsonStr); } catch (e) {}
        }

        const mediaItems = [];
        for (const [zipKey, realName] of Object.entries(mediaNameMap)) {
          const imgFile = zip.file(zipKey);
          if (imgFile) {
            const data = await imgFile.async("uint8array");
            mediaItems.push({ name: realName.toLowerCase(), data });
          }
        }
        if (mediaItems.length > 0) await dbPutBatch("media", mediaItems);

        const colRes = db.exec("SELECT decks FROM col");
        const decksJson = JSON.parse(colRes[0].values[0][0]);
        const decks = [];
        for (const [id, d] of Object.entries(decksJson)) {
          if (d.name && d.name !== "Default") {
            decks.push({ id: String(d.id), name: d.name.replace(/[\x1f\u001f]/g, "::").trim() });
          }
        }

        const notesRes = db.exec("SELECT id, mid, flds, tags FROM notes");
        const notesMap = new Map();
        if (notesRes.length > 0) {
          notesRes[0].values.forEach(row => {
            const [id, mid, flds, tags] = row;
            const fields = flds.split("\x1f");
            const tagList = tags ? tags.trim().split(/\s+/).filter(Boolean) : [];
            notesMap.set(id, { id, fields, tags: tagList });
          });
        }

        const cardsRes = db.exec("SELECT id, nid, did, ord, queue, factor, reps, ivl, due FROM cards");
        const cards = [];
        if (cardsRes.length > 0) {
          cardsRes[0].values.forEach(row => {
            const [id, nid, did, ord, queue, factor, reps, ivl, due] = row;
            const note = notesMap.get(nid);
            if (note) {
              cards.push({
                id: String(id),
                nid: String(nid),
                did: String(did),
                ord: ord || 0,
                fields: note.fields,
                tags: note.tags,
                suspended: queue === -1,
                interval: ivl || 0,
                easeFactor: (factor || 2500) / 1000,
                reps: reps || 0,
                dueDate: due || Date.now()
              });
            }
          });
        }

        db.close();
        if (decks.length === 0) decks.push({ id: "1", name: file.name.replace(".apkg", "") });
        await dbPutBatch("decks", decks);
        await dbPutBatch("cards", cards);
        await refreshData();
      } catch (err) {
        alert("Import failed: " + err.message);
        render();
      }
    }

    // Card Renderer Helper
    function renderCardField(html, isFront = true, cardOrd = 0) {
      if (!html) return "";
      let processed = html;

      processed = processed.replace(/src=["']([^"']+)["']/gi, (match, src) => {
        const cleanName = src.split('/').pop().toLowerCase();
        if (state.mediaMap[cleanName]) {
          return `src="${state.mediaMap[cleanName]}"`;
        }
        return match;
      });

      const clozeRegex = /\{\{c(\d+)::([^:]+)(?:::(.*?))?\}\}/g;
      const targetOrd = cardOrd + 1;

      if (isFront) {
        processed = processed.replace(clozeRegex, (match, num, text, hint) => {
          if (parseInt(num) === targetOrd) {
            return `<span class="cloze-bracket">[${hint || "..."}]</span>`;
          }
          return text;
        });
      } else {
        processed = processed.replace(clozeRegex, (match, num, text) => {
          if (parseInt(num) === targetOrd) {
            return `<span class="cloze-reveal">${text}</span>`;
          }
          return text;
        });
      }

      return processed;
    }

    function calculateNextIntervals(interval, easeFactor) {
      const again = 0;
      const hard = interval === 0 ? 1 : Math.max(1, Math.round(interval * 1.2));
      const good = interval === 0 ? 1 : Math.max(1, Math.round(interval * easeFactor));
      const easy = interval === 0 ? 4 : Math.max(1, Math.round(interval * easeFactor * 1.3));

      const formatIvl = (d) => d === 0 ? "<1d" : `${d}d`;
      return {
        again: { days: again, label: "<1d" },
        hard: { days: hard, label: formatIvl(hard) },
        good: { days: good, label: formatIvl(good) },
        easy: { days: easy, label: formatIvl(easy) }
      };
    }

    // Deck Hierarchy Helper
    function buildCleanDeckTree() {
      const root = { children: {} };
      state.decks.forEach(d => {
        const parts = d.name.split("::").map(p => p.trim()).filter(Boolean);
        let current = root;
        parts.forEach((part, idx) => {
          if (!current.children[part]) {
            current.children[part] = {
              displayName: part,
              fullName: parts.slice(0, idx + 1).join("::"),
              deckId: idx === parts.length - 1 ? d.id : null,
              children: {},
              allDeckIds: new Set()
            };
          }
          if (idx === parts.length - 1) current.children[part].deckId = d.id;
          current = current.children[part];
        });
      });

      function populateStats(node) {
        const childNodes = Object.values(node.children);
        let directCards = [];
        let descendantDeckIds = new Set();

        if (node.deckId) {
          descendantDeckIds.add(node.deckId);
          directCards = state.cards.filter(c => c.did === node.deckId);
        }

        let allNodeCards = [...directCards];
        childNodes.forEach(child => {
          populateStats(child);
          child.allDeckIds.forEach(id => descendantDeckIds.add(id));
          allNodeCards = allNodeCards.concat(state.cards.filter(c => child.allDeckIds.has(c.did)));
        });

        const uniqueCardsMap = new Map();
        allNodeCards.forEach(c => uniqueCardsMap.set(c.id, c));
        const uniqueCards = Array.from(uniqueCardsMap.values());

        node.newCount = uniqueCards.filter(c => !c.suspended && c.reps === 0).length;
        node.learningCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval < 1).length;
        node.reviewCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval >= 1).length;
        node.allDeckIds = descendantDeckIds;
      }

      Object.values(root.children).forEach(populateStats);
      return root.children;
    }

    // Render Logic
    function renderDecksView() {
      const tree = buildCleanDeckTree();
      const nodes = Object.values(tree);

      let decksHtml = nodes.map(node => `
        <div onclick="startStudy('${node.displayName}', '${Array.from(node.allDeckIds).join(',')}')" class="flex items-center justify-between p-5 my-2 panel-card hover:border-slate-500 rounded-2xl cursor-pointer transition active:scale-[0.99]">
          <span class="font-semibold text-slate-100 text-lg truncate">${node.displayName}</span>
          <div class="flex items-center space-x-2 text-xs font-mono font-bold">
            <span class="text-sky-400 bg-sky-950/60 border border-sky-500/30 px-3 py-1.5 rounded-xl">${node.newCount}</span>
            <span class="text-rose-400 bg-rose-950/60 border border-rose-500/30 px-3 py-1.5 rounded-xl">${node.learningCount}</span>
            <span class="text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-1.5 rounded-xl">${node.reviewCount}</span>
          </div>
        </div>
      `).join('');

      return `
        <div class="max-w-4xl mx-auto p-4 md:p-6 space-y-6">
          <div class="border border-dashed border-white/20 bg-white/[0.02] hover:border-sky-500/50 rounded-2xl p-8 text-center cursor-pointer">
            <input type="file" accept=".apkg" onchange="handleFileUpload(event)" id="file-input" class="hidden" />
            <label for="file-input" class="cursor-pointer block space-y-2">
              <span class="text-4xl block">📥</span>
              <p class="font-bold text-base text-slate-100">Import Anki Deck (.apkg)</p>
              <p class="text-xs text-slate-400">Tap here to choose a file from your iPad or PC</p>
            </label>
          </div>
          <div class="space-y-2">${decksHtml || `<div class="text-center py-10 text-slate-500">No decks imported yet.</div>`}</div>
        </div>
      `;
    }

    function startStudy(title, deckIdsStr) {
      const deckIds = new Set(deckIdsStr.split(','));
      state.studyTarget = title;
      state.studyCards = state.cards.filter(c => deckIds.has(c.did) && !c.suspended);
      state.studyIndex = 0;
      state.showAnswer = false;
      state.view = 'study';
      render();
    }

    async function processRating(rating) {
      const currentCard = state.studyCards[state.studyIndex];
      const ivls = calculateNextIntervals(currentCard.interval || 0, currentCard.easeFactor || 2.5);

      let newInterval = currentCard.interval || 0;
      let newEase = currentCard.easeFactor || 2.5;

      if (rating === 1) { newInterval = ivls.again.days; newEase = Math.max(1.3, newEase - 0.2); }
      else if (rating === 2) { newInterval = ivls.hard.days; }
      else if (rating === 3) { newInterval = ivls.good.days; }
      else if (rating === 4) { newInterval = ivls.easy.days; newEase += 0.15; }

      await dbUpdateCard({
        ...currentCard,
        reps: (currentCard.reps || 0) + 1,
        interval: newInterval,
        easeFactor: newEase,
        dueDate: Date.now() + newInterval * 86400000
      });

      state.showAnswer = false;
      if (state.studyIndex < state.studyCards.length - 1) {
        state.studyIndex++;
        render();
      } else {
        await refreshData();
        switchView('decks');
      }
    }

    function renderStudyView() {
      const currentCard = state.studyCards[state.studyIndex];

      if (!currentCard) {
        return `
          <div class="flex flex-col items-center justify-center h-full p-8 text-center space-y-4">
            <span class="text-6xl">🎉</span>
            <h2 class="text-2xl font-bold text-slate-100">Session Complete!</h2>
            <button onclick="switchView('decks')" class="px-6 py-3 bg-sky-600 text-white rounded-2xl text-base font-bold shadow-lg active:scale-95 transition">
              Return to Decks
            </button>
          </div>
        `;
      }

      const ivls = calculateNextIntervals(currentCard.interval || 0, currentCard.easeFactor || 2.5);

      return `
        <div class="max-w-4xl mx-auto h-full flex flex-col p-4 md:p-6 justify-between">
          <div class="flex items-center justify-between text-sm text-slate-400 mb-3 font-mono">
            <button onclick="switchView('decks')" class="px-3 py-1.5 bg-white/5 rounded-lg text-xs font-bold">← Back</button>
            <span>${state.studyTarget} (${state.studyIndex + 1} / ${state.studyCards.length})</span>
          </div>

          <div onclick="if (!state.showAnswer) { state.showAnswer = true; render(); }" class="flex-1 panel-card rounded-3xl p-6 md:p-10 flex flex-col justify-center items-center text-center overflow-y-auto mb-4 cursor-pointer shadow-2xl">
            <div class="card-content text-slate-100 text-xl md:text-2xl leading-relaxed w-full font-normal">
              ${renderCardField(currentCard.fields?.[0], true, currentCard.ord)}
            </div>
            ${state.showAnswer ? `
              <hr class="w-full border-white/10 my-6" />
              <div class="card-content text-slate-200 text-lg md:text-xl leading-relaxed w-full">
                ${renderCardField(currentCard.fields?.[1] || currentCard.fields?.[0], false, currentCard.ord)}
              </div>
            ` : ''}
          </div>

          <div class="pb-4">
            ${!state.showAnswer ? `
              <button onclick="state.showAnswer = true; render();" class="w-full py-5 bg-sky-600 hover:bg-sky-500 active:scale-[0.98] text-white font-bold text-xl rounded-2xl shadow-xl transition">
                Show Answer
              </button>
            ` : `
              <div class="grid grid-cols-4 gap-3">
                <button onclick="processRating(1)" class="py-4 bg-rose-950/80 hover:bg-rose-900 border border-rose-500/50 text-rose-200 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition">
                  <span class="text-xs opacity-75 font-mono">${ivls.again.label}</span>
                  <span class="text-lg font-bold">Again</span>
                </button>
                <button onclick="processRating(2)" class="py-4 bg-amber-950/80 hover:bg-amber-900 border border-amber-500/50 text-amber-200 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition">
                  <span class="text-xs opacity-75 font-mono">${ivls.hard.label}</span>
                  <span class="text-lg font-bold">Hard</span>
                </button>
                <button onclick="processRating(3)" class="py-4 bg-emerald-950/80 hover:bg-emerald-900 border border-emerald-500/50 text-emerald-200 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition">
                  <span class="text-xs opacity-75 font-mono">${ivls.good.label}</span>
                  <span class="text-lg font-bold">Good</span>
                </button>
                <button onclick="processRating(4)" class="py-4 bg-sky-950/80 hover:bg-sky-900 border border-sky-500/50 text-sky-200 rounded-2xl flex flex-col items-center justify-center active:scale-95 transition">
                  <span class="text-xs opacity-75 font-mono">${ivls.easy.label}</span>
                  <span class="text-lg font-bold">Easy</span>
                </button>
              </div>
            `}
          </div>
        </div>
      `;
    }

    function renderBrowserView() {
      const q = state.searchQuery.toLowerCase().trim();
      const filtered = state.cards.filter(c => {
        if (!q) return true;
        return (c.fields?.[0] || "").toLowerCase().includes(q) || (c.fields?.[1] || "").toLowerCase().includes(q);
      });

      return `
        <div class="flex flex-col h-full max-w-7xl mx-auto p-4 gap-4">
          <div class="bg-slate-900 p-3 rounded-2xl border border-white/10">
            <input type="text" value="${state.searchQuery}" oninput="state.searchQuery = this.value; render();" placeholder="Search cards..." class="w-full bg-slate-950 border border-white/15 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none" />
          </div>
          <div class="bg-slate-900 border border-white/10 rounded-2xl overflow-y-auto flex-1">
            <table class="w-full text-left text-sm border-collapse">
              <thead class="bg-slate-950 text-slate-400 sticky top-0 border-b border-white/10 font-mono text-xs uppercase">
                <tr>
                  <th class="p-3">Front</th>
                  <th class="p-3">Back</th>
                  <th class="p-3">Interval</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-white/5">
                ${filtered.slice(0, 100).map(c => `
                  <tr class="hover:bg-white/[0.03]">
                    <td class="p-3 max-w-[250px] truncate">${c.fields?.[0] || ""}</td>
                    <td class="p-3 max-w-[250px] truncate">${c.fields?.[1] || ""}</td>
                    <td class="p-3 font-mono text-xs">${c.interval || 0}d</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('app-root');
      if (state.view === 'decks') root.innerHTML = renderDecksView();
      else if (state.view === 'study') root.innerHTML = renderStudyView();
      else if (state.view === 'browser') root.innerHTML = renderBrowserView();
    }

    // Initialize App
    refreshData();
  </script>
</body>
</html>
