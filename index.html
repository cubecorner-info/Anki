  <!-- APPLICATION LOGIC IN PURE VANILLA JAVASCRIPT -->
  <script>

    // --- INDEXEDDB MEDIA CACHE UTILITY ---
    const DB_NAME = 'AnkiFlowMediaDB';
    const STORE_NAME = 'media';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveMediaToDB = async (filename, blob) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(blob, filename.toLowerCase());
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getMediaFromDB = async (filename) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(filename.toLowerCase());
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const clearMediaDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // --- STATE MANAGEMENT ---
    let state = {
      view: 'decks',
      decks: {},
      cards: [],
      selectedDeck: null,
      reviewQueue: [],
      currentCardIndex: 0,
      showAnswer: false,
      selectedTag: null,
      objectUrlCache: new Map()
    };


    // --- ENHANCED ANKI CLOZE PARSER ---
    function parseCloze(text, targetOrdinal, isBack) {
      if (!text) return '';
      // Pattern matches standard {{c1::answer::hint}} or {{c1::answer}}
      const regex = /\{\{c(\d+)::([^:]*?)(?:::(.*?))?\}\}/gs;

      return text.replace(regex, (match, ord, answer, hint) => {
        const ordinal = parseInt(ord, 10);
        if (ordinal === targetOrdinal) {
          if (isBack) {
            return `<span class="cloze-revealed">${answer}</span>`;
          } else {
            const displayHint = hint && hint.trim() ? hint.trim() : '...';
            return `<span class="cloze-placeholder">[${displayHint}]</span>`;
          }
        } else {
          return `<span class="cloze-inactive">${answer}</span>`;
        }
      });
    }

    function extractClozeOrdinals(text) {
      if (!text) return [];
      const regex = /\{\{c(\d+)::/g;
      const ordinals = new Set();
      let match;
      while ((match = regex.exec(text)) !== null) {
        ordinals.add(parseInt(match[1], 10));
      }
      return Array.from(ordinals);
    }

    function stripHTML(html) {
      if (!html) return '';
      return html
        .replace(/\{\{c\d+::(.*?)(?:::.*?)?\}\}/g, '$1')
        .replace(/<[^>]*>?/gm, '')
        .trim();
    }

    // --- ANKI SM-2 SCHEDULING ---
    function calculateSM2(card, rating) {
      let interval = card.interval || 0;
      let reps = card.reps || 0;
      let ease = card.ease || 2.5;

      if (rating === 1) { // Again
        reps = 0;
        interval = 0;
      } else {
        if (rating === 2) { // Hard
          ease = Math.max(1.3, ease - 0.15);
          interval = interval === 0 ? 1 : Math.round(interval * 1.2);
        } else if (rating === 3) { // Good
          if (reps === 0) interval = 1;
          else if (reps === 1) interval = 6;
          else interval = Math.round(interval * ease);
        } else if (rating === 4) { // Easy
          ease = ease + 0.15;
          if (reps === 0) interval = 4;
          else if (reps === 1) interval = 10;
          else interval = Math.round(interval * ease * 1.3);
        }
        reps += 1;
      }

      const now = new Date();
      const dueDate = new Date(now);
      if (interval === 0) {
        dueDate.setMinutes(dueDate.getMinutes() + 1);
      } else {
        dueDate.setDate(dueDate.getDate() + interval);
      }

      return {
        ...card,
        reps,
        interval,
        ease,
        due: dueDate.getTime(),
        lastReviewed: now.getTime()
      };
    }

    function getIntervalBadgeText(card, rating) {
      const nextCard = calculateSM2(card, rating);
      if (nextCard.interval === 0) return '<1m';
      if (nextCard.interval === 1) return '1d';
      return `${nextCard.interval}d`;
    }


    // --- RESIZABLE SIDEBAR EVENT LISTENERS ---
    let isDragging = false;
    const resizer = document.getElementById('sidebar-resizer');
    const tagSidebar = document.getElementById('tag-sidebar');

    function onStartDrag(e) {
      isDragging = true;
      document.body.style.cursor = 'col-resize';
    }

    function onMoveDrag(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const newWidth = Math.max(180, Math.min(600, clientX));
      tagSidebar.style.width = `${newWidth}px`;
    }

    function onStopDrag() {
      if (isDragging) {
        isDragging = false;
        document.body.style.cursor = 'default';
      }
    }

    resizer.addEventListener('mousedown', onStartDrag);
    resizer.addEventListener('touchstart', onStartDrag);
    window.addEventListener('mousemove', onMoveDrag);
    window.addEventListener('touchmove', onMoveDrag);
    window.addEventListener('mouseup', onStopDrag);
    window.addEventListener('touchend', onStopDrag);


    // --- IMPORT APKG FILE PROCESSOR ---
    async function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      showLoading('Extracting APKG archive...');

      try {
        await clearMediaDB();
        state.objectUrlCache.clear();

        const zip = await JSZip.loadAsync(file);
        
        showLoading('Processing & caching media assets...');
        const mediaFile = zip.file('media');
        if (mediaFile) {
          const mediaJsonText = await mediaFile.async('text');
          const mediaMap = JSON.parse(mediaJsonText);

          for (const [key, filename] of Object.entries(mediaMap)) {
            const zipItem = zip.file(key);
            if (zipItem) {
              const blob = await zipItem.async('blob');
              await saveMediaToDB(filename, blob);
            }
          }
        }

        showLoading('Parsing SQLite database...');
        let dbFile = zip.file('collection.anki2') || zip.file('collection.anki21');
        if (!dbFile) {
          throw new Error('Invalid APKG file: collection database not found.');
        }

        const dbBuffer = await dbFile.async('arraybuffer');
        const SQL = await initSqlJs({
          locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
        });
        const db = new SQL.Database(new Uint8Array(dbBuffer));

        const parsedDecks = {};
        const parsedCards = [];

        const decksQuery = db.exec("SELECT val FROM col");
        if (decksQuery.length > 0) {
          const colVal = JSON.parse(decksQuery[0].values[0][0]);
          const deckMeta = colVal.decks || {};
          Object.values(deckMeta).forEach(d => {
            parsedDecks[d.id] = d.name;
          });
        }

        const notesStmt = db.prepare(`
          SELECT cards.id, cards.did, cards.ord, notes.flds, notes.sfld, notes.tags, models.css
          FROM cards 
          JOIN notes ON cards.nid = notes.id 
          JOIN models ON notes.mid = models.id
        `);

        while (notesStmt.step()) {
          const row = notesStmt.getAsObject();
          const fields = row.flds.split('\x1f');
          const tags = row.tags ? row.tags.trim().split(/\s+/).filter(Boolean) : [];
          const deckName = parsedDecks[row.did] || 'Default';

          const frontField = fields[0] || '';
          const backField = fields.slice(1).join('<br>') || '';

          const clozeOrdinals = extractClozeOrdinals(frontField);

          if (clozeOrdinals.length > 0) {
            clozeOrdinals.forEach(ord => {
              parsedCards.push({
                id: `${row.id}_c${ord}`,
                deckId: row.did,
                deckName: deckName,
                front: frontField,
                back: backField,
                tags: tags,
                isCloze: true,
                clozeOrdinal: ord,
                suspended: false,
                reps: 0,
                interval: 0,
                ease: 2.5,
                due: Date.now()
              });
            });
          } else {
            parsedCards.push({
              id: row.id,
              deckId: row.did,
              deckName: deckName,
              front: frontField,
              back: backField,
              tags: tags,
              isCloze: false,
              suspended: false,
              reps: 0,
              interval: 0,
              ease: 2.5,
              due: Date.now()
            });
          }
        }

        notesStmt.free();
        db.close();

        state.cards = parsedCards;

        const deckCounts = {};
        parsedCards.forEach(c => {
          deckCounts[c.deckName] = (deckCounts[c.deckName] || 0) + 1;
        });
        state.decks = deckCounts;

        document.getElementById('total-card-count').innerText = parsedCards.length;

        hideLoading();
        renderDecksView();
        renderTagTree();
      } catch (err) {
        console.error(err);
        alert('Error importing APKG file: ' + err.message);
        hideLoading();
      }
    }


    // --- UI NAVIGATION & VIEW RENDERERS ---
    function switchView(targetView) {
      state.view = targetView;
      
      document.getElementById('view-decks').classList.add('hidden');
      document.getElementById('view-review').classList.add('hidden');
      document.getElementById('view-browser').classList.add('hidden');

      document.getElementById('nav-btn-decks').className = "px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 text-gray-400 hover:text-gray-200";
      document.getElementById('nav-btn-browser').className = "px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 text-gray-400 hover:text-gray-200";

      if (targetView === 'decks') {
        document.getElementById('view-decks').classList.remove('hidden');
        document.getElementById('nav-btn-decks').className = "px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 bg-gray-800 text-white shadow-inner";
        renderDecksView();
      } else if (targetView === 'browser') {
        document.getElementById('view-browser').classList.remove('hidden');
        document.getElementById('nav-btn-browser').className = "px-4 py-2 rounded-lg text-sm font-bold transition flex items-center gap-2 bg-gray-800 text-white shadow-inner";
        renderTagTree();
        renderBrowserTable();
      } else if (targetView === 'review') {
        document.getElementById('view-review').classList.remove('hidden');
      }
    }

    function renderDecksView() {
      const grid = document.getElementById('decks-grid');
      grid.innerHTML = '';

      const deckEntries = Object.entries(state.decks);
      if (deckEntries.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full border-2 border-dashed border-gray-800 rounded-3xl p-12 text-center flex flex-col items-center justify-center my-12 bg-gray-900/20">
            <div class="w-20 h-20 rounded-2xl bg-gray-900 border border-gray-800 flex items-center justify-center text-gray-600 text-3xl mb-4">
              <i class="fa-solid fa-box-open"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-200 mb-2 font-display">No Decks Imported</h3>
            <p class="text-gray-500 max-w-sm mb-6 text-sm">Upload an Anki package (.apkg file) using the import button in the top right header.</p>
          </div>
        `;
        return;
      }

      deckEntries.forEach(([deckName, count]) => {
        const cardEl = document.createElement('div');
        cardEl.className = "bg-gray-900/60 border border-gray-800 hover:border-gray-700 rounded-2xl p-6 transition flex flex-col justify-between hover:shadow-2xl hover:shadow-brand-500/5 group";
        cardEl.innerHTML = `
          <div>
            <div class="flex items-start justify-between mb-4">
              <h3 class="text-lg font-bold text-gray-100 group-hover:text-brand-400 transition line-clamp-2 font-display">${deckName}</h3>
              <span class="bg-gray-800 text-gray-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-gray-700/80">
                ${count} cards
              </span>
            </div>
          </div>
          <button onclick="startReview('${deckName.replace(/'/g, "\\'")}')" class="w-full mt-4 bg-gray-800 group-hover:bg-brand-600 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md active:scale-95">
            <i class="fa-solid fa-play text-xs"></i> Study Deck
          </button>
        `;
        grid.appendChild(cardEl);
      });
    }


    // --- REVIEW CONTROLLER ---
    function startReview(deckName) {
      state.selectedDeck = deckName;
      state.reviewQueue = state.cards.filter(c => c.deckName === deckName && !c.suspended);
      state.currentCardIndex = 0;
      state.showAnswer = false;

      if (state.reviewQueue.length === 0) {
        alert("No active cards to review in this deck.");
        return;
      }

      switchView('review');
      renderCurrentReviewCard();
    }

    async function processMediaTags(htmlContent) {
      if (!htmlContent) return '';
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlContent, 'text/html');
      
      const imgs = Array.from(doc.querySelectorAll('img'));
      for (let img of imgs) {
        const src = img.getAttribute('src');
        if (src && !src.startsWith('http') && !src.startsWith('data:')) {
          if (state.objectUrlCache.has(src)) {
            img.src = state.objectUrlCache.get(src);
          } else {
            const blob = await getMediaFromDB(src);
            if (blob) {
              const url = URL.createObjectURL(blob);
              state.objectUrlCache.set(src, url);
              img.src = url;
            }
          }
        }
      }

      return doc.body.innerHTML;
    }

    async function renderCurrentReviewCard() {
      const card = state.reviewQueue[state.currentCardIndex];
      if (!card) return;

      document.getElementById('review-deck-name').innerHTML = `<i class="fa-solid fa-layer-group text-brand-500"></i> ${card.deckName}`;
      document.getElementById('review-current-num').innerText = state.currentCardIndex + 1;
      document.getElementById('review-total-num').innerText = state.reviewQueue.length;

      let rawFront = card.front;
      let rawBack = card.back;

      if (card.isCloze) {
        const targetOrd = card.clozeOrdinal || 1;
        rawFront = parseCloze(card.front, targetOrd, false);
        const revealedFront = parseCloze(card.front, targetOrd, true);
        rawBack = revealedFront + (card.back ? `<hr class="my-6 border-gray-800">${card.back}` : '');
      }

      const processedFront = await processMediaTags(rawFront);
      const processedBack = await processMediaTags(rawBack);

      document.getElementById('review-front-content').innerHTML = processedFront;
      document.getElementById('review-back-content').innerHTML = processedBack;

      document.getElementById('review-back-wrapper').classList.add('hidden');
      document.getElementById('show-answer-btn').classList.remove('hidden');
      document.getElementById('rating-buttons').classList.add('hidden');

      // Update Interval Badges
      document.getElementById('badge-again').innerText = getIntervalBadgeText(card, 1);
      document.getElementById('badge-hard').innerText = getIntervalBadgeText(card, 2);
      document.getElementById('badge-good').innerText = getIntervalBadgeText(card, 3);
      document.getElementById('badge-easy').innerText = getIntervalBadgeText(card, 4);
    }

    function revealAnswer() {
      state.showAnswer = true;
      document.getElementById('review-back-wrapper').classList.remove('hidden');
      document.getElementById('show-answer-btn').classList.add('hidden');
      document.getElementById('rating-buttons').classList.remove('hidden');
      document.getElementById('rating-buttons').classList.add('grid');
    }

    function submitRating(rating) {
      const currentCard = state.reviewQueue[state.currentCardIndex];
      if (!currentCard) return;

      const updatedCard = calculateSM2(currentCard, rating);
      state.cards = state.cards.map(c => c.id === updatedCard.id ? updatedCard : c);

      if (rating === 1) {
        state.reviewQueue.push(updatedCard);
      }

      if (state.currentCardIndex + 1 < state.reviewQueue.length) {
        state.currentCardIndex++;
        state.showAnswer = false;
        renderCurrentReviewCard();
      } else {
        alert("Deck review completed!");
        switchView('decks');
      }
    }


    // --- BROWSER & TAG TREE CONTROLLER ---
    function buildTagTreeData() {
      const tree = {};
      state.cards.forEach(card => {
        card.tags.forEach(tag => {
          const parts = tag.split('::');
          let current = tree;
          parts.forEach((part, idx) => {
            if (!current[part]) {
              current[part] = { _fullTag: parts.slice(0, idx + 1).join('::'), _children: {} };
            }
            current = current[part]._children;
          });
        });
      });
      return tree;
    }

    function renderTagTree() {
      const container = document.getElementById('tag-tree-container');
      container.innerHTML = '';

      const tree = buildTagTreeData();
      if (Object.keys(tree).length === 0) {
        container.innerHTML = `<div class="text-xs text-gray-500 italic p-3">No tags found in deck</div>`;
        return;
      }

      function appendNode(parentEl, name, node, depth = 0) {
        const tagCards = state.cards.filter(c => c.tags.some(t => t.startsWith(node._fullTag)));
        const suspendedCount = tagCards.filter(c => c.suspended).length;
        const allSuspended = tagCards.length > 0 && suspendedCount === tagCards.length;

        const wrapper = document.createElement('div');
        wrapper.style.paddingLeft = `${depth * 10}px`;
        wrapper.className = "my-0.5";

        const isSelected = state.selectedTag === node._fullTag;

        wrapper.innerHTML = `
          <div class="group flex items-center justify-between p-2 rounded-xl cursor-pointer text-sm font-medium transition ${
            isSelected ? 'bg-brand-600 text-white shadow-md' : 'hover:bg-gray-800/80 text-gray-300'
          }">
            <div class="flex items-center gap-2 min-w-0 flex-1" onclick="filterByTag('${node._fullTag}')">
              <i class="fa-solid fa-tag text-xs text-brand-400"></i>
              <span class="truncate font-medium">${name}</span>
            </div>
            <div class="flex items-center gap-1 ml-2 flex-shrink-0">
              <span class="text-xs bg-gray-950/50 px-2 py-0.5 rounded-md text-gray-400 border border-gray-800">${tagCards.length}</span>
              <button onclick="toggleTagSuspend('${node._fullTag}', ${!allSuspended})" class="p-1 rounded hover:bg-gray-700 transition text-xs ${allSuspended ? 'text-amber-400 opacity-100' : 'text-gray-400 opacity-0 group-hover:opacity-100'}">
                <i class="fa-solid ${allSuspended ? 'fa-pause' : 'fa-play'}"></i>
              </button>
            </div>
          </div>
        `;

        parentEl.appendChild(wrapper);

        const children = Object.entries(node._children);
        if (children.length > 0) {
          children.forEach(([childName, childNode]) => {
            appendNode(parentEl, childName, childNode, depth + 1);
          });
        }
      }

      Object.entries(tree).forEach(([tagName, node]) => {
        appendNode(container, tagName, node, 0);
      });
    }

    function filterByTag(tag) {
      state.selectedTag = tag;
      const indicator = document.getElementById('active-tag-indicator');
      const clearBtn = document.getElementById('clear-tag-btn');

      if (tag) {
        indicator.classList.remove('hidden');
        clearBtn.classList.remove('hidden');
        document.getElementById('active-tag-text').innerText = `Tag: ${tag}`;
      } else {
        indicator.classList.add('hidden');
        clearBtn.classList.add('hidden');
      }

      renderTagTree();
      renderBrowserTable();
    }

    function toggleTagSuspend(tagPrefix, suspend) {
      state.cards = state.cards.map(c => {
        if (c.tags.some(t => t.startsWith(tagPrefix))) {
          return { ...c, suspended: suspend };
        }
        return c;
      });
      renderTagTree();
      renderBrowserTable();
    }

    function renderBrowserTable() {
      const tbody = document.getElementById('browser-table-body');
      tbody.innerHTML = '';

      const query = document.getElementById('browser-search-input').value.toLowerCase();

      const filtered = state.cards.filter(card => {
        const matchesSearch = !query || 
          card.front.toLowerCase().includes(query) || 
          card.back.toLowerCase().includes(query);
        const matchesTag = !state.selectedTag || card.tags.some(t => t.startsWith(state.selectedTag));
        return matchesSearch && matchesTag;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colSpan="4" class="p-8 text-center text-gray-500 text-sm">No matching cards found.</td>
          </tr>
        `;
        return;
      }

      filtered.forEach(card => {
        const tr = document.createElement('tr');
        tr.className = `hover:bg-gray-800/40 transition ${card.suspended ? 'opacity-50 bg-gray-950/40' : ''}`;
        
        const tagsHtml = card.tags.map(t => `<span class="bg-gray-800 text-gray-300 text-xs px-2 py-0.5 rounded border border-gray-700/60">${t}</span>`).join(' ');

        tr.innerHTML = `
          <td class="p-4 max-w-md truncate font-medium text-gray-200">${stripHTML(card.front)}</td>
          <td class="p-4 text-gray-400 whitespace-nowrap font-medium">${card.deckName}</td>
          <td class="p-4"><div class="flex flex-wrap gap-1">${tagsHtml}</div></td>
          <td class="p-4 text-center">
            <button onclick="toggleCardSuspend('${card.id}')" class="px-2.5 py-1 rounded text-xs font-bold transition ${
              card.suspended ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30'
            }">
              ${card.suspended ? 'Suspended' : 'Active'}
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function toggleCardSuspend(cardId) {
      state.cards = state.cards.map(c => c.id === cardId ? { ...c, suspended: !c.suspended } : c);
      renderBrowserTable();
      renderTagTree();
    }

    // --- HELPER FUNCTIONS ---
    function showLoading(msg) {
      document.getElementById('loading-msg').innerText = msg;
      document.getElementById('loading-overlay').classList.remove('hidden');
    }

    function hideLoading() {
      document.getElementById('loading-overlay').classList.add('hidden');
    }

    // INITIALIZE APPLICATION
    window.onload = function() {
      renderDecksView();
    };
  </script>
</body>
</html>
