  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DB_NAME = "AnkiFlowTabletDB";
    const DB_VERSION = 3;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("decks")) db.createObjectStore("decks", { keyPath: "id" });
          if (!db.objectStoreNames.contains("cards")) {
            const cardStore = db.createObjectStore("cards", { keyPath: "id" });
            cardStore.createIndex("did", "did", { unique: false });
          }
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "filename" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutBatch(storeName, items) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbUpdateCard(card) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        store.put(card);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteDeck(deckId, deckName, allDecks) {
      const prefix = deckName + "::";
      const matchingDeckIds = allDecks
        .filter(d => d.id === deckId || d.name === deckName || d.name.startsWith(prefix))
        .map(d => d.id);

      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["decks", "cards"], "readwrite");
        const deckStore = tx.objectStore("decks");
        const cardStore = tx.objectStore("cards");

        matchingDeckIds.forEach(id => deckStore.delete(id));
        const req = cardStore.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (matchingDeckIds.includes(cursor.value.did)) cursor.delete();
            cursor.continue();
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function parseApkg(file) {
      const zip = await JSZip.loadAsync(file);
      
      // 1. Process Media Map File (maps internal numeric keys to actual media filenames)
      const mediaMapFile = zip.file("media");
      const mediaMapping = mediaMapFile ? JSON.parse(await mediaMapFile.async("string")) : {};
      const mediaBlobStore = [];

      for (const [numericKey, rawFileName] of Object.entries(mediaMapping)) {
        const zippedMediaFile = zip.file(numericKey);
        if (zippedMediaFile) {
          const blob = await zippedMediaFile.async("blob");
          const dataUrl = await new Promise((res) => {
            const reader = new FileReader();
            reader.onloadend = () => res(reader.result);
            reader.readAsDataURL(blob);
          });
          
          // Store both original filename and decoded filename for matching
          const decodedName = decodeURIComponent(rawFileName);
          mediaBlobStore.push({ filename: rawFileName, dataUrl });
          if (decodedName !== rawFileName) {
            mediaBlobStore.push({ filename: decodedName, dataUrl });
          }
        }
      }

      if (mediaBlobStore.length > 0) {
        await dbPutBatch("media", mediaBlobStore);
      }

      // 2. Load SQLite Database File
      let dbFile = zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbFile) throw new Error("Missing SQLite collection file in .apkg archive.");

      const dbBuffer = await dbFile.async("uint8array");
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const db = new SQL.Database(dbBuffer);

      const colRes = db.exec("SELECT decks, models FROM col");
      const decksJson = JSON.parse(colRes[0].values[0][0]);

      const decks = [];
      for (const [id, d] of Object.entries(decksJson)) {
        if (d.name && d.name !== "Default") {
          const normalizedName = d.name.replace(/[\x1f\u001f]/g, "::").trim();
          decks.push({ id: String(d.id), name: normalizedName });
        }
      }

      const notesRes = db.exec("SELECT id, mid, flds, tags FROM notes");
      const notesMap = new Map();
      if (notesRes.length > 0) {
        notesRes[0].values.forEach(row => {
          const [id, mid, flds, tags] = row;
    <script type="text/babel">
      const { useState, useEffect, useRef, useMemo } = React;

      // Helper to process cloze markup based on active card index (ord + 1) and side (front vs back)
      function renderClozeText(text, cardOrd, isBackSide) {
        if (!text) return "";
        const targetIndex = (cardOrd || 0) + 1;
        
        // Regex matches {{c1::answer}}, {{c1::answer::hint}}, {{c1::multiline...}}
        const clozeRegex = /\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/gs;

        return text.replace(clozeRegex, (match, clozeNumStr, answer, hint) => {
          const clozeNum = parseInt(clozeNumStr, 10);
          
          if (clozeNum === targetIndex) {
            if (isBackSide) {
              // Back side: Highlight and reveal answer
              return `<span class="cloze-revealed bg-emerald-500/20 text-emerald-300 font-bold px-1.5 py-0.5 rounded border border-emerald-500/40">${answer}</span>`;
            } else {
              // Front side: Hide answer, show hint or placeholder [...]
              const displayHint = hint && hint.trim() ? `[${hint.trim()}]` : '[...]';
              return `<span class="cloze-hidden text-amber-400 font-bold px-1.5 py-0.5 bg-amber-500/10 rounded border border-amber-500/30">${displayHint}</span>`;
            }
          } else {
            // Non-active cloze deletions reveal their text neutrally (Anki standard)
            return answer;
          }
        });
      }

      db.close();
      if (decks.length === 0) decks.push({ id: "1", name: file.name.replace(".apkg", "") });
      await dbPutBatch("decks", decks);
      await dbPutBatch("cards", cards);
    }

    async function exportDeckToApkg(deckName, cards) {
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const db = new SQL.Database();

      db.run(`
        CREATE TABLE col (
          id INTEGER PRIMARY KEY, crt INTEGER NOT NULL, mod INTEGER NOT NULL, scm INTEGER NOT NULL,
          ver INTEGER NOT NULL, dcount INTEGER NOT NULL, empty INTEGER NOT NULL, ls INTEGER NOT NULL,
          conf TEXT NOT NULL, models TEXT NOT NULL, decks TEXT NOT NULL, dconf TEXT NOT NULL, tags TEXT NOT NULL
        );
        CREATE TABLE notes (
          id INTEGER PRIMARY KEY, guid TEXT NOT NULL, mid INTEGER NOT NULL, mod INTEGER NOT NULL,
          usn INTEGER NOT NULL, tags TEXT NOT NULL, flds TEXT NOT NULL, sfld INTEGER NOT NULL,
          csum INTEGER NOT NULL, flags INTEGER NOT NULL, data TEXT NOT NULL
        );
        CREATE TABLE cards (
          id INTEGER PRIMARY KEY, nid INTEGER NOT NULL, did INTEGER NOT NULL, ord INTEGER NOT NULL,
          mod INTEGER NOT NULL, usn INTEGER NOT NULL, type INTEGER NOT NULL, queue INTEGER NOT NULL,
          due INTEGER NOT NULL, ivl INTEGER NOT NULL, factor INTEGER NOT NULL, reps INTEGER NOT NULL,
          lapses INTEGER NOT NULL, left INTEGER NOT NULL, odue INTEGER NOT NULL, odid INTEGER NOT NULL,
          flags INTEGER NOT NULL, data TEXT NOT NULL
        );
      `);

      const now = Math.floor(Date.now() / 1000);
      const deckId = Date.now();
      const modelId = deckId + 1;

      const modelsJson = {};
      modelsJson[modelId] = {
        id: modelId,
        name: "Basic-AnkiFlow",
        flds: [{ name: "Front" }, { name: "Back" }],
        tmpls: [{ name: "Card 1", qfmt: "{{Front}}", afmt: "{{FrontSide}}<hr id=answer>{{Back}}" }]
      };

      const decksJson = { "1": { id: 1, name: "Default" } };
      decksJson[deckId] = { id: deckId, name: deckName };

      db.run("INSERT INTO col VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", [
        1, now, now * 1000, now * 1000, 11, 0, 0, 0, "{}", JSON.stringify(modelsJson), JSON.stringify(decksJson), "{}", "{}"
      ]);

      cards.forEach((c, idx) => {
        const nid = deckId + 10 + idx;
        const cid = deckId + 1000 + idx;
        const fldsStr = (c.fields || []).join("\x1f");
        const tagStr = (c.tags || []).join(" ");

        db.run("INSERT INTO notes VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", [
          nid, "guid" + nid, modelId, now, -1, ` ${tagStr} `, fldsStr, 0, 0, 0, ""
        ]);

        db.run("INSERT INTO cards VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", [
          cid, nid, deckId, c.ord || 0, now, -1, c.suspended ? -1 : (c.reps > 0 ? 2 : 0), c.suspended ? -1 : (c.reps > 0 ? 2 : 0), c.dueDate || now, c.interval || 0, Math.round((c.easeFactor || 2.5) * 1000), c.reps || 0, 0, 0, 0, 0, 0, ""
        ]);
      });

      const binaryArray = db.export();
      const zip = new JSZip();
      zip.file("collection.anki2", binaryArray);
      zip.file("media", "{}");

      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${deckName.replace(/::/g, "_")}.apkg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function renderCardField(html, isFront = true, clozeOrd = 0, mediaMap = {}) {
      if (!html) return "";
      let processed = html;

      // 1. Process Anki Cloze Deletions {{c1::text::hint}}
      const clozeRegex = /\{\{c(\d+)::([^:}]+)(?:::([^}]+))?\}\}/g;
      processed = processed.replace(clozeRegex, (match, num, text, hint) => {
        const isCurrentCloze = parseInt(num) === (clozeOrd + 1);
        if (isFront) {
          return isCurrentCloze ? `<span class="cloze-bracket">[${hint || "..."}]</span>` : text;
        } else {
          return isCurrentCloze ? `<span class="cloze-reveal">${text}</span>` : text;
        }
      });

      // 2. Extract and replace img src attributes with IndexedDB stored Data URLs
      processed = processed.replace(/<img\s+[^>]*src=["']([^"']+)["'][^>]*>/gi, (fullTag, srcValue) => {
        let cleanName = srcValue.split('/').pop().split('?')[0];
        try {
          cleanName = decodeURIComponent(cleanName);
        } catch(e) {}

        const matchedUrl = mediaMap[cleanName] || mediaMap[encodeURIComponent(cleanName)] || mediaMap[srcValue];
        
        if (matchedUrl) {
          return fullTag.replace(`src="${srcValue}"`, `src="${matchedUrl}"`).replace(`src='${srcValue}'`, `src="${matchedUrl}"`);
        }
        return fullTag;
      });

      return processed;
    }

    function calculateIntervals(card) {
      const reps = card.reps || 0;
      const interval = card.interval || 0;
      const ease = card.easeFactor || 2.5;

      if (reps === 0 || interval === 0) {
        // Learning Steps for New Cards
        return {
          again: { label: "<10m", ivl: 0, ease: Math.max(1.3, ease - 0.2) },
          hard: { label: "1d", ivl: 1, ease: Math.max(1.3, ease - 0.15) },
          good: { label: "1d", ivl: 1, ease: ease },
          easy: { label: "4d", ivl: 4, ease: ease + 0.15 }
        };
      }

      // Review Card Multipliers
      const hardIvl = Math.max(1, Math.round(interval * 1.2));
      const goodIvl = Math.max(hardIvl + 1, Math.round(interval * ease));
      const easyIvl = Math.max(goodIvl + 1, Math.round(interval * ease * 1.3));

      const formatDays = (d) => d < 30 ? `${d}d` : `${(d / 30).toFixed(1)}m`;

      return {
        again: { label: "1d", ivl: 1, ease: Math.max(1.3, ease - 0.2) },
        hard: { label: formatDays(hardIvl), ivl: hardIvl, ease: Math.max(1.3, ease - 0.15) },
        good: { label: formatDays(goodIvl), ivl: goodIvl, ease: ease },
        easy: { label: formatDays(easyIvl), ivl: easyIvl, ease: ease + 0.15 }
      };
    }

    function buildCleanDeckTree(decks, cards) {
      const root = { children: {} };
      decks.forEach(d => {
        const parts = d.name.split("::").map(p => p.trim()).filter(Boolean);
        let current = root;
        parts.forEach((part, idx) => {
          if (!current.children[part]) {
            current.children[part] = {
              displayName: part,
              fullName: parts.slice(0, idx + 1).join("::"),
              deckId: idx === parts.length - 1 ? d.id : null,
              children: {},
              allDeckIds: new Set()
            };
          }
          if (idx === parts.length - 1) current.children[part].deckId = d.id;
          current = current.children[part];
        });
      });

      function populateStats(node) {
        const childNodes = Object.values(node.children);
        let directCards = [];
        let descendantDeckIds = new Set();

        if (node.deckId) {
          descendantDeckIds.add(node.deckId);
          directCards = cards.filter(c => c.did === node.deckId);
        }

        let allNodeCards = [...directCards];
        childNodes.forEach(child => {
          populateStats(child);
          child.allDeckIds.forEach(id => descendantDeckIds.add(id));
          allNodeCards = allNodeCards.concat(cards.filter(c => child.allDeckIds.has(c.did)));
        });

        const uniqueCardsMap = new Map();
        allNodeCards.forEach(c => uniqueCardsMap.set(c.id, c));
        const uniqueCards = Array.from(uniqueCardsMap.values());

        node.newCount = uniqueCards.filter(c => !c.suspended && c.reps === 0).length;
        node.learningCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval < 1).length;
        node.reviewCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval >= 1).length;
        node.allDeckIds = descendantDeckIds;
      }

      Object.values(root.children).forEach(populateStats);
      return root.children;
    }

    function buildTagTree(cards) {
      const root = { children: {}, count: 0 };
      cards.forEach(card => {
        const tags = card.tags || [];
        tags.forEach(fullTag => {
          const parts = fullTag.split("::").map(p => p.trim()).filter(Boolean);
          let current = root;
          let cumulativePath = "";

          parts.forEach((part, idx) => {
            cumulativePath = idx === 0 ? part : `${cumulativePath}::${part}`;
            if (!current.children[part]) {
              current.children[part] = {
                name: part,
                fullTag: cumulativePath,
                children: {},
                count: 0
              };
            }
            current = current.children[part];
            current.count++;
          });
        });
      });
      return root.children;
    }

    function TagTreeNode({ node, searchQuery, setSearchQuery, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(false);
      const childNodes = Object.values(node.children);
      const isSelected = searchQuery === `tag:${node.fullTag}`;

      return (
        <div className="flex flex-col select-none">
          <div 
            onClick={() => setSearchQuery(`tag:${node.fullTag}`)}
            className={`group flex items-center justify-between py-2 px-3 rounded-xl cursor-pointer transition text-sm font-sans ${isSelected ? "bg-sky-600/30 text-sky-200 font-semibold border border-sky-500/40" : "text-slate-300 hover:bg-white/5 hover:text-white"}`}
            style={{ paddingLeft: `${depth * 14 + 10}px` }}
          >
            <div className="flex items-center space-x-2 truncate pr-2">
              {childNodes.length > 0 ? (
                <button onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }} className="w-5 h-5 flex items-center justify-center text-xs text-slate-400 hover:text-white">
                  {isOpen ? "◢" : "▶"}
                </button>
              ) : (
                <span className="w-4 h-4 flex items-center justify-center text-xs text-slate-500">🏷️</span>
              )}
              <span className="truncate">{node.name}</span>
            </div>
            <span className="text-[11px] font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full flex-shrink-0">
              {node.count}
            </span>
          </div>

          {childNodes.length > 0 && isOpen && (
            <div className="flex flex-col border-l border-white/10 ml-3">
              {childNodes.map(child => (
                <TagTreeNode key={child.fullTag} node={child} searchQuery={searchQuery} setSearchQuery={setSearchQuery} depth={depth + 1} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function BrowserScreen({ cards, decks, onCardUpdate }) {
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCardIds, setSelectedCardIds] = useState(new Set());

      const tagTreeRoot = useMemo(() => buildTagTree(cards), [cards]);

      const filteredCards = useMemo(() => {
        if (!searchQuery.trim()) return cards;
        const q = searchQuery.trim().toLowerCase();

        if (q.startsWith("tag:")) {
          const targetTag = q.slice(4).trim();
          return cards.filter(c => (c.tags || []).some(t => t.toLowerCase() === targetTag || t.toLowerCase().startsWith(targetTag + "::")));
        }
        if (q.startsWith("-tag:")) {
          const targetTag = q.slice(5).trim();
          return cards.filter(c => !(c.tags || []).some(t => t.toLowerCase() === targetTag || t.toLowerCase().startsWith(targetTag + "::")));
        }
        if (q === "is:suspended") {
          return cards.filter(c => c.suspended);
        }

        return cards.filter(c => 
          (c.fields?.[0] || "").toLowerCase().includes(q) ||
          (c.fields?.[1] || "").toLowerCase().includes(q) ||
          (c.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }, [cards, searchQuery]);

      const toggleSelectCard = (id) => {
        const next = new Set(selectedCardIds);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        setSelectedCardIds(next);
      };

      const toggleSuspendCards = async (targetCards, suspendState) => {
        const updated = targetCards.map(c => ({ ...c, suspended: suspendState }));
        await dbPutBatch("cards", updated);
        onCardUpdate();
      };

      const suspendUnselectedInQuery = async () => {
        const selectedSet = selectedCardIds.size > 0 ? selectedCardIds : new Set(filteredCards.map(c => c.id));
        const updated = cards.map(c => {
          if (!selectedSet.has(c.id)) {
            return { ...c, suspended: true };
          }
          return c;
        });
        await dbPutBatch("cards", updated);
        onCardUpdate();
      };

      return (
        <div className="flex flex-col h-full max-w-7xl mx-auto p-4 md:p-6 gap-5">
          {/* Top Search & Toolbar */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 p-4 rounded-2xl border border-white/10 shadow-lg">
            <div className="flex items-center gap-3 flex-1 min-w-[280px]">
              <span className="text-slate-400 text-lg ml-1">🔍</span>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search cards, tag:medical::cardio, -tag:verb, is:suspended..."
                className="w-full bg-slate-950 border border-white/15 rounded-xl px-4 py-3 text-base text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"
              />
            </div>

            <div className="flex items-center gap-2.5 text-sm font-semibold">
              <button
                onClick={() => {
                  const targetCards = selectedCardIds.size > 0 ? cards.filter(c => selectedCardIds.has(c.id)) : filteredCards;
                  toggleSuspendCards(targetCards, true);
                }}
                className="px-4 py-3 bg-amber-950/70 hover:bg-amber-900 border border-amber-500/40 text-amber-300 rounded-xl transition active:scale-95 shadow"
              >
                Suspend
              </button>

              <button
                onClick={() => {
                  const targetCards = selectedCardIds.size > 0 ? cards.filter(c => selectedCardIds.has(c.id)) : filteredCards;
                  toggleSuspendCards(targetCards, false);
                }}
                className="px-4 py-3 bg-emerald-950/70 hover:bg-emerald-900 border border-emerald-500/40 text-emerald-300 rounded-xl transition active:scale-95 shadow"
              >
                Unsuspend
              </button>

              <button
                onClick={suspendUnselectedInQuery}
                title="Suspend all cards EXCEPT selected or filtered cards"
                className="px-4 py-3 bg-rose-950/70 hover:bg-rose-900 border border-rose-500/40 text-rose-300 rounded-xl transition active:scale-95 shadow"
              >
                Suspend Others
              </button>
            </div>
          </div>

          {/* Browser Grid */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-5 flex-1 overflow-hidden">
            
            {/* Tag Sidebar Tree */}
            <div className="bg-slate-900/80 border border-white/10 rounded-2xl p-4 overflow-y-auto space-y-1.5 text-sm">
              <div className="font-bold text-slate-400 mb-3 px-2 text-xs uppercase tracking-wider font-mono flex items-center justify-between">
                <span>Anki Tag Hierarchy</span>
                <span className="text-[10px] text-slate-500">Tree View</span>
              </div>
              
              <button
                onClick={() => setSearchQuery("")}
                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-sm ${searchQuery === "" ? "bg-sky-600/30 text-sky-200 font-semibold border border-sky-500/40" : "text-slate-300 hover:bg-white/5 hover:text-white"}`}
              >
                <span className="flex items-center gap-2">📂 <span>All Cards</span></span>
                <span className="text-xs font-mono text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">{cards.length}</span>
              </button>

              <button
                onClick={() => setSearchQuery("is:suspended")}
                className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl transition text-sm ${searchQuery === "is:suspended" ? "bg-amber-600/30 text-amber-200 font-semibold border border-amber-500/40" : "text-amber-400/90 hover:bg-white/5 hover:text-amber-300"}`}
              >
                <span className="flex items-center gap-2">⏸️ <span>Suspended</span></span>
                <span className="text-xs font-mono text-amber-400/80 bg-amber-950/60 px-2.5 py-0.5 rounded-full">{cards.filter(c => c.suspended).length}</span>
              </button>

              <hr className="border-white/10 my-3" />

              <div className="space-y-1">
                {Object.keys(tagTreeRoot).length === 0 ? (
                  <p className="text-xs text-slate-500 px-2 italic">No tags present in deck</p>
                ) : (
                  Object.values(tagTreeRoot).map(node => (
                    <TagTreeNode key={node.fullTag} node={node} searchQuery={searchQuery} setSearchQuery={setSearchQuery} />
                  ))
                )}
              </div>
            </div>

            {/* Card Table */}
            <div className="md:col-span-3 bg-slate-900/80 border border-white/10 rounded-2xl overflow-y-auto shadow-inner">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-950/90 text-slate-300 sticky top-0 border-b border-white/10 font-mono text-xs uppercase tracking-wider">
                  <tr>
                    <th className="p-4 w-12 text-center">
                      <input 
                        type="checkbox"
                        className="w-5 h-5 accent-sky-500 rounded cursor-pointer"
                        checked={selectedCardIds.size === filteredCards.length && filteredCards.length > 0}
                        onChange={(e) => {
                          if (e.target.checked) setSelectedCardIds(new Set(filteredCards.map(c => c.id)));
                          else setSelectedCardIds(new Set());
                        }}
                      />
                    </th>
                    <th className="p-4">Front</th>
                    <th className="p-4">Back</th>
                    <th className="p-4">Tags</th>
                    <th className="p-4 w-28 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5">
                  {filteredCards.length === 0 ? (
                    <tr>
                      <td colSpan="5" className="p-8 text-center text-slate-500 text-base italic">
                        No cards match the search query.
                      </td>
                    </tr>
                  ) : (
                    filteredCards.map(c => (
                      <tr key={c.id} className={`hover:bg-white/[0.03] transition ${c.suspended ? "opacity-50 bg-amber-950/10" : ""} ${selectedCardIds.has(c.id) ? "bg-sky-950/40" : ""}`}>
                        <td className="p-4 text-center">
                          <input 
                            type="checkbox" 
                            className="w-5 h-5 accent-sky-500 rounded cursor-pointer"
                            checked={selectedCardIds.has(c.id)} 
                            onChange={() => toggleSelectCard(c.id)}
      function CardViewer({ card, isBackRevealed, mediaMap }) {
        if (!card) return null;

        // Extract and clean content with HTML entity decoding & media mapping
        const processFieldContent = (content) => {
          if (!content) return "";
          let processed = content;
          
          // Apply media src blob replacements if present
          if (mediaMap) {
            Object.keys(mediaMap).forEach(fileName => {
              const regex = new RegExp(`src=["'](.*?/)?${fileName.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&')}["']`, 'gi');
              processed = processed.replace(regex, `src="${mediaMap[fileName]}"`);
            });
          }
          return processed;
        };

        const isCloze = card.modelType === 'cloze' || card.type === 'cloze' || (card.front && card.front.includes('{{c'));
        const cardOrd = card.ord !== undefined ? card.ord : 0;

        let frontHTML = processFieldContent(card.front || "");
        let backHTML = processFieldContent(card.back || "");

        if (isCloze) {
          frontHTML = renderClozeText(frontHTML, cardOrd, false);
          backHTML = renderClozeText(backHTML || card.front, cardOrd, true);
        }

        return (
          <div className="flex flex-col h-full w-full justify-center items-center p-6 select-text overflow-y-auto">
            <div className="w-full max-w-3xl bg-slate-900/80 backdrop-blur-md rounded-2xl border border-slate-800 p-8 shadow-2xl space-y-6">
              {/* Front Side */}
              <div 
                className="prose prose-invert max-w-none text-xl sm:text-2xl font-medium text-slate-100 leading-relaxed"
                dangerouslySetInnerHTML={{ __html: frontHTML }} 
              />

              {/* Divider & Back Side */}
              {isBackRevealed && (
                <div className="pt-6 border-t border-slate-800 animate-fadeIn space-y-4">
                  <div className="text-xs uppercase tracking-widest text-emerald-400 font-semibold mb-2">Answer</div>
                  <div 
                    className="prose prose-invert max-w-none text-lg sm:text-xl text-slate-200 leading-relaxed"
                    dangerouslySetInnerHTML={{ __html: backHTML }} 
                  />
                </div>
              )}
            </div>
          </div>
        );
      }

      function createCardsFromNote(note) {
        if (!note || !note.fields) return [];
        
        const isCloze = note.modelType === 'cloze' || (note.fields[0] && note.fields[0].includes('{{c'));
        
        if (isCloze) {
          const text = note.fields.join(' ');
          const clozeMatches = [...text.matchAll(/\{\{c(\d+)::/g)];
          const ordSet = new Set(clozeMatches.map(m => parseInt(m[1], 10) - 1));
          
          if (ordSet.size === 0) ordSet.add(0); // Fallback to 1 card if no numbers found
          
          return Array.from(ordSet).map(ord => ({
            id: `${note.id}_cloze_${ord}`,
            noteId: note.id,
            deckId: note.deckId,
            ord: ord,
            modelType: 'cloze',
            front: note.fields[0] || "",
            back: note.fields[1] || "",
            tags: note.tags || [],
            interval: note.interval || 0,
            ease: note.ease || 2.5,
            dueDate: note.dueDate || Date.now(),
            state: note.state || 'new'
          }));
        }

        // Standard Front/Back Card
        return [{
          id: note.id,
          noteId: note.id,
          deckId: note.deckId,
          ord: 0,
          modelType: 'standard',
          front: note.fields[0] || "",
          back: note.fields[1] || "",
          tags: note.tags || [],
          interval: note.interval || 0,
          ease: note.ease || 2.5,
          dueDate: note.dueDate || Date.now(),
          state: note.state || 'new'
        }];
      }


      const handleRating = async (ratingType) => {
        const step = intervals[ratingType];

        await dbUpdateCard({
          ...currentCard,
          reps: (currentCard.reps || 0) + 1,
          interval: step.ivl,
          easeFactor: step.ease,
          dueDate: Date.now() + (step.ivl > 0 ? step.ivl * 86400000 : 600000)
        });

        setShowAnswer(false);
        if (currentIndex < targetCards.length - 1) {
          setCurrentIndex(currentIndex + 1);
        } else {
          onCardUpdate();
        }
      };

      return (
        <div className="max-w-4xl mx-auto h-full flex flex-col p-4 sm:p-6 justify-between gap-4">
          
          {/* Header Info */}
          <div className="flex items-center justify-between text-base text-slate-400 font-mono px-2">
            <button onClick={onBack} className="flex items-center gap-2 hover:text-white transition">
              <span>←</span>
              <span className="truncate max-w-[200px] sm:max-w-xs">{studyTarget.title}</span>
            </button>
            <span className="bg-slate-900 border border-white/10 px-3 py-1 rounded-full text-xs sm:text-sm">
              {currentIndex + 1} / {targetCards.length}
            </span>
          </div>

          {/* iPad Card Workspace */}
          <div 
            onClick={() => !showAnswer && setShowAnswer(true)}
            className="flex-1 bg-slate-900/90 border border-white/10 rounded-3xl p-6 sm:p-10 flex flex-col items-center text-left overflow-y-auto shadow-2xl relative cursor-pointer"
          >
            {/* Front Field */}
            <div 
              className="card-prose text-slate-100 w-full mb-6"
              dangerouslySetInnerHTML={{ __html: renderCardField(currentCard.fields?.[0], true, currentCard.ord, mediaMap) }} 
            />

            {/* Answer Field */}
            {showAnswer && (
              <div className="w-full border-t border-white/15 pt-8 mt-4 animate-fade-in">
                <div 
                  className="card-prose text-slate-200 w-full"
                  dangerouslySetInnerHTML={{ __html: renderCardField(currentCard.fields?.[1], false, currentCard.ord, mediaMap) }} 
                />
              </div>
            )}
          </div>

          {/* Touch Rating Bar */}
          <div className="safe-pb w-full">
            {!showAnswer ? (
              <button 
                onClick={() => setShowAnswer(true)} 
                className="w-full py-5 sm:py-6 bg-sky-600 hover:bg-sky-500 active:scale-[0.98] text-white font-extrabold text-xl rounded-2xl shadow-xl transition border border-sky-400/30 flex items-center justify-center gap-3"
              >
                <span>Show Answer</span>
                <span className="text-sm font-normal opacity-80">(Tap anywhere)</span>
              </button>
            ) : (
              <div className="grid grid-cols-4 gap-2.5 sm:gap-4">
                
                {/* Again Button */}
                <button 
                  onClick={() => handleRating("again")} 
                  className="flex flex-col items-center justify-center py-4 sm:py-5 bg-rose-950/80 hover:bg-rose-900 active:scale-95 border-2 border-rose-500/50 text-rose-200 rounded-2xl transition shadow-lg"
                >
                  <span className="text-xs sm:text-sm font-mono opacity-80 mb-0.5">{intervals.again.label}</span>
                  <span className="text-base sm:text-xl font-black">Again</span>
                </button>

                {/* Hard Button */}
                <button 
                  onClick={() => handleRating("hard")} 
                  className="flex flex-col items-center justify-center py-4 sm:py-5 bg-amber-950/80 hover:bg-amber-900 active:scale-95 border-2 border-amber-500/50 text-amber-200 rounded-2xl transition shadow-lg"
                >
                  <span className="text-xs sm:text-sm font-mono opacity-80 mb-0.5">{intervals.hard.label}</span>
                  <span className="text-base sm:text-xl font-black">Hard</span>
                </button>

                {/* Good Button */}
                <button 
                  onClick={() => handleRating("good")} 
                  className="flex flex-col items-center justify-center py-4 sm:py-5 bg-emerald-950/80 hover:bg-emerald-900 active:scale-95 border-2 border-emerald-500/50 text-emerald-200 rounded-2xl transition shadow-lg"
                >
                  <span className="text-xs sm:text-sm font-mono opacity-80 mb-0.5">{intervals.good.label}</span>
                  <span className="text-base sm:text-xl font-black">Good</span>
                </button>

                {/* Easy Button */}
                <button 
                  onClick={() => handleRating("easy")} 
                  className="flex flex-col items-center justify-center py-4 sm:py-5 bg-sky-950/80 hover:bg-sky-900 active:scale-95 border-2 border-sky-500/50 text-sky-200 rounded-2xl transition shadow-lg"
                >
                  <span className="text-xs sm:text-sm font-mono opacity-80 mb-0.5">{intervals.easy.label}</span>
                  <span className="text-base sm:text-xl font-black">Easy</span>
                </button>

              </div>
            )}
          </div>

        </div>
      );
    }

    function App() {
      const [view, setView] = useState("decks");
      const [decks, setDecks] = useState([]);
      const [cards, setCards] = useState([]);
      const [mediaMap, setMediaMap] = useState({});
      const [studyTarget, setStudyTarget] = useState(null);
      const [loading, setLoading] = useState(false);

      const loadData = async () => {
        const d = await dbGetAll("decks");
        const c = await dbGetAll("cards");
        const m = await dbGetAll("media");

        const mediaDictionary = {};
        m.forEach(item => { mediaDictionary[item.filename] = item.dataUrl; });

        setDecks(d);
        setCards(c);
        setMediaMap(mediaDictionary);
      };

      useEffect(() => { loadData(); }, []);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setLoading(true);
        try {
          if (file.name.endsWith(".apkg")) {
            await parseApkg(file);
            await loadData();
          }
        } catch (err) {
          alert("Import error: " + err.message);
        } finally {
          setLoading(false);
        }
        e.target.value = null;
      };

      return (
        <div className="flex flex-col h-full w-full relative bg-ankiBg">
          
          {/* Header Bar */}
          <header className="px-6 py-4 bg-slate-950/90 backdrop-blur-lg border-b border-white/10 flex items-center justify-between flex-shrink-0 z-20 shadow-md">
            <div className="flex items-center space-x-3">
              <span className="text-2xl sm:text-3xl">⚡</span>
              <div>
                <h1 className="text-lg font-bold tracking-tight text-slate-100">AnkiFlow</h1>
                <p className="text-xs font-mono text-slate-400">TABLET EDITION</p>
              </div>
            </div>

            <div className="flex items-center gap-3">
              <button 
                onClick={() => setView("decks")} 
                className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition ${view === "decks" ? "bg-sky-600 text-white shadow" : "bg-white/5 text-slate-300 hover:bg-white/10"}`}
              >
                Decks
              </button>
              <button 
                onClick={() => setView("browser")} 
                className={`px-5 py-2.5 rounded-xl text-sm font-semibold transition ${view === "browser" ? "bg-sky-600 text-white shadow" : "bg-white/5 text-slate-300 hover:bg-white/10"}`}
              >
                Card Browser
              </button>
            </div>
          </header>

          {/* Main Body */}
          <main className="flex-1 overflow-y-auto">
            {loading && (
              <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-4">
                <div className="w-12 h-12 rounded-full border-4 border-slate-700 border-t-sky-400 animate-spin"></div>
                <p className="text-slate-300 font-mono text-base">Extracting Media Assets & Flashcards...</p>
              </div>
            )}

            {!loading && view === "decks" && (
              <DecksScreen 
                decks={decks} 
                cards={cards} 
                onSelectDeck={(node) => {
                  setStudyTarget({
                    type: "deck",
                    title: node.displayName,
                    filterFn: (c) => node.allDeckIds.has(c.did) && !c.suspended
                  });
                  setView("study");
                }}
                onUpload={handleFileUpload}
                onExportDeck={(node) => exportDeckToApkg(node.fullName, cards.filter(c => node.allDeckIds.has(c.did)))}
                onDeleteDeck={async (node) => {
                  if (confirm(`Delete "${node.displayName}"?`)) {
                    await dbDeleteDeck(node.deckId, node.fullName, decks);
                    loadData();
                  }
                }}
              />
            )}

            {!loading && view === "browser" && (
              <BrowserScreen cards={cards} decks={decks} onCardUpdate={loadData} />
            )}

            {!loading && view === "study" && studyTarget && (
              <StudyScreen studyTarget={studyTarget} allCards={cards} mediaMap={mediaMap} onCardUpdate={loadData} onBack={() => setView("decks")} />
            )}
          </main>
        </div>
      );
    }

    function DeckTreeNode({ node, onSelectDeck, onExportDeck, onDeleteDeck, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(true);
      const childNodes = Object.values(node.children);

      return (
        <div className="flex flex-col select-none">
          <div 
            onClick={() => onSelectDeck(node)}
            className="group flex items-center justify-between p-5 my-1.5 bg-slate-900/80 hover:bg-slate-800/80 border border-white/10 hover:border-sky-500/40 rounded-2xl cursor-pointer transition active:scale-[0.99] shadow-sm"
            style={{ marginLeft: `${depth * 24}px` }}
          >
            <div className="flex items-center space-x-4 flex-1 min-w-0 pr-4">
              {childNodes.length > 0 ? (
                <button onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }} className="w-8 h-8 flex items-center justify-center rounded-xl bg-white/10 text-slate-300 text-sm">
                  {isOpen ? "▼" : "▶"}
                </button>
              ) : (
                <span className="w-8 h-8 flex items-center justify-center text-slate-500 text-lg">🗂</span>
              )}
              <span className="font-bold text-slate-100 text-base sm:text-lg truncate group-hover:text-sky-300 transition">{node.displayName}</span>
            </div>

            <div className="flex items-center space-x-3 flex-shrink-0 text-xs sm:text-sm font-mono font-bold">
              <span className="text-sky-400 bg-sky-950/60 border border-sky-500/30 px-3 py-1.5 rounded-xl">{node.newCount}</span>
              <span className="text-rose-400 bg-rose-950/60 border border-rose-500/30 px-3 py-1.5 rounded-xl">{node.learningCount}</span>
              <span className="text-emerald-400 bg-emerald-950/60 border border-emerald-500/30 px-3 py-1.5 rounded-xl">{node.reviewCount}</span>
              <button onClick={(e) => { e.stopPropagation(); onExportDeck(node); }} title="Export .apkg" className="p-2 text-slate-400 hover:text-sky-400 text-lg ml-1">💾</button>
              <button onClick={(e) => { e.stopPropagation(); onDeleteDeck(node); }} title="Delete" className="p-2 text-slate-500 hover:text-rose-400 text-lg">✕</button>
            </div>
          </div>

          {childNodes.length > 0 && isOpen && (
            <div className="flex flex-col border-l border-white/10 ml-5 pl-1">
              {childNodes.map(child => (
                <DeckTreeNode key={child.fullName} node={child} onSelectDeck={onSelectDeck} onExportDeck={onExportDeck} onDeleteDeck={onDeleteDeck} depth={depth + 1} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function DecksScreen({ decks, cards, onSelectDeck, onUpload, onExportDeck, onDeleteDeck }) {
      const rootNodes = Object.values(useMemo(() => buildCleanDeckTree(decks, cards), [decks, cards]));

      return (
        <div className="max-w-5xl mx-auto p-4 sm:p-8 space-y-6 pb-24">
          <div className="border-2 border-dashed border-white/20 bg-slate-900/50 hover:border-sky-500/60 rounded-3xl p-8 text-center cursor-pointer transition">
            <input type="file" accept=".apkg" onChange={onUpload} id="file-input" className="hidden" />
            <label htmlFor="file-input" className="cursor-pointer space-y-3 block">
              <span className="text-4xl block">📥</span>
              <p className="font-bold text-base sm:text-lg text-slate-100">Import Anki Package (.apkg)</p>
              <p className="text-xs sm:text-sm text-slate-400">Supports embedded images, cloze deletions, and nested deck paths</p>
            </label>
          </div>

          <div className="space-y-3">
            <h2 className="text-xs font-bold text-slate-400 uppercase tracking-wider px-1 mb-2 font-mono">Decks Overview</h2>
            {rootNodes.map(node => (
              <DeckTreeNode key={node.fullName} node={node} onSelectDeck={onSelectDeck} onExportDeck={onExportDeck} onDeleteDeck={onDeleteDeck} />
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
