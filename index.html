<body class="h-screen w-screen flex flex-col relative text-base">
  <div id="root" class="h-full w-full flex flex-col relative z-10"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    const DB_NAME = "AnkiLiteDB";
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains("decks")) db.createObjectStore("decks", { keyPath: "id" });
          if (!db.objectStoreNames.contains("cards")) {
            const cardStore = db.createObjectStore("cards", { keyPath: "id" });
            cardStore.createIndex("did", "did", { unique: false });
          }
          if (!db.objectStoreNames.contains("media")) db.createObjectStore("media", { keyPath: "name" });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbPutBatch(storeName, items) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readwrite");
        const store = tx.objectStore(storeName);
        items.forEach(item => store.put(item));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbGetAll(storeName) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(storeName, "readonly");
        const store = tx.objectStore(storeName);
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function dbUpdateCard(card) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction("cards", "readwrite");
        const store = tx.objectStore("cards");
        store.put(card);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function dbDeleteDeck(deckId, deckName, allDecks) {
      const prefix = deckName + "::";
      const matchingDeckIds = allDecks
        .filter(d => d.id === deckId || d.name === deckName || d.name.startsWith(prefix))
        .map(d => d.id);

      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(["decks", "cards"], "readwrite");
        const deckStore = tx.objectStore("decks");
        const cardStore = tx.objectStore("cards");

        matchingDeckIds.forEach(id => deckStore.delete(id));
        const req = cardStore.openCursor();
        req.onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) {
            if (matchingDeckIds.includes(cursor.value.did)) cursor.delete();
            cursor.continue();
          }
        };
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function exportDeckToApkg(deckName, cards) {
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const db = new SQL.Database();

      db.run(`
        CREATE TABLE col (
          id INTEGER PRIMARY KEY, crt INTEGER NOT NULL, mod INTEGER NOT NULL, scm INTEGER NOT NULL,
          ver INTEGER NOT NULL, dcount INTEGER NOT NULL, empty INTEGER NOT NULL, ls INTEGER NOT NULL,
          conf TEXT NOT NULL, models TEXT NOT NULL, decks TEXT NOT NULL, dconf TEXT NOT NULL, tags TEXT NOT NULL
        );
        CREATE TABLE notes (
          id INTEGER PRIMARY KEY, guid TEXT NOT NULL, mid INTEGER NOT NULL, mod INTEGER NOT NULL,
          usn INTEGER NOT NULL, tags TEXT NOT NULL, flds TEXT NOT NULL, sfld INTEGER NOT NULL,
          csum INTEGER NOT NULL, flags INTEGER NOT NULL, data TEXT NOT NULL
        );
        CREATE TABLE cards (
          id INTEGER PRIMARY KEY, nid INTEGER NOT NULL, did INTEGER NOT NULL, ord INTEGER NOT NULL,
          mod INTEGER NOT NULL, usn INTEGER NOT NULL, type INTEGER NOT NULL, queue INTEGER NOT NULL,
          due INTEGER NOT NULL, ivl INTEGER NOT NULL, factor INTEGER NOT NULL, reps INTEGER NOT NULL,
          lapses INTEGER NOT NULL, left INTEGER NOT NULL, odue INTEGER NOT NULL, odid INTEGER NOT NULL,
          flags INTEGER NOT NULL, data TEXT NOT NULL
        );
      `);

      const now = Math.floor(Date.now() / 1000);
      const deckId = Date.now();
      const modelId = deckId + 1;

      const modelsJson = {};
      modelsJson[modelId] = {
        id: modelId,
        name: "Basic-AnkiFlow",
        flds: [{ name: "Front" }, { name: "Back" }],
        tmpls: [{ name: "Card 1", qfmt: "{{Front}}", afmt: "{{FrontSide}}<hr id=answer>{{Back}}" }]
      };

      const decksJson = { "1": { id: 1, name: "Default" } };
      decksJson[deckId] = { id: deckId, name: deckName };

      db.run("INSERT INTO col VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", [
        1, now, now * 1000, now * 1000, 11, 0, 0, 0, "{}", JSON.stringify(modelsJson), JSON.stringify(decksJson), "{}", "{}"
      ]);

      cards.forEach((c, idx) => {
        const nid = deckId + 10 + idx;
        const cid = deckId + 1000 + idx;
        const fldsStr = (c.fields || []).join("\x1f");
        const tagStr = (c.tags || []).join(" ");

        db.run("INSERT INTO notes VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", [
          nid, "guid" + nid, modelId, now, -1, ` ${tagStr} `, fldsStr, 0, 0, 0, ""
        ]);

        db.run("INSERT INTO cards VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?)", [
          cid, nid, deckId, c.ord || 0, now, -1, c.suspended ? -1 : (c.reps > 0 ? 2 : 0), c.suspended ? -1 : (c.reps > 0 ? 2 : 0), c.dueDate || now, c.interval || 0, Math.round((c.easeFactor || 2.5) * 1000), c.reps || 0, 0, 0, 0, 0, 0, ""
        ]);
      });

      const binaryArray = db.export();
      const zip = new JSZip();
      zip.file("collection.anki2", binaryArray);
      zip.file("media", "{}");

      const blob = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${deckName.replace(/::/g, "_")}.apkg`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function parseApkg(file) {
      const zip = await JSZip.loadAsync(file);
      let dbFile = zip.file("collection.anki21") || zip.file("collection.anki2");
      if (!dbFile) throw new Error("Missing SQLite deck file in .apkg archive.");

      const dbBuffer = await dbFile.async("uint8array");
      const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}` });
      const db = new SQL.Database(dbBuffer);

      const colRes = db.exec("SELECT decks, models FROM col");
      const decksJson = JSON.parse(colRes[0].values[0][0]);
      const modelsJson = JSON.parse(colRes[0].values[0][1]);

      const decks = [];
      for (const [id, d] of Object.entries(decksJson)) {
        if (d.name && d.name !== "Default") {
          const normalizedName = d.name.replace(/[\x1f\u001f]/g, "::").trim();
          decks.push({ id: String(d.id), name: normalizedName });
        }
      }

      const notesRes = db.exec("SELECT id, mid, flds, tags FROM notes");
      const notesMap = new Map();
      if (notesRes.length > 0) {
        notesRes[0].values.forEach(row => {
          const [id, mid, flds, tags] = row;
          const fields = flds.split("\x1f");
          const tagList = tags ? tags.trim().split(/\s+/).filter(Boolean) : [];
          notesMap.set(id, { id, fields, tags: tagList });
        });
      }

      const cardsRes = db.exec("SELECT id, nid, did, ord, queue, factor, reps, ivl, due FROM cards");
      const cards = [];
      if (cardsRes.length > 0) {
        cardsRes[0].values.forEach(row => {
          const [id, nid, did, ord, queue, factor, reps, ivl, due] = row;
          const note = notesMap.get(nid);
          if (note) {
            cards.push({
              id: String(id),
              nid: String(nid),
              did: String(did),
              ord,
              fields: note.fields,
              tags: note.tags,
              suspended: queue === -1,
              interval: ivl || 0,
              easeFactor: (factor || 2500) / 1000,
              reps: reps || 0,
              dueDate: due || Date.now()
            });
          }
        });
      }

      db.close();
      if (decks.length === 0) decks.push({ id: "1", name: file.name.replace(".apkg", "") });
      await dbPutBatch("decks", decks);
      await dbPutBatch("cards", cards);
    }

    function renderCardField(html, isFront = true, clozeOrd = 0) {
      if (!html) return "";
      let processed = html;
      const clozeRegex = /\{\{c(\d+)::([^:}]+)(?:::([^}]+))?\}\}/g;
      processed = processed.replace(clozeRegex, (match, num, text, hint) => {
        const isCurrentCloze = parseInt(num) === (clozeOrd + 1);
        if (isFront) {
          return isCurrentCloze ? `<span class="cloze-bracket">[${hint || "..."}]</span>` : text;
        } else {
          return isCurrentCloze ? `<span class="cloze-reveal">${text}</span>` : text;
        }
      });
      return processed;
    }

    function buildCleanDeckTree(decks, cards) {
      const root = { children: {} };
      decks.forEach(d => {
        const parts = d.name.split("::").map(p => p.trim()).filter(Boolean);
        let current = root;
        parts.forEach((part, idx) => {
          if (!current.children[part]) {
            current.children[part] = {
              displayName: part,
              fullName: parts.slice(0, idx + 1).join("::"),
              deckId: idx === parts.length - 1 ? d.id : null,
              children: {},
              allDeckIds: new Set()
            };
          }
          if (idx === parts.length - 1) current.children[part].deckId = d.id;
          current = current.children[part];
        });
      });

      function populateStats(node) {
        const childNodes = Object.values(node.children);
        let directCards = [];
        let descendantDeckIds = new Set();

        if (node.deckId) {
          descendantDeckIds.add(node.deckId);
          directCards = cards.filter(c => c.did === node.deckId);
        }

        let allNodeCards = [...directCards];
        childNodes.forEach(child => {
          populateStats(child);
          child.allDeckIds.forEach(id => descendantDeckIds.add(id));
          allNodeCards = allNodeCards.concat(cards.filter(c => child.allDeckIds.has(c.did)));
        });

        const uniqueCardsMap = new Map();
        allNodeCards.forEach(c => uniqueCardsMap.set(c.id, c));
        const uniqueCards = Array.from(uniqueCardsMap.values());

        node.newCount = uniqueCards.filter(c => !c.suspended && c.reps === 0).length;
        node.learningCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval < 1).length;
        node.reviewCount = uniqueCards.filter(c => !c.suspended && c.reps > 0 && c.interval >= 1).length;
        node.allDeckIds = descendantDeckIds;
      }

      Object.values(root.children).forEach(populateStats);
      return root.children;
    }

    // Helper to build recursive tag hierarchy tree from 'parent::child' tags
    function buildTagTree(cards) {
      const root = { children: {}, count: 0 };

      cards.forEach(card => {
        const tags = card.tags || [];
        tags.forEach(fullTag => {
          const parts = fullTag.split("::").map(p => p.trim()).filter(Boolean);
          let current = root;
          let cumulativePath = "";

          parts.forEach((part, idx) => {
            cumulativePath = idx === 0 ? part : `${cumulativePath}::${part}`;
            if (!current.children[part]) {
              current.children[part] = {
                name: part,
                fullTag: cumulativePath,
                children: {},
                count: 0
              };
            }
            current = current.children[part];
            current.count++;
          });
        });
      });

      return root.children;
    }

    // Recursive Tag Item UI component (Desktop Anki style)
    function TagTreeNode({ node, searchQuery, setSearchQuery, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(false);
      const childNodes = Object.values(node.children);
      const isSelected = searchQuery === `tag:${node.fullTag}`;

      const toggleOpen = (e) => {
        e.stopPropagation();
        setIsOpen(!isOpen);
      };

      return (
        <div className="flex flex-col select-none">
          <div 
            onClick={() => setSearchQuery(`tag:${node.fullTag}`)}
            className={`group flex items-center justify-between py-1 px-2 rounded-lg cursor-pointer transition text-xs font-sans ${isSelected ? "bg-sky-600/30 text-sky-200 font-semibold border border-sky-500/40" : "text-slate-300 hover:bg-white/5 hover:text-white"}`}
            style={{ paddingLeft: `${depth * 14 + 8}px` }}
          >
            <div className="flex items-center space-x-1.5 truncate">
              {childNodes.length > 0 ? (
                <button 
                  onClick={toggleOpen} 
                  className="w-4 h-4 flex items-center justify-center text-[10px] text-slate-400 hover:text-white"
                >
                  {isOpen ? "◢" : "▶"}
                </button>
              ) : (
                <span className="w-4 h-4 flex items-center justify-center text-[11px] text-slate-500">🏷️</span>
              )}
              <span className="truncate">{node.name}</span>
            </div>

            <span className="text-[10px] font-mono text-slate-400 bg-slate-800/80 px-1.5 py-0.2 rounded-full ml-2 flex-shrink-0">
              {node.count}
            </span>
          </div>

          {childNodes.length > 0 && isOpen && (
            <div className="flex flex-col border-l border-white/10 ml-3">
              {childNodes.map(child => (
                <TagTreeNode 
                  key={child.fullTag} 
                  node={child} 
                  searchQuery={searchQuery} 
                  setSearchQuery={setSearchQuery} 
                  depth={depth + 1} 
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // --- CARD BROWSER COMPONENT WITH DESKTOP TAG SIDEBAR ---
    function BrowserScreen({ cards, decks, onCardUpdate }) {
      const [searchQuery, setSearchQuery] = useState("");
      const [selectedCardIds, setSelectedCardIds] = useState(new Set());

      const tagTreeRoot = useMemo(() => buildTagTree(cards), [cards]);

      const filteredCards = useMemo(() => {
        if (!searchQuery.trim()) return cards;
        const q = searchQuery.trim().toLowerCase();

        if (q.startsWith("tag:")) {
          const targetTag = q.slice(4).trim();
          return cards.filter(c => (c.tags || []).some(t => t.toLowerCase() === targetTag || t.toLowerCase().startsWith(targetTag + "::")));
        }
        if (q.startsWith("-tag:")) {
          const targetTag = q.slice(5).trim();
          return cards.filter(c => !(c.tags || []).some(t => t.toLowerCase() === targetTag || t.toLowerCase().startsWith(targetTag + "::")));
        }
        if (q === "is:suspended") {
          return cards.filter(c => c.suspended);
        }

        return cards.filter(c => 
          (c.fields?.[0] || "").toLowerCase().includes(q) ||
          (c.fields?.[1] || "").toLowerCase().includes(q) ||
          (c.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }, [cards, searchQuery]);

      const toggleSelectCard = (id) => {
        const next = new Set(selectedCardIds);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        setSelectedCardIds(next);
      };

      const toggleSuspendCards = async (targetCards, suspendState) => {
        const updated = targetCards.map(c => ({ ...c, suspended: suspendState }));
        await dbPutBatch("cards", updated);
        onCardUpdate();
      };

      const suspendUnselectedInQuery = async () => {
        const selectedSet = selectedCardIds.size > 0 ? selectedCardIds : new Set(filteredCards.map(c => c.id));
        const updated = cards.map(c => {
          if (!selectedSet.has(c.id)) {
            return { ...c, suspended: true };
          }
          return c;
        });
        await dbPutBatch("cards", updated);
        onCardUpdate();
      };

      return (
        <div className="flex flex-col h-full max-w-7xl mx-auto p-4 md:p-6 gap-5">
          {/* Top Search Toolbar */}
          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900/90 p-3.5 rounded-2xl border border-white/10 shadow-lg">
            <div className="flex items-center gap-3 flex-1 min-w-[280px]">
              <span className="text-slate-400 text-base ml-1">🔍</span>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search fields or tag:medical, -tag:verb, is:suspended..."
                className="w-full bg-slate-950 border border-white/15 rounded-xl px-4 py-2 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 transition"
              />
            </div>

            <div className="flex items-center gap-2.5 text-xs font-semibold">
              <button
                onClick={() => {
                  const targetCards = selectedCardIds.size > 0 
                    ? cards.filter(c => selectedCardIds.has(c.id)) 
                    : filteredCards;
                  toggleSuspendCards(targetCards, true);
                }}
                className="px-3.5 py-2 bg-amber-950/70 hover:bg-amber-900/90 border border-amber-500/40 text-amber-300 rounded-xl transition active:scale-95 shadow"
              >
                Suspend Selected
              </button>

              <button
                onClick={() => {
                  const targetCards = selectedCardIds.size > 0 
                    ? cards.filter(c => selectedCardIds.has(c.id)) 
                    : filteredCards;
                  toggleSuspendCards(targetCards, false);
                }}
                className="px-3.5 py-2 bg-emerald-950/70 hover:bg-emerald-900/90 border border-emerald-500/40 text-emerald-300 rounded-xl transition active:scale-95 shadow"
              >
                Unsuspend Selected
              </button>

              <button
                onClick={suspendUnselectedInQuery}
                title="Suspend all cards EXCEPT the current query/selection"
                className="px-3.5 py-2 bg-rose-950/70 hover:bg-rose-900/90 border border-rose-500/40 text-rose-300 rounded-xl transition active:scale-95 shadow"
              >
                Suspend Others
              </button>
            </div>
          </div>

          {/* Browser Workspace */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-5 flex-1 overflow-hidden">
            
            {/* Anki Desktop Style Tag Tree Sidebar */}
            <div className="bg-slate-900/80 border border-white/10 rounded-2xl p-3 overflow-y-auto space-y-1 text-sm">
              <div className="font-bold text-slate-400 mb-2 px-2 text-[11px] uppercase tracking-wider font-mono flex items-center justify-between">
                <span>Tag Hierarchy</span>
                <span className="text-[10px] text-slate-500">Anki Tree</span>
              </div>
              
              <button
                onClick={() => setSearchQuery("")}
                className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg transition text-xs ${searchQuery === "" ? "bg-sky-600/30 text-sky-200 font-semibold border border-sky-500/40" : "text-slate-300 hover:bg-white/5 hover:text-white"}`}
              >
                <span className="flex items-center gap-2">📂 <span>All Cards</span></span>
                <span className="text-[10px] font-mono text-slate-400 bg-slate-800/80 px-2 py-0.5 rounded-full">{cards.length}</span>
              </button>

              <button
                onClick={() => setSearchQuery("is:suspended")}
                className={`w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg transition text-xs ${searchQuery === "is:suspended" ? "bg-amber-600/30 text-amber-200 font-semibold border border-amber-500/40" : "text-amber-400/90 hover:bg-white/5 hover:text-amber-300"}`}
              >
                <span className="flex items-center gap-2">⏸️ <span>Suspended</span></span>
                <span className="text-[10px] font-mono text-amber-400/80 bg-amber-950/60 px-2 py-0.5 rounded-full">{cards.filter(c => c.suspended).length}</span>
              </button>

              <hr className="border-white/10 my-2" />

              <div className="space-y-0.5">
                {Object.keys(tagTreeRoot).length === 0 ? (
                  <p className="text-xs text-slate-500 px-2 italic">No tags present in cards</p>
                ) : (
                  Object.values(tagTreeRoot).map(node => (
                    <TagTreeNode 
                      key={node.fullTag} 
                      node={node} 
                      searchQuery={searchQuery} 
                      setSearchQuery={setSearchQuery} 
                    />
                  ))
                )}
              </div>
            </div>

            {/* Main Table View */}
            <div className="md:col-span-3 bg-slate-900/80 border border-white/10 rounded-2xl overflow-y-auto shadow-inner">
              <table className="w-full text-left text-sm border-collapse">
                <thead className="bg-slate-950/90 text-slate-300 sticky top-0 border-b border-white/10 font-mono text-xs uppercase tracking-wider">
                  <tr>
                    <th className="p-3.5 w-10 text-center">
                      <input 
                        type="checkbox"
                        className="w-4 h-4 accent-sky-500 rounded cursor-pointer"
                        checked={selectedCardIds.size === filteredCards.length && filteredCards.length > 0}
                        onChange={(e) => {
                          if (e.target.checked) setSelectedCardIds(new Set(filteredCards.map(c => c.id)));
                          else setSelectedCardIds(new Set());
                        }}
                      />
                    </th>
                    <th className="p-3.5">Front</th>
                    <th className="p-3.5">Back</th>
                    <th className="p-3.5">Tags</th>
                    <th className="p-3.5 w-24 text-center">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-white/5">
                  {filteredCards.length === 0 ? (
                    <tr>
                      <td colSpan="5" className="p-8 text-center text-slate-500 text-sm italic">
                        No cards match the search query.
                      </td>
                    </tr>
                  ) : (
                    filteredCards.map(c => (
                      <tr 
                        key={c.id} 
                        className={`hover:bg-white/[0.03] transition ${c.suspended ? "opacity-50 bg-amber-950/10" : ""} ${selectedCardIds.has(c.id) ? "bg-sky-950/40" : ""}`}
                      >
                        <td className="p-3.5 text-center">
                          <input 
                            type="checkbox" 
                            className="w-4 h-4 accent-sky-500 rounded cursor-pointer"
                            checked={selectedCardIds.has(c.id)} 
                            onChange={() => toggleSelectCard(c.id)}
                          />
                        </td>
                        <td className="p-3.5 truncate max-w-[200px] text-slate-100 font-medium" dangerouslySetInnerHTML={{ __html: c.fields?.[0] || "" }} />
                        <td className="p-3.5 truncate max-w-[200px] text-slate-300" dangerouslySetInnerHTML={{ __html: c.fields?.[1] || "" }} />
                        <td className="p-3.5 text-slate-300">
                          {(c.tags || []).map(t => (
                            <span key={t} className="inline-block bg-slate-800 border border-white/10 text-slate-200 text-xs px-2 py-0.5 rounded-md mr-1.5 my-0.5 font-mono">
                              {t}
                            </span>
                          ))}
                        </td>
                        <td className="p-3.5 text-center font-mono text-xs">
                          {c.suspended ? (
                            <span className="text-amber-400 bg-amber-950/70 px-2 py-1 rounded-md border border-amber-500/30 font-semibold">Suspended</span>
                          ) : (
                            <span className="text-emerald-400 bg-emerald-950/70 px-2 py-1 rounded-md border border-emerald-500/30 font-semibold">Active</span>
                          )}
                        </td>
                      </tr>
                    ))
                  )}
                </tbody>
              </table>
            </div>

          </div>
        </div>
      );
    }

    // --- STUDY SCREEN COMPONENT ---
    function StudyScreen({ studyTarget, allCards, onCardUpdate, onBack }) {
      const targetCards = useMemo(() => allCards.filter(studyTarget.filterFn), [allCards, studyTarget]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [showAnswer, setShowAnswer] = useState(false);

      const currentCard = targetCards[currentIndex];

      if (!currentCard) {
        return (
          <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-4">
            <span className="text-5xl">🎉</span>
            <h2 className="text-xl font-bold text-slate-100">Deck Complete!</h2>
            <p className="text-slate-400 text-sm max-w-sm">You've reviewed all available cards for this target session.</p>
            <button onClick={onBack} className="px-5 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl text-sm font-semibold shadow">
              Return to Decks
            </button>
          </div>
        );
      }

      const handleRating = async (rating) => {
        let newInterval = currentCard.interval || 0;
        let newEase = currentCard.easeFactor || 2.5;

        if (rating === 1) { newInterval = 0; newEase = Math.max(1.3, newEase - 0.2); }
        else if (rating === 2) { newInterval = newInterval === 0 ? 1 : newInterval * 1.2; }
        else if (rating === 3) { newInterval = newInterval === 0 ? 1 : newInterval * newEase; }
        else if (rating === 4) { newInterval = newInterval === 0 ? 4 : newInterval * newEase * 1.3; newEase += 0.15; }

        await dbUpdateCard({
          ...currentCard,
          reps: (currentCard.reps || 0) + 1,
          interval: Math.round(newInterval),
          easeFactor: newEase,
          dueDate: Date.now() + Math.round(newInterval) * 86400000
        });

        setShowAnswer(false);
        if (currentIndex < targetCards.length - 1) setCurrentIndex(currentIndex + 1);
        else onCardUpdate();
      };

      return (
        <div className="max-w-3xl mx-auto h-full flex flex-col p-4 sm:p-6 justify-between">
          <div className="flex items-center justify-between text-sm text-slate-400 mb-4 font-mono">
            <span>{studyTarget.title}</span>
            <span>{currentIndex + 1} / {targetCards.length}</span>
          </div>

          <div className="flex-1 panel-card rounded-2xl p-8 flex flex-col justify-center items-center text-center overflow-y-auto mb-6 shadow-2xl">
            <div className="card-content text-slate-100 text-lg sm:text-xl leading-relaxed w-full font-normal" dangerouslySetInnerHTML={{ __html: renderCardField(currentCard.fields?.[0], true, currentCard.ord) }} />
            {showAnswer && (
              <>
                <hr className="w-full border-white/10 my-8" />
                <div className="card-content text-slate-200 text-base sm:text-lg leading-relaxed w-full" dangerouslySetInnerHTML={{ __html: renderCardField(currentCard.fields?.[1], false, currentCard.ord) }} />
              </>
            )}
          </div>

          <div className="safe-bottom-margin">
            {!showAnswer ? (
              <button onClick={() => setShowAnswer(true)} className="w-full py-3.5 bg-sky-600 hover:bg-sky-500 active:scale-[0.99] text-white font-semibold text-sm rounded-xl shadow-lg transition">
                Show Answer
              </button>
            ) : (
              <div className="grid grid-cols-4 gap-3">
                <button onClick={() => handleRating(1)} className="py-3 bg-rose-950/70 hover:bg-rose-900 border border-rose-500/40 text-rose-300 rounded-xl text-sm font-bold">Again</button>
                <button onClick={() => handleRating(2)} className="py-3 bg-amber-950/70 hover:bg-amber-900 border border-amber-500/40 text-amber-300 rounded-xl text-sm font-bold">Hard</button>
                <button onClick={() => handleRating(3)} className="py-3 bg-emerald-950/70 hover:bg-emerald-900 border border-emerald-500/40 text-emerald-300 rounded-xl text-sm font-bold">Good</button>
                <button onClick={() => handleRating(4)} className="py-3 bg-sky-950/70 hover:bg-sky-900 border border-sky-500/40 text-sky-300 rounded-xl text-sm font-bold">Easy</button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [view, setView] = useState("decks");
      const [decks, setDecks] = useState([]);
      const [cards, setCards] = useState([]);
      const [studyTarget, setStudyTarget] = useState(null);
      const [loading, setLoading] = useState(false);

      const loadData = async () => {
        const d = await dbGetAll("decks");
        const c = await dbGetAll("cards");
        setDecks(d);
        setCards(c);
      };

      useEffect(() => { loadData(); }, []);

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        setLoading(true);
        try {
          if (file.name.endsWith(".apkg")) {
            await parseApkg(file);
            await loadData();
          }
        } catch (err) {
          alert("Import error: " + err.message);
        } finally {
          setLoading(false);
        }
        e.target.value = null;
      };

      return (
        <div className="flex flex-col h-full w-full relative">
          <header className="px-6 py-4 bg-slate-950/90 backdrop-blur-md border-b border-white/10 flex items-center justify-between flex-shrink-0 z-20">
            <div className="flex items-center space-x-3">
              <span className="text-2xl">⚡</span>
              <div>
                <h1 className="text-base font-bold tracking-tight text-slate-100">AnkiFlow</h1>
                <p className="text-xs font-mono text-slate-400">{view.toUpperCase()} VIEW</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button 
                onClick={() => setView("decks")} 
                className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${view === "decks" ? "bg-sky-600 text-white shadow" : "bg-white/5 text-slate-300 hover:bg-white/10"}`}
              >
                Decks
              </button>
              <button 
                onClick={() => setView("browser")} 
                className={`px-4 py-2 rounded-xl text-xs font-semibold transition ${view === "browser" ? "bg-sky-600 text-white shadow" : "bg-white/5 text-slate-300 hover:bg-white/10"}`}
              >
                Card Browser
              </button>
            </div>
          </header>

          <main className="flex-1 overflow-y-auto">
            {loading && (
              <div className="flex flex-col items-center justify-center h-full p-8 text-center space-y-4">
                <div className="w-10 h-10 rounded-full border-2 border-slate-600 border-t-sky-400 animate-spin"></div>
                <p className="text-slate-400 font-mono text-sm">Processing Package...</p>
              </div>
            )}

            {!loading && view === "decks" && (
              <DecksScreen 
                decks={decks} 
                cards={cards} 
                onSelectDeck={(node) => {
                  setStudyTarget({
                    type: "deck",
                    title: node.displayName,
                    filterFn: (c) => node.allDeckIds.has(c.did) && !c.suspended
                  });
                  setView("study");
                }}
                onUpload={handleFileUpload}
                onExportDeck={(node) => exportDeckToApkg(node.fullName, cards.filter(c => node.allDeckIds.has(c.did)))}
                onDeleteDeck={async (node) => {
                  if (confirm(`Delete "${node.displayName}"?`)) {
                    await dbDeleteDeck(node.deckId, node.fullName, decks);
                    loadData();
                  }
                }}
              />
            )}

            {!loading && view === "browser" && (
              <BrowserScreen cards={cards} decks={decks} onCardUpdate={loadData} />
            )}

            {!loading && view === "study" && studyTarget && (
              <StudyScreen studyTarget={studyTarget} allCards={cards} onCardUpdate={loadData} onBack={() => setView("decks")} />
            )}
          </main>
        </div>
      );
    }

    function DeckTreeNode({ node, onSelectDeck, onExportDeck, onDeleteDeck, depth = 0 }) {
      const [isOpen, setIsOpen] = useState(true);
      const childNodes = Object.values(node.children);

      return (
        <div className="flex flex-col select-none">
          <div 
            onClick={() => onSelectDeck(node)}
            className="group flex items-center justify-between p-4 my-1 panel-card hover:border-slate-500 rounded-2xl cursor-pointer transition active:scale-[0.995]"
            style={{ marginLeft: `${depth * 20}px` }}
          >
            <div className="flex items-center space-x-3 flex-1 min-w-0 pr-3">
              {childNodes.length > 0 ? (
                <button onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }} className="w-7 h-7 flex items-center justify-center rounded-lg bg-white/5 text-slate-400 text-xs">
                  {isOpen ? "▼" : "▶"}
                </button>
              ) : (
                <span className="w-7 h-7 flex items-center justify-center text-slate-500 text-sm">🗂</span>
              )}
              <span className="font-semibold text-slate-100 text-sm truncate group-hover:text-sky-300 transition">{node.displayName}</span>
            </div>

            <div className="flex items-center space-x-2.5 flex-shrink-0 text-xs font-mono font-bold">
              <span className="text-sky-400 bg-sky-950/50 border border-sky-500/30 px-2.5 py-1 rounded-lg">{node.newCount}</span>
              <span className="text-rose-400 bg-rose-950/50 border border-rose-500/30 px-2.5 py-1 rounded-lg">{node.learningCount}</span>
              <span className="text-emerald-400 bg-emerald-950/50 border border-emerald-500/30 px-2.5 py-1 rounded-lg">{node.reviewCount}</span>
              <button onClick={(e) => { e.stopPropagation(); onExportDeck(node); }} title="Export .apkg" className="p-1.5 text-slate-400 hover:text-sky-400 text-sm ml-1">💾</button>
              <button onClick={(e) => { e.stopPropagation(); onDeleteDeck(node); }} title="Delete" className="p-1.5 text-slate-500 hover:text-rose-400 text-sm">✕</button>
            </div>
          </div>

          {childNodes.length > 0 && isOpen && (
            <div className="flex flex-col border-l border-white/10 ml-4 pl-1">
              {childNodes.map(child => (
                <DeckTreeNode key={child.fullName} node={child} onSelectDeck={onSelectDeck} onExportDeck={onExportDeck} onDeleteDeck={onDeleteDeck} depth={depth + 1} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function DecksScreen({ decks, cards, onSelectDeck, onUpload, onExportDeck, onDeleteDeck }) {
      const rootNodes = Object.values(useMemo(() => buildCleanDeckTree(decks, cards), [decks, cards]));

      return (
        <div className="max-w-4xl mx-auto p-4 sm:p-6 space-y-6 pb-20">
          <div className="border border-dashed border-white/20 bg-white/[0.02] hover:border-sky-500/50 rounded-2xl p-6 text-center cursor-pointer transition">
            <input type="file" accept=".apkg" onChange={onUpload} id="file-input" className="hidden" />
            <label htmlFor="file-input" className="cursor-pointer space-y-2 block">
              <span className="text-2xl block">📥</span>
              <p className="font-semibold text-sm text-slate-100">Import Anki Package (.apkg)</p>
            </label>
          </div>

          <div className="space-y-2">
            <h2 className="text-xs font-semibold text-slate-400 uppercase tracking-wider px-1 mb-2 font-mono">Decks</h2>
            {rootNodes.map(node => (
              <DeckTreeNode key={node.fullName} node={node} onSelectDeck={onSelectDeck} onExportDeck={onExportDeck} onDeleteDeck={onDeleteDeck} />
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
