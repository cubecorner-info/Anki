<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AnkiFlow Tablet Edition</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
            again: '#ef4444',
            hard: '#f59e0b',
            good: '#10b981',
            easy: '#06b6d4'
          }
        }
      }
    }
  </script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- JSZip -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <!-- sql.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

  <style>
    /* Custom Scrollbar for sleek dark design */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #111827; }
    ::-webkit-scrollbar-thumb { background: #374151; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #4b5563; }
    
    /* Media responsiveness inside cards */
    .card-content img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 1rem auto;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
      display: block;
    }
    .card-content audio {
      width: 100%;
      margin: 0.75rem 0;
    }
    
    /* Cloze Styling */
    .cloze-placeholder {
      color: #38bdf8;
      font-weight: 700;
      background-color: rgba(56, 189, 248, 0.15);
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      border: 1px dashed #0284c7;
    }
    .cloze-revealed {
      color: #4ade80;
      font-weight: 700;
      background-color: rgba(74, 222, 128, 0.15);
      padding: 0.1rem 0.4rem;
      border-radius: 0.25rem;
      border: 1px solid #16a34a;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased h-screen overflow-hidden select-none">
  <div id="root" class="h-full w-full"></div>

  <script type="text/babel">
    // --- INDEXEDDB MEDIA CACHE UTILITY ---
    const DB_NAME = 'AnkiFlowMediaDB';
    const STORE_NAME = 'media';

    const initDB = () => {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    };

    const saveMediaToDB = async (filename, blob) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(blob, filename.toLowerCase());
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    const getMediaFromDB = async (filename) => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).get(filename.toLowerCase());
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    };

    const clearMediaDB = async () => {
      const db = await initDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).clear();
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    };

    // --- ANKI CLOZE PARSER ---
    const parseCloze = (text, targetOrdinal, isBack) => {
      if (!text) return '';
      
      // RegEx matches {{c1::answer::hint}} or {{c1::answer}}
      const regex = /\{\{c(\d+)::(.*?)(?:::(.*?))?\}\}/g;

      return text.replace(regex, (match, ord, answer, hint) => {
        const ordinal = parseInt(ord, 10);
        if (ordinal === targetOrdinal) {
          if (isBack) {
            return `<span class="cloze-revealed">${answer}</span>`;
          } else {
            return `<span class="cloze-placeholder">[${hint ? hint : '...'}]</span>`;
          }
        } else {
          // Non-active clozes are displayed as standard answer text
          return answer;
        }
      });
    };

    // Extract all cloze ordinals from note field text
    const extractClozeOrdinals = (text) => {
      const regex = /\{\{c(\d+)::/g;
      const ordinals = new Set();
      let match;
      while ((match = regex.exec(text)) !== null) {
        ordinals.add(parseInt(match[1], 10));
      }
      return Array.from(ordinals);
    };

    // --- ANKI SM-2 SCHEDULING ---
    const calculateSM2 = (card, rating) => {
      // rating: 1 = Again, 2 = Hard, 3 = Good, 4 = Easy
      let interval = card.interval || 0;
      let reps = card.reps || 0;
      let ease = card.ease || 2.5;

      if (rating === 1) { // Again
        reps = 0;
        interval = 0; // Reset or 1 min
      } else {
        if (rating === 2) { // Hard
          ease = Math.max(1.3, ease - 0.15);
          interval = interval === 0 ? 1 : Math.round(interval * 1.2);
        } else if (rating === 3) { // Good
          if (reps === 0) interval = 1;
          else if (reps === 1) interval = 6;
          else interval = Math.round(interval * ease);
        } else if (rating === 4) { // Easy
          ease = ease + 0.15;
          if (reps === 0) interval = 4;
          else if (reps === 1) interval = 10;
          else interval = Math.round(interval * ease * 1.3);
        }
        reps += 1;
      }

      // Next due date calculation
      const now = new Date();
      const dueDate = new Date(now);
      if (interval === 0) {
        dueDate.setMinutes(dueDate.getMinutes() + 1); // 1 minute
      } else {
        dueDate.setDate(dueDate.getDate() + interval);
      }

      return {
        ...card,
        reps,
        interval,
        ease,
        due: dueDate.getTime(),
        lastReviewed: now.getTime()
      };
    };

    const getIntervalBadge = (card, rating) => {
      const nextCard = calculateSM2(card, rating);
      if (nextCard.interval === 0) return '<1m';
      if (nextCard.interval === 1) return '1d';
      return `${nextCard.interval}d`;
    };

    const App = () => {
      const [view, setView] = React.useState('decks'); // 'decks', 'review', 'browser'
      const [decks, setDecks] = React.useState({});
      const [cards, setCards] = React.useState([]);
      const [selectedDeck, setSelectedDeck] = React.useState(null);
      const [reviewQueue, setReviewQueue] = React.useState([]);
      const [currentCardIndex, setCurrentCardIndex] = React.useState(0);
      const [showAnswer, setShowAnswer] = React.useState(false);
      const [isLoading, setIsLoading] = React.useState(false);
      const [loadingMsg, setLoadingMsg] = React.useState('');
      const [searchQuery, setSearchQuery] = React.useState('');
      const [selectedTag, setSelectedTag] = React.useState(null);
      const [renderedContent, setRenderedContent] = React.useState({ front: '', back: '' });

      // Media URL replacement cache
      const objectUrlCache = React.useRef(new Map());

      // Helper to process media tags inside rendered HTML content
      const processMediaTags = async (htmlContent) => {
        if (!htmlContent) return '';
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlContent, 'text/html');
        
        // Handle images
        const imgs = Array.from(doc.querySelectorAll('img'));
        for (let img of imgs) {
          const src = img.getAttribute('src');
          if (src && !src.startsWith('http') && !src.startsWith('data:')) {
            if (objectUrlCache.current.has(src)) {
              img.src = objectUrlCache.current.get(src);
            } else {
              const blob = await getMediaFromDB(src);
              if (blob) {
                const url = URL.createObjectURL(blob);
                objectUrlCache.current.set(src, url);
                img.src = url;
              }
            }
          }
        }

        // Handle Audio
        const audios = Array.from(doc.querySelectorAll('audio, [data-sound]'));
        for (let audio of audios) {
          const src = audio.getAttribute('src');
          if (src && !src.startsWith('http') && !src.startsWith('data:')) {
            if (objectUrlCache.current.has(src)) {
              audio.src = objectUrlCache.current.get(src);
            } else {
              const blob = await getMediaFromDB(src);
              if (blob) {
                const url = URL.createObjectURL(blob);
                objectUrlCache.current.set(src, url);
                audio.src = url;
              }
            }
          }
        }

        return doc.body.innerHTML;
      };

      // Process card front and back content when current review card updates
      const currentCard = reviewQueue[currentCardIndex];

      React.useEffect(() => {
        if (!currentCard) return;

        const updateContent = async () => {
          let rawFront = currentCard.front;
          let rawBack = currentCard.back;

          // If cloze card, process cloze patterns
          if (currentCard.isCloze) {
            rawFront = parseCloze(currentCard.front, currentCard.clozeOrdinal, false);
            rawBack = parseCloze(currentCard.front, currentCard.clozeOrdinal, true) + 
                      (currentCard.back ? `<hr class="my-4 border-gray-700">${currentCard.back}` : '');
          }

          const processedFront = await processMediaTags(rawFront);
          const processedBack = await processMediaTags(rawBack);

          setRenderedContent({ front: processedFront, back: processedBack });
        };

        updateContent();
      }, [currentCardIndex, currentCard]);

      // Handle APKG File Import & Extraction
      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        if (!file) return;

        setIsLoading(true);
        setLoadingMsg('Extracting APKG package...');

        try {
          await clearMediaDB();
          objectUrlCache.current.clear();

          const zip = await JSZip.loadAsync(file);
          
          // 1. Extract and store Media Files into IndexedDB
          setLoadingMsg('Processing & caching media assets...');
          const mediaFile = zip.file('media');
          if (mediaFile) {
            const mediaJsonText = await mediaFile.async('text');
            const mediaMap = JSON.parse(mediaJsonText); // {"0": "image.jpg", "1": "sound.mp3"}

            for (const [key, filename] of Object.entries(mediaMap)) {
              const zipItem = zip.file(key);
              if (zipItem) {
                const blob = await zipItem.async('blob');
                await saveMediaToDB(filename, blob);
              }
            }
          }

          // 2. Extract collection SQLite database
          setLoadingMsg('Parsing SQLite collection database...');
          let dbFile = zip.file('collection.anki2') || zip.file('collection.anki21');
          if (!dbFile) {
            throw new Error('Invalid APKG file: collection database not found.');
          }

          const dbBuffer = await dbFile.async('arraybuffer');
          const SQL = await initSqlJs({
            locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
          });
          const db = new SQL.Database(new Uint8Array(dbBuffer));

          // 3. Query decks, notes, and cards
          const parsedDecks = {};
          const parsedCards = [];

          // Get decks configuration
          const decksQuery = db.exec("SELECT val FROM col");
          if (decksQuery.length > 0) {
            const colVal = JSON.parse(decksQuery[0].values[0][0]);
            const deckMeta = colVal.decks || {};
            Object.values(deckMeta).forEach(d => {
              parsedDecks[d.id] = d.name;
            });
          }

          // Query notes and cards
          const notesStmt = db.prepare(`
            SELECT cards.id, cards.did, notes.flds, notes.sfld, notes.tags, models.css, models.flds as model_flds
            FROM cards 
            JOIN notes ON cards.nid = notes.id 
            JOIN models ON notes.mid = models.id
          `);

          while (notesStmt.step()) {
            const row = notesStmt.getAsObject();
            const fields = row.flds.split('\x1f');
            const tags = row.tags ? row.tags.trim().split(/\s+/).filter(Boolean) : [];
            const deckName = parsedDecks[row.did] || 'Default';

            const frontField = fields[0] || '';
            const backField = fields.slice(1).join('<br>') || '';

            // Check for cloze deletions
            const clozeOrdinals = extractClozeOrdinals(frontField);

            if (clozeOrdinals.length > 0) {
              // Generate a card instance per cloze ordinal
              clozeOrdinals.forEach(ord => {
                parsedCards.push({
                  id: `${row.id}_c${ord}`,
                  deckId: row.did,
                  deckName: deckName,
                  front: frontField,
                  back: backField,
                  tags: tags,
                  isCloze: true,
                  clozeOrdinal: ord,
                  reps: 0,
                  interval: 0,
                  ease: 2.5,
                  due: Date.now()
                });
              });
            } else {
              // Regular Card
              parsedCards.push({
                id: row.id,
                deckId: row.did,
                deckName: deckName,
                front: frontField,
                back: backField,
                tags: tags,
                isCloze: false,
                reps: 0,
                interval: 0,
                ease: 2.5,
                due: Date.now()
              });
            }
          }

          notesStmt.free();
          db.close();

          setCards(parsedCards);

          // Group counts by Deck
          const deckCounts = {};
          parsedCards.forEach(c => {
            deckCounts[c.deckName] = (deckCounts[c.deckName] || 0) + 1;
          });
          setDecks(deckCounts);

          setIsLoading(false);
        } catch (err) {
          console.error(err);
          alert('Error parsing APKG file: ' + err.message);
          setIsLoading(false);
        }
      };

      // Start Reviewing a Deck
      const startReview = (deckName) => {
        setSelectedDeck(deckName);
        const queue = cards.filter(c => c.deckName === deckName);
        setReviewQueue(queue);
        setCurrentCardIndex(0);
        setShowAnswer(false);
        setView('review');
      };

      // Rating Action (SM-2)
      const handleRating = (rating) => {
        if (!currentCard) return;

        const updatedCard = calculateSM2(currentCard, rating);
        
        // Update main card state
        setCards(prev => prev.map(c => c.id === updatedCard.id ? updatedCard : c));

        if (rating === 1) { // Re-queue 'Again' cards at the end of session
          setReviewQueue(prev => [...prev, updatedCard]);
        }

        if (currentCardIndex + 1 < reviewQueue.length) {
          setCurrentCardIndex(prev => prev + 1);
          setShowAnswer(false);
        } else {
          // Finished review queue
          setView('decks');
        }
      };

      // Helper to build hierarchy tree from Anki tags (e.g. Science::Biology::Cells)
      const buildTagTree = () => {
        const tree = {};
        cards.forEach(card => {
          card.tags.forEach(tag => {
            const parts = tag.split('::');
            let current = tree;
            parts.forEach((part, idx) => {
              if (!current[part]) {
                current[part] = { _fullTag: parts.slice(0, idx + 1).join('::'), _children: {} };
              }
              current = current[part]._children;
            });
          });
        });
        return tree;
      };

      // Recursive Tag Tree Component
      const TagTreeNode = ({ name, node, depth = 0 }) => {
        const [isOpen, setIsOpen] = React.useState(false);
        const hasChildren = Object.keys(node._children).length > 0;

        return (
          <div style={{ paddingLeft: `${depth * 12}px` }} class="my-1">
            <div 
              class={`flex items-center justify-between p-2 rounded-lg cursor-pointer text-sm font-medium transition ${
                selectedTag === node._fullTag ? 'bg-brand-600 text-white' : 'hover:bg-gray-800 text-gray-300'
              }`}
              onClick={() => setSelectedTag(node._fullTag)}
            >
              <div class="flex items-center gap-2 truncate">
                {hasChildren ? (
                  <button 
                    onClick={(e) => { e.stopPropagation(); setIsOpen(!isOpen); }}
                    class="w-5 h-5 flex items-center justify-center text-gray-400 hover:text-white"
                  >
                    <i class={`fa-solid fa-chevron-${isOpen ? 'down' : 'right'} text-xs`}></i>
                  </button>
                ) : (
                  <span class="w-5"></span>
                )}
                <i class="fa-solid fa-tag text-xs text-gray-400"></i>
                <span class="truncate">{name}</span>
              </div>
            </div>
            {isOpen && hasChildren && (
              <div class="mt-1">
                {Object.entries(node._children).map(([childName, childNode]) => (
                  <TagTreeNode key={childNode._fullTag} name={childName} node={childNode} depth={depth + 1} />
                ))}
              </div>
            )}
          </div>
        );
      };

      return (
        <div class="flex flex-col h-screen w-screen overflow-hidden bg-gray-950 text-gray-100">
          
          <!-- TOP NAVBAR -->
          <header class="h-16 bg-gray-900 border-b border-gray-800 flex items-center justify-between px-6 flex-shrink-0 z-10">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-cyan-500 flex items-center justify-center shadow-lg shadow-brand-500/20">
                <i class="fa-solid fa-bolt text-white text-xl"></i>
              </div>
              <h1 class="text-xl font-bold tracking-wide bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">
                AnkiFlow <span class="text-xs text-brand-500 uppercase px-2 py-0.5 rounded bg-brand-500/10 font-semibold border border-brand-500/20">Tablet</span>
              </h1>
            </div>

            <!-- Navigation Bar Controls -->
            <div class="flex items-center gap-2 bg-gray-950 p-1 rounded-xl border border-gray-800">
              <button 
                onClick={() => setView('decks')} 
                class={`px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 ${
                  view === 'decks' ? 'bg-gray-800 text-white shadow-sm' : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                <i class="fa-solid fa-layer-group"></i> Decks
              </button>
              <button 
                onClick={() => setView('browser')} 
                class={`px-4 py-2 rounded-lg text-sm font-medium transition flex items-center gap-2 ${
                  view === 'browser' ? 'bg-gray-800 text-white shadow-sm' : 'text-gray-400 hover:text-gray-200'
                }`}
              >
                <i class="fa-solid fa-folder-tree"></i> Browser
              </button>
            </div>

            <!-- File Upload Button -->
            <label class="cursor-pointer bg-brand-600 hover:bg-brand-500 text-white px-4 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg shadow-brand-600/20 active:scale-95">
              <i class="fa-solid fa-file-import"></i>
              <span>Import .apkg</span>
              <input type="file" accept=".apkg" onChange={handleFileUpload} class="hidden" />
            </label>
          </header>

          <!-- MAIN CONTAINER -->
          <main class="flex-1 overflow-hidden relative">

            {/* LOADING OVERLAY */}
            {isLoading && (
              <div class="absolute inset-0 bg-gray-950/80 backdrop-blur-md z-50 flex flex-col items-center justify-center gap-4">
                <div class="w-12 h-12 border-4 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
                <p class="text-lg font-medium text-gray-200">{loadingMsg}</p>
              </div>
            )}

            {/* VIEW 1: DECKS DASHBOARD */}
            {view === 'decks' && (
              <div class="h-full overflow-y-auto p-6 md:p-8 max-w-6xl mx-auto">
                <div class="flex items-center justify-between mb-8">
                  <div>
                    <h2 class="text-2xl font-bold text-white">Your Decks</h2>
                    <p class="text-sm text-gray-400">Select a deck to begin your review session</p>
                  </div>
                  <div class="text-sm bg-gray-900 border border-gray-800 px-4 py-2 rounded-xl text-gray-400">
                    Total Cards Loaded: <span class="text-white font-bold">{cards.length}</span>
                  </div>
                </div>

                {Object.keys(decks).length === 0 ? (
                  <div class="border-2 border-dashed border-gray-800 rounded-3xl p-12 text-center flex flex-col items-center justify-center my-12">
                    <div class="w-16 h-16 rounded-full bg-gray-900 flex items-center justify-center text-gray-600 text-2xl mb-4">
                      <i class="fa-solid fa-box-open"></i>
                    </div>
                    <h3 class="text-xl font-semibold text-gray-300 mb-2">No Decks Imported Yet</h3>
                    <p class="text-gray-500 max-w-sm mb-6">Upload an Anki deck (.apkg file) using the top right import button to get started.</p>
                  </div>
                ) : (
                  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {Object.entries(decks).map(([deckName, count]) => (
                      <div 
                        key={deckName}
                        class="bg-gray-900/60 border border-gray-800 hover:border-gray-700 rounded-2xl p-6 transition flex flex-col justify-between hover:shadow-xl group"
                      >
                        <div>
                          <div class="flex items-start justify-between mb-4">
                            <h3 class="text-lg font-bold text-gray-100 group-hover:text-brand-500 transition line-clamp-2">{deckName}</h3>
                            <span class="bg-gray-800 text-gray-300 text-xs font-semibold px-2.5 py-1 rounded-full border border-gray-700">
                              {count} cards
                            </span>
                          </div>
                          <div class="flex items-center gap-4 text-xs text-gray-400 mb-6">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-circle-dot text-brand-500"></i> New: {count}</span>
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-clock text-amber-500"></i> Review: 0</span>
                          </div>
                        </div>

                        <button 
                          onClick={() => startReview(deckName)}
                          class="w-full bg-gray-800 group-hover:bg-brand-600 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 text-sm shadow-md"
                        >
                          <i class="fa-solid fa-play text-xs"></i> Study Deck
                        </button>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* VIEW 2: REVIEW MODE */}
            {view === 'review' && currentCard && (
              <div class="h-full flex flex-col justify-between max-w-4xl mx-auto p-4 md:p-6">
                <!-- Session Header -->
                <div class="flex items-center justify-between text-sm text-gray-400 mb-2">
                  <span class="font-medium text-gray-300 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-brand-500"></i> {selectedDeck}
                  </span>
                  <span>
                    Card <strong class="text-white">{currentCardIndex + 1}</strong> of <strong class="text-white">{reviewQueue.length}</strong>
                  </span>
                </div>

                <!-- CARD DISPLAY CONTAINER -->
                <div class="flex-1 bg-gray-900 border border-gray-800 rounded-3xl p-6 md:p-10 flex flex-col justify-center overflow-y-auto my-2 relative shadow-2xl">
                  
                  {/* FRONT SIDE CONTENT */}
                  <div 
                    class="card-content text-lg md:text-xl text-gray-100 font-normal leading-relaxed text-center"
                    dangerouslySetInnerHTML={{ __html: renderedContent.front }}
                  />

                  {/* REVEALED BACK SIDE CONTENT */}
                  {showAnswer && (
                    <div class="mt-8 pt-8 border-t border-gray-800/80 animate-fadeIn">
                      <div 
                        class="card-content text-lg md:text-xl text-gray-200 font-normal leading-relaxed text-center"
                        dangerouslySetInnerHTML={{ __html: renderedContent.back }}
                      />
                    </div>
                  )}
                </div>

                <!-- BOTTOM TABLET TOUCH CONTROLS -->
                <div class="pt-2">
                  {!showAnswer ? (
                    <button 
                      onClick={() => setShowAnswer(true)}
                      class="w-full bg-brand-600 hover:bg-brand-500 text-white font-bold py-5 rounded-2xl text-lg shadow-xl shadow-brand-600/20 active:scale-[0.99] transition flex items-center justify-center gap-3"
                    >
                      <i class="fa-solid fa-eye"></i> Show Answer
                    </button>
                  ) : (
                    <div class="grid grid-cols-4 gap-3">
                      {/* AGAIN BUTTON */}
                      <button 
                        onClick={() => handleRating(1)}
                        class="bg-red-500/10 hover:bg-red-500/20 border border-red-500/30 text-red-400 hover:text-red-300 font-semibold p-4 rounded-2xl flex flex-col items-center justify-center gap-1 transition active:scale-95"
                      >
                        <span class="text-xs uppercase tracking-wider font-bold opacity-80">Again</span>
                        <span class="text-sm bg-red-500/20 px-2 py-0.5 rounded text-red-300">
                          {getIntervalBadge(currentCard, 1)}
                        </span>
                      </button>

                      {/* HARD BUTTON */}
                      <button 
                        onClick={() => handleRating(2)}
                        class="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 text-amber-400 hover:text-amber-300 font-semibold p-4 rounded-2xl flex flex-col items-center justify-center gap-1 transition active:scale-95"
                      >
                        <span class="text-xs uppercase tracking-wider font-bold opacity-80">Hard</span>
                        <span class="text-sm bg-amber-500/20 px-2 py-0.5 rounded text-amber-300">
                          {getIntervalBadge(currentCard, 2)}
                        </span>
                      </button>

                      {/* GOOD BUTTON */}
                      <button 
                        onClick={() => handleRating(3)}
                        class="bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 hover:text-emerald-300 font-semibold p-4 rounded-2xl flex flex-col items-center justify-center gap-1 transition active:scale-95"
                      >
                        <span class="text-xs uppercase tracking-wider font-bold opacity-80">Good</span>
                        <span class="text-sm bg-emerald-500/20 px-2 py-0.5 rounded text-emerald-300">
                          {getIntervalBadge(currentCard, 3)}
                        </span>
                      </button>

                      {/* EASY BUTTON */}
                      <button 
                        onClick={() => handleRating(4)}
                        class="bg-cyan-500/10 hover:bg-cyan-500/20 border border-cyan-500/30 text-cyan-400 hover:text-cyan-300 font-semibold p-4 rounded-2xl flex flex-col items-center justify-center gap-1 transition active:scale-95"
                      >
                        <span class="text-xs uppercase tracking-wider font-bold opacity-80">Easy</span>
                        <span class="text-sm bg-cyan-500/20 px-2 py-0.5 rounded text-cyan-300">
                          {getIntervalBadge(currentCard, 4)}
                        </span>
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* VIEW 3: CARD BROWSER */}
            {view === 'browser' && (
              <div class="h-full flex overflow-hidden">
                <!-- SIDEBAR: TAG TREE & FILTERS -->
                <aside class="w-72 bg-gray-900 border-r border-gray-800 flex flex-col p-4 overflow-y-auto flex-shrink-0">
                  <div class="flex items-center justify-between mb-4 px-2">
                    <span class="text-xs font-bold text-gray-400 uppercase tracking-wider">Tags & Structure</span>
                    {selectedTag && (
                      <button 
                        onClick={() => setSelectedTag(null)}
                        class="text-xs text-brand-400 hover:underline"
                      >
                        Clear Tag
                      </button>
                    )}
                  </div>

                  <div class="space-y-1">
                    {Object.entries(buildTagTree()).map(([tagName, node]) => (
                      <TagTreeNode key={node._fullTag} name={tagName} node={node} />
                    ))}
                  </div>
                </aside>

                <!-- MAIN BROWSER CONTENT -->
                <section class="flex-1 flex flex-col overflow-hidden p-6 bg-gray-950">
                  <!-- Search Bar -->
                  <div class="mb-4 flex gap-3">
                    <div class="relative flex-1">
                      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                      <input 
                        type="text"
                        placeholder="Search card content or front text..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        class="w-full bg-gray-900 border border-gray-800 rounded-xl pl-11 pr-4 py-3 text-sm text-white focus:outline-none focus:border-brand-500 transition"
                      />
                    </div>
                  </div>

                  <!-- Cards Table / List -->
                  <div class="flex-1 overflow-y-auto border border-gray-800 rounded-2xl bg-gray-900/40">
                    <table class="w-full text-left text-sm text-gray-300 border-collapse">
                      <thead class="bg-gray-900 text-xs uppercase text-gray-400 sticky top-0 border-b border-gray-800">
                        <tr>
                          <th class="p-4">Front Content</th>
                          <th class="p-4">Deck</th>
                          <th class="p-4">Tags</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-gray-800/60">
                        {cards
                          .filter(card => {
                            const matchesSearch = searchQuery === '' || 
                              card.front.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              card.back.toLowerCase().includes(searchQuery.toLowerCase());
                            const matchesTag = !selectedTag || card.tags.some(t => t.startsWith(selectedTag));
                            return matchesSearch && matchesTag;
                          })
                          .map((card) => (
                            <tr key={card.id} class="hover:bg-gray-800/40 transition">
                              <td class="p-4 max-w-md truncate font-medium text-gray-200">
                                {card.front.replace(/<[^>]*>?/gm, '')}
                              </td>
                              <td class="p-4 text-gray-400 whitespace-nowrap">{card.deckName}</td>
                              <td class="p-4">
                                <div class="flex flex-wrap gap-1">
                                  {card.tags.map(tag => (
                                    <span key={tag} class="bg-gray-800 text-gray-400 text-xs px-2 py-0.5 rounded border border-gray-700">
                                      {tag}
                                    </span>
                                  ))}
                                </div>
                              </td>
                            </tr>
                          ))}
                      </tbody>
                    </table>
                  </div>
                </section>
              </div>
            )}

          </main>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
